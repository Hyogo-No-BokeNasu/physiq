<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PhysiQ ― 毎日つづくゲーム感覚物理クイズ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f0f7ff;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      --border: #e2e8f0;
      --green: #16a34a;
      --green-dark: #15803d;
      --green-soft: #dcfce7;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #dbeafe;
      --orange: #f97316;
      --orange-soft: #ffedd5;
      --red: #e11d48;
      --red-soft: #ffe4e6;
      --gold: #eab308;
      /* Theme accent (XPショップのテーマカラーで切り替わる) */
      --accent-light: #3b82f6;
      --accent-ring: #bfdbfe;
      --accent-deep: #1e3a8a;
      --accent-bg: #eff6ff;
      --font-sans: 'Inter', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0;
      font-family: var(--font-sans);
      background: var(--bg-app);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
    }

    /* Top HUD */
    .hud {
      position: sticky; top: 0; z-index: 40;
      background: rgba(255,255,255,0.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid var(--border);
      padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
    }
    .hud-inner {
      max-width: 820px; margin: 0 auto; min-height: 60px; padding: 6px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; color: var(--blue-dark); flex-shrink: 0; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--blue), #16a34a);
      color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
    }

    .hud-stats { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
    .stat-btn > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30vw; }
    .stat-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 800;
      background: var(--bg-subtle); border: 1.5px solid var(--border); white-space: nowrap;
    }
    .stat-streak { color: #ea580c; border-color: #fed7aa; background: #fff7ed; }
    .stat-xp { color: var(--blue); border-color: var(--accent-ring); background: var(--accent-bg); }
    .stat-btn {
      min-height: 36px; padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--bg-card); color: var(--text-main); font-size: 12.5px; font-weight: 700;
      cursor: pointer; font-family: var(--font-sans); display: inline-flex; align-items: center; gap: 4px;
    }
    .stat-btn:hover { border-color: var(--blue); }

    /* Main Layout */
    .container {
      max-width: 720px; margin: 0 auto; padding: 18px 14px 80px;
    }

    /* Daily Challenge & Streak Card */
    .daily-card {
      background: linear-gradient(135deg, var(--accent-deep), var(--blue));
      color: #fff; border-radius: 18px; padding: 18px 20px; margin-bottom: 22px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.22);
    }
    .daily-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .daily-badge {
      display: inline-block; background: rgba(255,255,255,0.2); padding: 3px 10px;
      border-radius: 999px; font-size: 11.5px; font-weight: 700; margin-bottom: 6px;
    }
    .week-dots {
      display: flex; gap: 8px; margin-top: 14px; justify-content: space-between;
    }
    .day-dot {
      flex: 1; text-align: center; background: rgba(255,255,255,0.14);
      border-radius: 10px; padding: 6px 4px; font-size: 11px; font-weight: 700;
    }
    .day-dot.done { background: #22c55e; color: #052e16; }

    /* Buttons (3D tactile Duolingo style) */
    .btn-3d {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 46px; padding: 10px 20px; border-radius: 14px; border: none;
      font-family: var(--font-sans); font-size: 15px; font-weight: 800; cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn-3d:active { transform: translateY(3px); }
    .btn-green { background: #22c55e; color: #fff; box-shadow: 0 4px 0 #15803d; }
    .btn-green:active { box-shadow: 0 1px 0 #15803d; }
    .btn-blue { background: var(--accent-light); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); }
    .btn-blue:active { box-shadow: 0 1px 0 var(--blue-dark); }
    .btn-amber { background: #f59e0b; color: #fff; box-shadow: 0 4px 0 #b45309; }
    .btn-amber:active { box-shadow: 0 1px 0 #b45309; }
    .btn-ghost { background: var(--bg-card); color: var(--text-main); border: 2px solid var(--border); box-shadow: 0 3px 0 var(--border); }
    .btn-ghost:active { box-shadow: 0 1px 0 var(--border); }

    /* Winding Stage Path */
    .stage-path {
      display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 8px 0 20px;
    }
    .stage-node-wrap {
      display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 340px;
      position: relative;
    }
    .stage-node {
      width: 100%; background: var(--bg-card); border: 2px solid var(--border);
      border-radius: 18px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 5px 0 var(--border); cursor: pointer;
      transition: transform 0.12s, border-color 0.15s;
      text-align: left; font-family: var(--font-sans);
    }
    .stage-node:hover:not(.locked) { transform: translateY(-2px); border-color: var(--blue); }
    .stage-node.unlocked { border-color: var(--accent-light); box-shadow: 0 5px 0 var(--accent-ring); }
    .stage-node.cleared { border-color: #22c55e; box-shadow: 0 5px 0 #bbf7d0; }
    .stage-node.locked { opacity: 0.58; cursor: not-allowed; background: #f1f5f9; }

    .stage-circle {
      width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #fff;
    }
    .stage-stars { font-size: 13px; color: #eab308; letter-spacing: 2px; margin-top: 2px; }
    .intro-btn {
      background: var(--blue-soft); border: 1.5px solid var(--blue); color: var(--blue-dark);
      border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800;
      cursor: pointer; font-family: var(--font-sans); white-space: nowrap;
    }
    .intro-btn:active { transform: translateY(1px); }
    .term-card {
      background: #f8fafc; border: 2px solid var(--border); border-radius: 14px;
      padding: 12px 14px; margin-bottom: 10px; text-align: left;
    }
    .term-card .t-word { font-weight: 800; font-size: 15.5px; }
    .term-card .t-what { font-size: 14px; line-height: 1.65; margin-top: 4px; }
    .glossary-link {
      background: none; border: none; color: var(--blue); font-weight: 800;
      cursor: pointer; font-size: 13px; padding: 4px 0 0; font-family: var(--font-sans);
    }

    /* Quiz Screen */
    .quiz-screen {
      background: var(--bg-card); border: 2px solid var(--border);
      border-radius: 20px; padding: 22px 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
    }
    .quiz-progress-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    }
    .q-bar-track { flex: 1; height: 12px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .q-bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, var(--accent-light)); transition: width 0.3s ease; }

    .combo-badge {
      display: inline-block; background: var(--orange-soft); color: #c2410c;
      font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px;
    }
    .q-text { font-size: 18px; font-weight: 700; line-height: 1.55; margin-bottom: 18px; }

    .choices-grid { display: grid; gap: 10px; }
    .choice-btn {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      min-height: 54px; padding: 12px 16px; border-radius: 14px;
      border: 2px solid var(--border); background: var(--bg-card);
      box-shadow: 0 3px 0 var(--border); color: var(--text-main);
      font-size: 15.5px; font-weight: 600; cursor: pointer; font-family: var(--font-sans);
      transition: all 0.1s;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--blue); background: #f8fbff; }
    .choice-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--border); }
    .choice-btn.correct { border-color: var(--green); background: var(--green-soft); box-shadow: 0 3px 0 #86efac; }
    .choice-btn.wrong { border-color: var(--red); background: var(--red-soft); box-shadow: 0 3px 0 #fda4af; }

    .feedback-banner {
      margin-top: 18px; padding: 14px 16px; border-radius: 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .feedback-banner.ok { background: var(--green-soft); border: 1.5px solid #86efac; }
    .feedback-banner.ng { background: var(--red-soft); border: 1.5px solid #fda4af; }

    /* Auth / Account Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--bg-card); border-radius: 20px; max-width: 460px; width: 100%;
      padding: 24px 22px; box-shadow: 0 24px 50px rgba(0,0,0,0.28);
      max-height: 90vh; max-height: 90dvh; overflow-y: auto;
    }
    .avatar-grid { display: flex; gap: 7px; flex-wrap: wrap; margin: 10px 0 16px; }
    .avatar-opt {
      width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--border);
      background: var(--bg-subtle); font-size: 22px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .avatar-opt.selected { border-color: var(--blue); background: var(--blue-soft); }

    .text-input {
      width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: 12px;
      font-size: 15px; font-family: var(--font-sans); -webkit-appearance: none;
    }
    .text-input:focus { outline: none; border-color: var(--blue); }

    /* Built-in Math Renderer */
    .math-inline { font-family: 'Times New Roman', Georgia, serif; font-size: 1.08em; padding: 0 1px; }
    .math-frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 3px; font-size: 0.9em; line-height: 1.15; }
    .math-frac > .num { border-bottom: 1.2px solid currentColor; padding: 0 4px 2px; }
    .math-frac > .den { padding: 2px 4px 0; }
    .math-sqrt { display: inline-flex; align-items: center; vertical-align: middle; }
    .math-sqrt-body { border-top: 1.2px solid currentColor; padding: 1px 3px 0; }

    /* Gentle animations (subtle, easy on the eyes) */
    @keyframes fadeUp { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
    @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shakeX { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    @keyframes pulseOk { 0% { transform: scale(1); } 40% { transform: scale(1.02); } 100% { transform: scale(1); } }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .quiz-screen { animation: fadeUp 0.28s ease both; }
    .daily-card { animation: fadeUp 0.3s ease both; }
    .stage-node-wrap { animation: fadeUp 0.35s ease both; }
    .stage-path .stage-node-wrap:nth-child(2) { animation-delay: 0.03s; }
    .stage-path .stage-node-wrap:nth-child(3) { animation-delay: 0.06s; }
    .stage-path .stage-node-wrap:nth-child(4) { animation-delay: 0.09s; }
    .stage-path .stage-node-wrap:nth-child(5) { animation-delay: 0.12s; }
    .stage-path .stage-node-wrap:nth-child(6) { animation-delay: 0.15s; }
    .stage-path .stage-node-wrap:nth-child(7) { animation-delay: 0.18s; }
    .stage-path .stage-node-wrap:nth-child(8) { animation-delay: 0.21s; }
    .stage-path .stage-node-wrap:nth-child(9) { animation-delay: 0.24s; }
    .stage-path .stage-node-wrap:nth-child(10) { animation-delay: 0.27s; }
    .choice-btn.correct { animation: pulseOk 0.3s ease; }
    .choice-btn.wrong { animation: shakeX 0.3s ease; }
    .combo-badge { animation: popIn 0.25s ease both; }
    .feedback-banner { animation: fadeUp 0.25s ease both; }
    .modal-card { animation: modalIn 0.22s ease both; }
    .btn-3d:hover { transform: translateY(-1px); }
    .stage-stars { animation: popIn 0.3s ease both; }

    /* Home nav (単語帳 / 教科書) */
    .home-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
    .nav-card {
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      background: var(--bg-card); border: 2px solid var(--border); border-radius: 18px;
      padding: 16px; cursor: pointer; font-family: var(--font-sans); text-align: left;
      box-shadow: 0 5px 0 var(--border); transition: transform 0.12s, border-color 0.15s;
      animation: fadeUp 0.35s ease both;
    }
    .nav-card:hover { transform: translateY(-2px); border-color: var(--blue); }
    .nav-card .nav-icon { font-size: 26px; }
    .nav-card .nav-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
    .nav-card .nav-sub { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    /* Sub screens (単語帳 / 教科書) */
    .sub-screen { animation: fadeUp 0.28s ease both; }
    .sub-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .sub-head h2 { margin: 0; font-size: 19px; }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip {
      padding: 7px 14px; border-radius: 999px; border: 2px solid var(--border);
      background: var(--bg-card); color: var(--text-muted); font-size: 13px; font-weight: 800;
      cursor: pointer; font-family: var(--font-sans);
    }
    .chip.active { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-dark); }

    /* Word list */
    .word-item {
      width: 100%; background: var(--bg-card); border: 2px solid var(--border); border-radius: 14px;
      padding: 12px 16px; margin-bottom: 10px; text-align: left; cursor: pointer;
      font-family: var(--font-sans); box-shadow: 0 3px 0 var(--border); color: var(--text-main);
    }
    .word-item .w-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .word-item .w-term { font-size: 16.5px; font-weight: 800; }
    .word-item .w-reading { font-size: 12px; color: var(--text-light); font-weight: 700; }
    .field-tag {
      margin-left: auto; font-size: 11px; font-weight: 800; padding: 2px 9px;
      border-radius: 999px; background: var(--blue-soft); color: var(--blue-dark); white-space: nowrap;
    }
    .word-item .w-def { display: none; margin-top: 8px; font-size: 14px; line-height: 1.6; color: var(--text-muted); }
    .word-item.open .w-def { display: block; animation: fadeUp 0.22s ease both; }
    .word-item .w-formula { margin-top: 6px; font-size: 15px; color: var(--text-main); }

    /* Flashcard */
    .flash-wrap { perspective: 900px; margin-bottom: 16px; }
    .flash-card {
      position: relative; width: 100%; min-height: 230px; cursor: pointer;
      transform-style: preserve-3d; transition: transform 0.45s ease;
    }
    .flash-card.flipped { transform: rotateY(180deg); }
    .flash-face {
      position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden;
      background: var(--bg-card); border: 2px solid var(--border); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 20px; text-align: center; gap: 8px;
    }
    .flash-face.back { transform: rotateY(180deg); justify-content: flex-start; overflow-y: auto; }
    .flash-term { font-size: 30px; font-weight: 800; }
    .flash-reading { font-size: 14px; color: var(--text-light); font-weight: 700; }
    .flash-hint { font-size: 12px; color: var(--text-light); margin-top: 10px; }
    .flash-def { font-size: 15.5px; line-height: 1.7; text-align: left; }
    .flash-formula { font-size: 17px; margin-top: 8px; }
    .flash-nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    /* Textbook */
    .lesson-item {
      width: 100%; display: flex; align-items: center; gap: 14px;
      background: var(--bg-card); border: 2px solid var(--border); border-radius: 18px;
      padding: 14px 16px; margin-bottom: 12px; cursor: pointer; text-align: left;
      font-family: var(--font-sans); box-shadow: 0 5px 0 var(--border); color: var(--text-main);
      transition: transform 0.12s, border-color 0.15s;
    }
    .lesson-item:hover { transform: translateY(-2px); border-color: var(--blue); }
    .lesson-body { font-size: 15px; line-height: 1.75; }
    .lesson-body h3 { font-size: 16px; margin: 20px 0 8px; color: var(--blue-dark); }
    .lesson-body ul { margin: 6px 0; padding-left: 20px; }
    .lesson-body li { margin-bottom: 6px; }
    .formula-box {
      background: var(--blue-soft); border: 1.5px solid var(--accent-ring); border-radius: 14px;
      padding: 14px 16px; text-align: center; font-size: 18px; margin: 10px 0;
    }
    .example-box {
      background: #fff7ed; border: 1.5px solid #fed7aa; border-radius: 14px;
      padding: 14px 16px; margin: 10px 0; font-size: 14.5px; line-height: 1.7;
    }

    /* Account benefits box */
    .benefit-box {
      background: var(--green-soft); border: 1.5px solid #86efac; border-radius: 14px;
      padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.6; color: var(--text-main);
    }
    .benefit-box .b-title { font-weight: 800; margin-bottom: 4px; }
    .benefit-box ul { margin: 0; padding-left: 18px; }
    .benefit-box li { margin-bottom: 2px; }

    /* Title strip (home) */
    .title-strip {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
      background: var(--bg-card); border: 2px solid var(--border); border-radius: 16px;
      padding: 10px 14px; margin-bottom: 14px; font-size: 13px;
      box-shadow: 0 4px 0 var(--border);
    }
    .title-strip > span { min-width: 0; overflow-wrap: anywhere; }
    .title-strip .t-progress {
      flex: 1 1 120px; min-width: 110px; height: 8px; border-radius: 99px;
      background: var(--border); overflow: hidden;
    }
    .title-strip .t-progress > div { height: 100%; background: var(--blue); border-radius: 99px; }

    /* Beginner guide steps (home) */
    .guide-card {
      background: var(--blue-soft); border: 1.5px solid var(--accent-ring); border-radius: 18px;
      padding: 14px 16px; margin-bottom: 14px;
    }
    .guide-steps { display: flex; gap: 10px; flex-wrap: wrap; }
    .guide-step {
      flex: 1 1 150px; display: flex; align-items: center; gap: 10px; text-align: left;
      background: var(--bg-card); border: 2px solid var(--border); border-radius: 14px;
      padding: 10px 12px; cursor: pointer; font-family: var(--font-sans); color: var(--text-main);
      box-shadow: 0 3px 0 var(--border); transition: transform 0.12s, border-color 0.15s;
    }
    .guide-step:hover { transform: translateY(-2px); border-color: var(--blue); }
    .guide-step .g-num {
      flex: none; width: 26px; height: 26px; border-radius: 50%;
      background: var(--blue); color: #fff; font-weight: 800; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .guide-step .g-title { font-weight: 800; font-size: 13.5px; }
    .guide-step .g-sub { font-size: 11.5px; color: var(--text-muted); }
    .guide-step > span:last-child { min-width: 0; overflow-wrap: anywhere; }

    /* Badges (profile modal) */
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .badge-item {
      border: 2px solid var(--border); border-radius: 14px; padding: 10px 6px;
      text-align: center; background: var(--bg-card); opacity: 0.45; filter: grayscale(0.8);
    }
    .badge-item.earned { opacity: 1; filter: none; border-color: #fbbf24; background: #fffbeb; }
    .badge-item .b-icon { font-size: 24px; }
    .badge-item .b-name { font-size: 12px; font-weight: 800; margin-top: 2px; }
    .badge-item .b-desc { font-size: 10.5px; color: var(--text-muted); line-height: 1.35; margin-top: 2px; }

    /* Toast (badge unlock etc.) */
    .toast-wrap {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center;
      pointer-events: none; width: max-content; max-width: 92vw;
    }
    .toast {
      background: #1e293b; color: #fff; font-weight: 800; font-size: 14px;
      padding: 11px 18px; border-radius: 99px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      animation: toastIn 0.3s ease both; text-align: center;
    }
    .toast.hide { opacity: 0; transform: translateY(8px); transition: opacity 0.35s, transform 0.35s; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* XP Shop */
    .shop-item {
      background: var(--bg-card); border: 2px solid var(--border); border-radius: 16px;
      padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 4px 0 var(--border);
      display: flex; gap: 12px; align-items: flex-start;
      animation: fadeUp 0.3s ease both;
    }
    .shop-item .s-icon { font-size: 30px; flex-shrink: 0; line-height: 1.2; }
    .shop-item .s-main { flex: 1; min-width: 0; }
    .shop-item .s-name { font-weight: 800; font-size: 15.5px; }
    .shop-item .s-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; margin-top: 2px; overflow-wrap: anywhere; }
    .shop-item .s-own { font-size: 12px; font-weight: 800; color: var(--blue-dark); margin-top: 4px; }
    .shop-item .s-buy { flex-shrink: 0; }
    .theme-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
    .theme-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .theme-dot {
      width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--border);
      cursor: pointer; padding: 0; transition: transform 0.1s, border-color 0.1s;
    }
    .theme-dot.selected { border-color: var(--text-main); transform: scale(1.1); }
    .theme-dot:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Hint in quiz */
    .hint-bar { margin-bottom: 12px; }
    .choice-btn.eliminated { opacity: 0.35; text-decoration: line-through; pointer-events: none; }

    /* XP Boost banner (home) */
    .boost-banner {
      display: flex; align-items: center; gap: 10px;
      background: #fef9c3; border: 2px solid #fde047; border-radius: 16px;
      padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; font-weight: 800; color: #854d0e;
      box-shadow: 0 4px 0 #fde047;
      animation: fadeUp 0.3s ease both;
    }

    /* Weekly daily-bonus board */
    .bonus-board-card {
      background: var(--bg-card); border: 2px solid var(--border); border-radius: 18px;
      padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 5px 0 var(--border);
      animation: fadeUp 0.35s ease both;
    }
    .bonus-cells { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
    .bonus-cell {
      border: 2px solid var(--border); border-radius: 12px; padding: 8px 2px 6px;
      text-align: center; background: var(--bg-subtle); min-width: 0;
    }
    .bonus-cell .bc-icon { font-size: 19px; line-height: 1.25; }
    .bonus-cell .bc-label { font-size: 9.5px; font-weight: 800; color: var(--text-muted); line-height: 1.3; overflow-wrap: anywhere; }
    .bonus-cell .bc-day { font-size: 9px; font-weight: 800; color: var(--text-light); }
    .bonus-cell.done { background: var(--green-soft); border-color: #22c55e; }
    .bonus-cell.done .bc-label { color: var(--green-dark); }
    .bonus-cell.next { border-color: var(--gold); background: #fefce8; box-shadow: 0 0 0 2px #fef08a; }
    .bonus-complete {
      margin-top: 10px; border: 2px dashed #f59e0b; background: #fffbeb; border-radius: 12px;
      padding: 8px 12px; font-size: 13px; font-weight: 800; color: #92400e; text-align: center;
    }
    .bonus-complete.got { border-style: solid; background: var(--green-soft); border-color: #22c55e; color: var(--green-dark); }

    /* Gacha */
    .gacha-machine {
      text-align: center; padding: 26px 16px 20px;
      background: linear-gradient(160deg, #fdf4ff, #eff6ff);
      border: 2px solid var(--border); border-radius: 20px; margin-bottom: 16px;
    }
    .gacha-emoji { font-size: 76px; line-height: 1.2; display: inline-block; }
    .gacha-emoji.spinning { animation: gachaShake 0.12s linear infinite; }
    @keyframes gachaShake {
      0% { transform: rotate(-7deg) scale(1.04); }
      50% { transform: rotate(7deg) scale(0.97); }
      100% { transform: rotate(-7deg) scale(1.04); }
    }
    .gacha-result { margin-top: 14px; font-size: 17px; font-weight: 800; min-height: 26px; animation: popIn 0.3s ease both; }
    .gacha-results-box {
      margin-top: 14px; text-align: left; background: rgba(255,255,255,0.78);
      border: 1.5px solid #f0abfc; border-radius: 14px; padding: 12px 14px;
      animation: popIn 0.3s ease both;
    }
    .gacha-results-list { margin: 0; padding-left: 20px; font-size: 13.5px; font-weight: 700; line-height: 1.75; }
    .prob-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .prob-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    .prob-table td:last-child { text-align: right; font-weight: 800; white-space: nowrap; }

    @media (max-width: 430px) {
      .bonus-cells { gap: 4px; }
      .bonus-cell .bc-icon { font-size: 16px; }
      .gacha-emoji { font-size: 62px; }
    }

    .toast { overflow-wrap: anywhere; }

    /* Small screens (smartphone): prevent horizontal overflow */
    @media (max-width: 430px) {
      .hud-inner { padding: 6px 10px; gap: 6px; }
      .brand { font-size: 15px; gap: 6px; }
      .brand-icon { width: 30px; height: 30px; font-size: 16px; border-radius: 8px; }
      .hud-stats { gap: 5px; }
      .stat-pill { font-size: 12px; padding: 4px 8px; }
      .stat-btn { font-size: 11.5px; padding: 4px 8px; min-height: 32px; }
      .container { padding: 14px 10px 70px; }
      .daily-card { padding: 14px; }
      .daily-card h1 { font-size: 17.5px !important; line-height: 1.4; }
      .daily-badge { font-size: 11px; }
      .day-dot { font-size: 10px; padding: 5px 2px; }
      .quiz-screen { padding: 18px 14px; }
      .q-text { font-size: 16.5px; }
      .choice-btn { font-size: 14.5px; padding: 11px 12px; min-height: 50px; }
      .stage-node { padding: 12px; gap: 10px; }
      .stage-node-wrap { transform: translateX(0) !important; }
      .stage-circle { width: 44px; height: 44px; font-size: 19px; }
      .home-nav { gap: 10px; }
      .nav-card { padding: 13px; }
      .nav-card .nav-icon { font-size: 23px; }
      .nav-card .nav-title { font-size: 15px; }
      .modal-card { padding: 20px 16px; }
      .flash-term { font-size: 25px; }
      .btn-3d { font-size: 14px; padding: 10px 14px; }
      .title-strip { padding: 9px 11px; gap: 6px 10px; }
      .guide-step { flex-basis: 130px; padding: 9px 10px; }
      .shop-item { padding: 12px; gap: 10px; }
      .shop-item .s-icon { font-size: 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01s !important; transition-duration: 0.01s !important; }
    }
  </style>
</head>

<script>
(() => {
  const raw = String.raw;

  const STAGES = [
    {
      id: "jr1", num: 1, title: "中学理科の復習：速さと運動", sub: "速さの計算・単位換算・音の速さ", icon: "🚴", color: "#65a30d",
      questions: [
        { q: raw`自動車が2時間で $120\,\mathrm{km}$ 進んだ。平均の速さは時速何 $\mathrm{km}$ か。`, opts: ["40 km/h", "60 km/h", "120 km/h", "240 km/h"], ans: 1, exp: raw`速さ $=$ 距離 $\div$ 時間 $= 120 \div 2 = 60\,\mathrm{km/h}$ です。` },
        { q: raw`速さ $10\,\mathrm{m/s}$ で走る自転車が、30秒間に進む距離は何 $\mathrm{m}$ か。`, opts: ["3.0 m", "30 m", "300 m", "40 m"], ans: 2, exp: raw`距離 $=$ 速さ $\times$ 時間 $= 10 \times 30 = 300\,\mathrm{m}$ です。` },
        { q: raw`速さ $54\,\mathrm{km/h}$ は何 $\mathrm{m/s}$ か。`, opts: ["10 m/s", "15 m/s", "20 m/s", "54 m/s"], ans: 1, exp: raw`$54\,\mathrm{km/h} = \frac{54000\,\mathrm{m}}{3600} = 15\,\mathrm{m/s}$ です。km/h を 3.6 で割ると m/s になります。` },
        { q: raw`速さ $20\,\mathrm{m/s}$ は何 $\mathrm{km/h}$ か。`, opts: ["20 km/h", "36 km/h", "54 km/h", "72 km/h"], ans: 3, exp: raw`$20\,\mathrm{m/s} = \frac{20 \times 3600}{1000} = 72\,\mathrm{km/h}$ です。m/s に 3.6 をかけると km/h になります。` },
        { q: raw`自転車で $900\,\mathrm{m}$ の道のりを3分間で走った。平均の速さは何 $\mathrm{m/s}$ か。`, opts: ["3.0 m/s", "5.0 m/s", "9.0 m/s", "300 m/s"], ans: 1, exp: raw`3分間は180秒なので、速さ $= 900 \div 180 = 5.0\,\mathrm{m/s}$ です。` },
        { q: raw`速さ $25\,\mathrm{m/s}$ で走る列車が、40秒間に進む距離は何 $\mathrm{m}$ か。`, opts: ["65 m", "250 m", "1000 m", "1600 m"], ans: 2, exp: raw`距離 $=$ 速さ $\times$ 時間 $= 25 \times 40 = 1000\,\mathrm{m}$ です。` },
        { q: raw`時速 $80\,\mathrm{km}$ で走る自動車が $160\,\mathrm{km}$ 進むのにかかる時間は何時間か。`, opts: ["0.5時間", "1時間", "2時間", "4時間"], ans: 2, exp: raw`時間 $=$ 距離 $\div$ 速さ $= 160 \div 80 = 2$ 時間です。` },
        { q: raw`$100\,\mathrm{m}$ を12.5秒で走った。平均の速さは何 $\mathrm{m/s}$ か。`, opts: ["6.3 m/s", "8.0 m/s", "10 m/s", "12.5 m/s"], ans: 1, exp: raw`速さ $= 100 \div 12.5 = 8.0\,\mathrm{m/s}$ です。` },
        { q: raw`音の速さを $340\,\mathrm{m/s}$ とする。花火の光が見えてから3.0秒後に音が聞こえた。花火までの距離はおよそ何 $\mathrm{m}$ か。`, opts: ["340 m", "680 m", "1020 m", "3400 m"], ans: 2, exp: raw`距離 $=$ 音の速さ $\times$ 時間 $= 340 \times 3.0 = 1020\,\mathrm{m}$ です。光はほぼ一瞬で届くので、時間差は音だけのものと考えます。` },
        { q: raw`雷の光が見えてから5.0秒後に音が聞こえた。音の速さを $340\,\mathrm{m/s}$ として、雷までの距離はおよそ何 $\mathrm{m}$ か。`, opts: ["68 m", "340 m", "1700 m", "3400 m"], ans: 2, exp: raw`距離 $=$ 音の速さ $\times$ 時間 $= 340 \times 5.0 = 1700\,\mathrm{m}$ です。` }
      ]
    },
    {
      id: "jr2", num: 2, title: "中学理科の復習：力のきほん", sub: "つり合い・ばね・圧力・密度", icon: "💪", color: "#f59e0b",
      questions: [
        { q: raw`机の上に置いた本が静止している。このとき、本にはたらく力について正しいのはどれか。`, opts: ["重力だけがはたらいている", "重力と垂直抗力がつり合っている", "力はまったくはたらいていない", "摩擦力だけがはたらいている"], ans: 1, exp: raw`静止している物体では、はたらく力の合力が0になっています。本には重力と、机からの垂直抗力がつり合ってはたらいています。` },
        { q: raw`あるばねに $2.0\,\mathrm{N}$ の力を加えると $4.0\,\mathrm{cm}$ 伸びた。$6.0\,\mathrm{N}$ の力を加えると何 $\mathrm{cm}$ 伸びるか。`, opts: ["6.0 cm", "8.0 cm", "12 cm", "24 cm"], ans: 2, exp: raw`フックの法則により、ばねの伸びは力に比例します。力が3倍になるので、伸びも $4.0 \times 3 = 12\,\mathrm{cm}$ になります。` },
        { q: raw`面積 $0.20\,\mathrm{m^2}$ の面に $100\,\mathrm{N}$ の力が垂直にはたらいている。圧力は何 $\mathrm{Pa}$ か。`, opts: ["20 Pa", "200 Pa", "500 Pa", "2000 Pa"], ans: 2, exp: raw`圧力 $=$ 力 $\div$ 面積 $= 100 \div 0.20 = 500\,\mathrm{Pa}$ です。` },
        { q: raw`質量 $27\,\mathrm{g}$、体積 $10\,\mathrm{cm^3}$ の金属の密度は何 $\mathrm{g/cm^3}$ か。`, opts: ["0.27 g/cm³", "2.7 g/cm³", "27 g/cm³", "270 g/cm³"], ans: 1, exp: raw`密度 $=$ 質量 $\div$ 体積 $= 27 \div 10 = 2.7\,\mathrm{g/cm^3}$ です（アルミニウムの密度とほぼ同じです）。` },
        { q: raw`力のはたらきを決める「力の3要素」はどれか。`, opts: ["大きさ・向き・作用点", "大きさ・速さ・重さ", "向き・温度・作用点", "速さ・向き・質量"], ans: 0, exp: raw`力は「大きさ」「向き」「作用点（力がはたらく点）」の3つで決まります。矢印1本で表せるのはこのためです。` },
        { q: raw`月の表面では、重力の大きさが地球の約6分の1になる。質量 $60\,\mathrm{kg}$ の人が月に行ったとき、その人の質量は何 $\mathrm{kg}$ か。`, opts: ["10 kg", "30 kg", "60 kg", "360 kg"], ans: 2, exp: raw`質量は「ものそのものの量」なので、場所が変わっても変わりません。変わるのは、重力に引かれる力の大きさ（重さ）の方です。` },
        { q: raw`質量 $100\,\mathrm{g}$ の物体にはたらく重力の大きさを約 $1\,\mathrm{N}$ とする。質量 $300\,\mathrm{g}$ の物体にはたらく重力は約何 $\mathrm{N}$ か。`, opts: ["0.3 N", "3 N", "30 N", "300 N"], ans: 1, exp: raw`重力の大きさは質量に比例します。質量が3倍の $300\,\mathrm{g}$ では、約 $3\,\mathrm{N}$ になります。` },
        { q: raw`質量 $100\,\mathrm{g}$ のおもりをつるすと $5.0\,\mathrm{cm}$ 伸びるばねがある。質量 $300\,\mathrm{g}$ のおもりをつるすと何 $\mathrm{cm}$ 伸びるか。`, opts: ["5.0 cm", "10 cm", "15 cm", "45 cm"], ans: 2, exp: raw`フックの法則により、ばねの伸びは力（おもりの重さ）に比例します。おもりが3倍重くなると、伸びも3倍の $15\,\mathrm{cm}$ になります。` },
        { q: raw`画鋲や包丁の先がとがっていると刺さったり切れたりしやすい。これはなぜか。`, opts: ["力が大きくなるから", "面積が小さいので圧力が大きくなるから", "摩擦がなくなるから", "ものの重さが増えるから"], ans: 1, exp: raw`圧力は「力 ÷ 面積」です。同じ力でも、先がとがれて面積が小さいほど圧力が大きくなり、刺さりやすくなります。` },
        { q: raw`質量 $79\,\mathrm{g}$、体積 $10\,\mathrm{cm^3}$ の金属の密度は何 $\mathrm{g/cm^3}$ か。`, opts: ["0.79 g/cm³", "7.9 g/cm³", "79 g/cm³", "790 g/cm³"], ans: 1, exp: raw`密度 $=$ 質量 $\div$ 体積 $= 79 \div 10 = 7.9\,\mathrm{g/cm^3}$ です（鉄の密度とほぼ同じです）。` }
      ]
    },
    {
      id: "jr3", num: 3, title: "中学理科の復習：電流と回路", sub: "オームの法則・磁界・光の反射と屈折", icon: "🔌", color: "#8b5cf6",

  // Sound Effects via Web Audio API (Safari & mobile safe)
  let audioCtx = null;
  function playTone(type) {
    if (!appData.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (type === "ok") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.start(now); osc.stop(now + 0.28);
      } else if (type === "ng") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(175, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === "clear") {
        osc.type = "sine";
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.09));
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      }
    } catch (e) {}
  }

  // "YYYY-MM-DD" 同士の日数差（b - a）を返す
  function dayDiff(a, b) {
    const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
    return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
  }

  function recordDailyActivity(xpGain) {
    const acc = curAcc();
    acc.xp += xpGain; // 累計XP（称号判定用）
    acc.xpBalance += xpGain; // 使えるXP残高（ショップ用）
    if (acc.id === "guest") { saveData(); return; } // ゲストはストリーク対象外（XPのみ加算）
    const td = todayStr();
    const yd = yesterdayStr();
    if (acc.lastActiveDate !== td) {
      if (acc.lastActiveDate === yd) {
        acc.streak += 1;
      } else if (acc.lastActiveDate && acc.streak > 0) {
        // 空いた日数ぶんをストリークフリーズでカバーできればストリーク維持
        const missed = dayDiff(acc.lastActiveDate, td) - 1;
        if (missed >= 1 && acc.streakFreezes >= missed) {
          acc.streakFreezes -= missed;
          acc.streak += 1;
          for (let k = 1; k <= missed; k++) {
            const ds = jstDateStr(-k);
            if (!acc.weekDates.includes(ds)) acc.weekDates.push(ds);
          }
          showToast(`🧊 ストリークフリーズを${missed}個使って、ストリークを守りました！`);
        } else {
          acc.streak = 1;
        }
      } else {
        acc.streak = 1;
      }
      acc.lastActiveDate = td;
    }
    if (!acc.weekDates.includes(td)) acc.weekDates.push(td);
    saveData();
  }

      SHOP_AVATARS.forEach(a => { if (!acc.unlockedAvatars.includes(a)) acc.unlockedAvatars.push(a); });
      showToast("🎭 限定アバターを解放しました！プロフィールで選べます");
    } else if (kind.startsWith("theme:")) {
      const tid = kind.slice(6);

      if (!spend(SHOP_PRICES.theme)) { renderShop(); return; }

  // ===== デイリー報酬（XPブースト / ガチャチケット / 週間ボーナス） =====
  const BOOST_MULTIPLIER = 1.5; // XPブーストの倍率（次のクイズ1回分・端数は切り上げ）

  // ISO週キー（JST基準）。{ key: "2026-W47", num: 47 } を返す
  function jstWeekKey() {
    const p = todayStr().split("-").map(Number);
    const date = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    const dayNum = (date.getUTCDay() + 6) % 7; // 月曜=0
    date.setUTCDate(date.getUTCDate() - dayNum + 3); // その週の木曜に寄せる
    const isoYear = date.getUTCFullYear();
    const firstThu = new Date(Date.UTC(isoYear, 0, 4));
    const fDay = (firstThu.getUTCDay() + 6) % 7;
    firstThu.setUTCDate(firstThu.getUTCDate() - fDay + 3); // その年の最初の木曜
    const week = 1 + Math.round((date - firstThu) / 604800000);
    return { key: isoYear + "-W" + String(week).padStart(2, "0"), num: week };
  }

  // 週間ボーナスの報酬セット（週番号で3種類をローテーション）
  const WEEKLY_BONUS_SETS = [
    {
      name: "ヒント週間", complete: { type: "gacha", amount: 2 },
      cells: [
        { type: "hint", amount: 1 }, { type: "xp", amount: 30 }, { type: "gacha", amount: 1 },
        { type: "hint", amount: 1 }, { type: "xp", amount: 50 }, { type: "freeze", amount: 1 },
        { type: "gacha", amount: 1 }
      ]
    },
    {
      name: "フリーズ週間", complete: { type: "gacha", amount: 2 },
      cells: [
        { type: "xp", amount: 30 }, { type: "freeze", amount: 1 }, { type: "gacha", amount: 1 },
        { type: "hint", amount: 1 }, { type: "boost", amount: 1 }, { type: "freeze", amount: 1 },
        { type: "xp", amount: 80 }
      ]
    },
    {
      name: "ブースト週間", complete: { type: "gacha", amount: 3 },
      cells: [
        { type: "gacha", amount: 1 }, { type: "xp", amount: 40 }, { type: "hint", amount: 1 },
        { type: "boost", amount: 1 }, { type: "freeze", amount: 1 }, { type: "xp", amount: 60 },
        { type: "gacha", amount: 1 }
      ]
    }
  ];
  function weeklySet() {
    const wk = jstWeekKey();
    return { set: WEEKLY_BONUS_SETS[wk.num % WEEKLY_BONUS_SETS.length], key: wk.key, num: wk.num };
  }
  function rewardLabel(r) {
    if (r.type === "hint") return `💡 ヒントチケット ×${r.amount}`;
    if (r.type === "freeze") return `🧊 ストリークフリーズ ×${r.amount}`;
    if (r.type === "gacha") return `🎰 ガチャチケット ×${r.amount}`;
    if (r.type === "boost") return `⚡ XPブースト ×${r.amount}`;
    if (r.type === "xp") return `⚡ ${r.amount} XP`;
    return "🎁 報酬";
  }
  function rewardIcon(r) {
    return { hint: "💡", freeze: "🧊", gacha: "🎰", boost: "⚡", xp: "⚡" }[r.type] || "🎁";
  }
  function rewardShort(r) {
    return r.type === "xp" ? r.amount + "XP" : "×" + r.amount;
  }
  // 報酬をアカウントへ付与（XP報酬は累計XPと残高の両方に加算し、称号判定とそろえる）
  function applyReward(acc, r) {
    if (r.type === "hint") acc.hintTickets += r.amount;
    else if (r.type === "freeze") acc.streakFreezes += r.amount;
    else if (r.type === "gacha") acc.gachaTickets += r.amount;
    else if (r.type === "boost") acc.xpBoost += r.amount;
    else if (r.type === "xp") { acc.xp += r.amount; acc.xpBalance += r.amount; }
  }
  // 週が変わっていたら週間ボーナス進捗をリセットする（リセットしたら true）
  function syncWeeklyBonus(acc) {
    const wk = weeklySet();
    if (!acc.weeklyBonus || acc.weeklyBonus.weekKey !== wk.key) {
      acc.weeklyBonus = { weekKey: wk.key, progress: 0, completed: false };
      return true;
    }
    return false;
  }

  // デイリー初回完了時の報酬付与。付与内容の説明文リストを返す（同日2回目以降は空配列＝付与なし）
  function grantDailyRewards() {
    const acc = curAcc();
    const td = todayStr();
    if (acc.lastDailyRewardDate === td) return [];
    acc.lastDailyRewardDate = td;
    const msgs = [];
    acc.xpBoost += 1;

    msgs.push("🎰 ガチャチケット ×1");
    // 週間ボーナスボードを1マス進める（週替わりなら先にリセット）
    syncWeeklyBonus(acc);
    const wk = weeklySet();
    if (acc.weeklyBonus.progress < wk.set.cells.length) {
      const cell = wk.set.cells[acc.weeklyBonus.progress];
      acc.weeklyBonus.progress += 1;
      applyReward(acc, cell);
      msgs.push(`📅 週間ボーナス ${acc.weeklyBonus.progress}マス目：${rewardLabel(cell)}`);
      if (acc.weeklyBonus.progress >= wk.set.cells.length && !acc.weeklyBonus.completed) {
        acc.weeklyBonus.completed = true;
        applyReward(acc, wk.set.complete);
        msgs.push(`🎉 週間コンプリート報酬：${rewardLabel(wk.set.complete)}`);
      }
    }
    saveData();
    return msgs;
  }

  // 現在の排出プール。解放済みカテゴリ（アバター/テーマ/称号）は除外し、その分は他に割り振られる
  function gachaPool(acc) {
    const pool = [
      { kind: "xp", amount: 30, weight: 24, label: "⚡ 30 XP" },
      { kind: "hint", amount: 1, weight: 20, label: "💡 ヒントチケット ×1" },

    return pool;
  }

  let gachaSpinning = false;
  let gachaLastResults = []; // 直近の抽選結果ラベル（1連なら1件、10連なら10件）
  let gachaLastWasMulti = false;
  // 1回分の抽選を行い、当選アイテムを付与して結果ラベルを返す。
  // プールは毎回再計算するので、10連の途中で全解放されたカテゴリは以降の抽選から外れる
  function rollGachaOnce(acc) {
    const pool = gachaPool(acc);
    const totalW = pool.reduce((s, p) => s + p.weight, 0);
    let roll = Math.random() * totalW;
    let prize = pool[pool.length - 1];
    for (const p of pool) { roll -= p.weight; if (roll < 0) { prize = p; break; } }
    let resultLabel = prize.label;
    if (prize.kind === "avatar") {
      const locked = SHOP_AVATARS.filter(a => !acc.unlockedAvatars.includes(a));
      const got = locked[Math.floor(Math.random() * locked.length)];
      acc.unlockedAvatars.push(got);
      resultLabel = `🎭 限定アバター「${got}」を解放！`;
    } else if (prize.kind === "theme") {
      const locked = THEMES.filter(t => t.id !== "blue" && !acc.themesOwned.includes(t.id));
      const got = locked[Math.floor(Math.random() * locked.length)];
      acc.themesOwned.push(got.id);
      resultLabel = `🎨 テーマカラー「${got.name}」を解放！`;
    } else if (prize.kind === "title") {
      const locked = RARE_TITLES.filter(t => !acc.rareTitles.includes(t));
      const got = locked[Math.floor(Math.random() * locked.length)];
      acc.rareTitles.push(got);
      resultLabel = `🎖️ レア称号「${got}」をゲット！`;
    } else {
      applyReward(acc, { type: prize.kind, amount: prize.amount });
    }
    return resultLabel;
  }

  // Math Renderer
  function texToHtml(tex) {
    let t = tex.trim();
    const sym = {
      "\\\\theta": "θ", "\\\\lambda": "λ", "\\\\nu": "ν", "\\\\pi": "π",
      "\\\\Delta": "Δ", "\\\\Omega": "Ω", "\\\\times": "×", "\\\\cdot": "·",
      "\\\\approx": "≈", "\\\\sqrt": "√"
    };
    t = t.replace(/\\(?:text|mathrm)\{([^{}]*)\}/g, "$1");
    for (let p = 0; p < 2; p++) {
      t = t.replace(/\\frac\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g,
        '<span class="math-frac"><span class="num">$1</span><span class="den">$2</span></span>');
      t = t.replace(/\\sqrt\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g,
        '<span class="math-sqrt">√<span class="math-sqrt-body">$1</span></span>');
    }
    for (const [k, v] of Object.entries(sym)) t = t.replace(new RegExp(k + "(?![a-zA-Z])", "g"), v);
    t = t.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>").replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    t = t.replace(/_([a-zA-Z0-9])/g, "<sub>$1</sub>").replace(/\^([a-zA-Z0-9])/g, "<sup>$1</sup>");
    t = t.replace(/\\,/g, "&thinsp;").replace(/[{}]/g, "");
    return t;
  }

  function renderMath(el) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    const nodes = []; let n;
    while ((n = walker.nextNode())) { if (n.nodeValue && n.nodeValue.includes("$")) nodes.push(n); }
    nodes.forEach(tn => {
      const parts = tn.nodeValue.split(/(\$[^$]+?\$)/g);
      if (parts.length <= 1) return;
      const frag = document.createDocumentFragment();
      parts.forEach(p => {
        if (p.startsWith("$") && p.endsWith("$")) {
          const sp = document.createElement("span"); sp.className = "math-inline"; sp.innerHTML = texToHtml(p.slice(1, -1)); frag.appendChild(sp);
        } else if (p) frag.appendChild(document.createTextNode(p));
      });
      tn.parentNode.replaceChild(frag, tn);
    });
  }

  // 解説画面から単語帳の該当用語へジャンプ（用語を開いた状態で表示）
  function openGlossaryTerm(word) {
    const t = TERMS.find(x => x.term === word);
    if (!t) return;
    wordField = t.field;
    renderWordList();
    const list = filteredTerms();
    const i = list.findIndex(x => x.term === word);
    const items = document.querySelectorAll(".word-item");
    if (i >= 0 && items[i]) {
      items[i].classList.add("open");
      items[i].scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function startStageQuiz(stageIdx) {
    const st = STAGES[stageIdx];
    const refs = st.questions.map((q, i) => ({ stageId: st.id, qIndex: i }));
    session = { mode: "stage", stageIdx, questions: st.questions, refs, qIdx: 0, combo: 0, correctCount: 0, answered: false, chosenIdx: -1 };
    renderQuiz();
  }

  function startDailyQuiz() {
    const acc = curAcc();
    const pool = [];
    for (let i = 0; i <= Math.min(acc.unlockedIndex, STAGES.length - 1); i++) {
      STAGES[i].questions.forEach(q => pool.push(q));
    }
    const pick = pool[Math.floor(Math.random() * pool.length)];
    let pickStageIdx = 0, pickRef = { stageId: STAGES[0].id, qIndex: 0 };
    for (let i = 0; i < STAGES.length; i++) {
      const j = STAGES[i].questions.indexOf(pick);
      if (j >= 0) { pickStageIdx = i; pickRef = { stageId: STAGES[i].id, qIndex: j }; break; }
    }
    session = { mode: "daily", stageIdx: pickStageIdx, questions: [pick], refs: [pickRef], qIdx: 0, combo: 0, correctCount: 0, answered: false, chosenIdx: -1 };
    renderQuiz();
  }

  function startReviewQuiz() {
    const acc = curAcc();
    const questions = [], refs = [];
    acc.wrongList.slice(0, 10).forEach(key => {
      const parts = key.split(":");
      const st = STAGES.find(s => s.id === parts[0]);
      const qi = Number(parts[1]);
      if (st && st.questions[qi]) {
        questions.push(st.questions[qi]);
        refs.push({ stageId: st.id, qIndex: qi });
      }
    });
    if (questions.length === 0) { renderHome(); return; }
    session = { mode: "review", stageIdx: 0, questions, refs, qIdx: 0, combo: 0, correctCount: 0, answered: false, chosenIdx: -1 };
    renderQuiz();
  }

  function renderQuiz() {
    const q = session.questions[session.qIdx];
    if (!Array.isArray(session.eliminated)) session.eliminated = [];
    const acc = curAcc();
    const total = session.questions.length;
    const pct = Math.round(((session.qIdx + (session.answered ? 1 : 0)) / total) * 100);
    const title = session.mode === "daily" ? "⚡ 今日の1問チャレンジ" : session.mode === "review" ? "🔁 復習モード（間違えた問題）" : `STAGE ${STAGES[session.stageIdx].num}：${STAGES[session.stageIdx].title}`;

    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="quiz-screen">
        <div class="quiz-progress-row">
          <button id="quitQuizBtn" class="stat-btn">✕ やめる</button>
          <div class="q-bar-track"><div class="q-bar-fill" style="width:${pct}%;"></div></div>
          <span style="font-size:12.5px; font-weight:800; color:var(--text-muted);">${session.qIdx + 1} / ${total}</span>
        </div>

        <div style="font-size:12px; font-weight:800; color:var(--blue); margin-bottom:6px;">${title}</div>
        ${session.combo >= 2 ? `<div class="combo-badge">🔥 ${session.combo} 連続正解 COMBO!</div>` : ""}

        <div class="q-text">${q.q}</div>

        ${!session.answered ? `
        <div class="hint-bar">
          ${session.hintUsed
            ? `<span style="font-size:12.5px; color:var(--text-muted); font-weight:700;">💡 ヒント使用済み（この問題ではもう使えません）</span>`
            : acc.hintTickets > 0
              ? `<button id="hintBtn" class="btn-3d btn-ghost" style="min-height:40px; padding:7px 14px; font-size:13.5px;">💡 ヒントを使う（残り${acc.hintTickets}枚）― 選択肢を2つ消す</button>`
              : `<span style="font-size:12.5px; color:var(--text-light); font-weight:700;">💡 ヒントチケットはXPショップで買えます（残り0枚）</span>`}
        </div>` : ""}

        <div class="choices-grid">
          ${q.opts.map((opt, i) => {
            let cls = "";
            const elim = session.eliminated.includes(i);
            if (elim) cls = "eliminated";
            if (session.answered) {
              if (i === q.ans) cls = "correct";
              else if (i === session.chosenIdx) cls = "wrong";
            }
            return `<button class="choice-btn ${cls}" data-oi="${i}" ${session.answered || elim ? "disabled" : ""}>
              <span style="color:var(--text-light);">${i + 1}.</span><span>${opt}</span>
            </button>`;
          }).join("")}
        </div>

        ${session.answered ? `
          <div class="feedback-banner ${session.chosenIdx === q.ans ? "ok" : "ng"}">
            <div style="font-weight:800; font-size:15px;">
              ${session.chosenIdx === q.ans ? "🎉 正解！ (+10 XP)" : "💡 惜しい！解説を確認しよう"}
            </div>
            <div style="font-size:14px; color:var(--text-main);">${q.exp}</div>
            ${session.chosenIdx === q.ans ? "" : `<button id="bookReviewBtn" class="btn-3d btn-ghost" style="margin-top:6px;">📚 教科書で復習する</button>`}
            <button id="nextQBtn" class="btn-3d ${session.chosenIdx === q.ans ? "btn-green" : "btn-blue"}" style="margin-top:6px;">
              ${session.qIdx + 1 < total ? "つぎの問題へ →" : "結果を見る 🏆"}
            </button>
          </div>
        ` : ""}
      </div>
    `;

    document.getElementById("quitQuizBtn").addEventListener("click", () => { session = null; renderHome(); });
    const hintBtn = document.getElementById("hintBtn");
    if (hintBtn) {
      hintBtn.addEventListener("click", () => {
        const a = curAcc();
        if (session.answered || session.hintUsed || a.hintTickets <= 0) return;
        const wrongIdx = q.opts.map((_, i) => i).filter(i => i !== q.ans);
        for (let i = wrongIdx.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = wrongIdx[i]; wrongIdx[i] = wrongIdx[j]; wrongIdx[j] = tmp;
        }
        session.eliminated = wrongIdx.slice(0, 2);
        session.hintUsed = true;
        a.hintTickets--;
        saveData();
        renderQuiz();
      });
    }
    main.querySelectorAll(".choice-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (session.answered) return;
        const oi = Number(btn.getAttribute("data-oi"));
        session.answered = true;
        session.chosenIdx = oi;
        const ref = session.refs[session.qIdx];
        if (oi === q.ans) {
          session.correctCount++;
          session.combo++;
          playTone("ok");
          if (ref) trackAnswer(ref.stageId, ref.qIndex, true);
        } else {
          session.combo = 0;
          playTone("ng");
          if (ref) trackAnswer(ref.stageId, ref.qIndex, false);
        }
        renderQuiz();
      });
    });

    if (session.answered) {
      const bookBtn = document.getElementById("bookReviewBtn");
      if (bookBtn) {
        bookBtn.addEventListener("click", () => {
          const ref = session.refs[session.qIdx];
          const st = ref ? STAGES.find(s => s.id === ref.stageId) : null;
          const li = st ? LESSONS.findIndex(ls => ls.stage === st.num) : -1;
          session = null;
          if (li >= 0) renderLesson(li);
          else renderLessonList();
        });
      }
      document.getElementById("nextQBtn").addEventListener("click", () => {
        if (session.qIdx + 1 < total) {
          session.qIdx++;
          session.answered = false;
          session.chosenIdx = -1;
          session.eliminated = [];
          session.hintUsed = false;
          renderQuiz();
        } else {
          finishQuiz();
        }
      });
    }

    renderMath(main);
  }

  function finishQuiz() {
    const acc = curAcc();
    const total = session.questions.length;
    let earnedXp = session.correctCount * 10 + (session.correctCount === total ? 15 : 0);
    if (session.mode === "review") earnedXp = Math.floor(earnedXp / 2); // 復習モードはXP半分
    // XPブースト所持中は、このクイズ1回分だけ獲得XP×1.5（端数は切り上げ）。獲得XPが0のときは消費しない
    const baseXp = earnedXp;
    let boostUsed = false;
    if (earnedXp > 0 && acc.xpBoost > 0) {
      acc.xpBoost -= 1;
      earnedXp = Math.ceil(earnedXp * BOOST_MULTIPLIER);
      boostUsed = true;
    }
    recordDailyActivity(earnedXp);
    // デイリー初回完了の報酬（XPブースト＋ガチャチケット＋週間ボーナス1マス）。今日もらったブーストは次回から効く
    const dailyRewardMsgs = session.mode === "daily" ? grantDailyRewards() : [];

    let unlockedMsg = "";
    if (session.mode === "stage") {
      const st = STAGES[session.stageIdx];
      const totalQ = session.questions.length;
      const stars = session.correctCount >= Math.ceil(totalQ * 0.9) ? 3 : session.correctCount >= Math.ceil(totalQ * 0.7) ? 2 : session.correctCount >= Math.ceil(totalQ * 0.4) ? 1 : 0;
      if (stars > 0) {
        acc.stars[st.id] = Math.max(acc.stars[st.id] || 0, stars);
        if (session.stageIdx === acc.unlockedIndex && acc.unlockedIndex < STAGES.length - 1) {
          acc.unlockedIndex++;
          unlockedMsg = `🔓 STAGE ${STAGES[acc.unlockedIndex].num}「${STAGES[acc.unlockedIndex].title}」が解放されました！`;
        }
        saveData();
      }
    }
    playTone("clear");
    updateHUD();
    checkBadges();
    if (dailyRewardMsgs.length) showToast("🎁 デイリー報酬をもらいました！結果画面で確認できます");

    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="quiz-screen" style="text-align:center; padding:32px 20px;">
        <div style="font-size:48px; margin-bottom:8px;">${session.correctCount === total ? "🏆" : "👍"}</div>
        <h2 style="margin:0 0 8px; font-size:22px;">${session.mode === "review" ? "復習完了！" : session.mode === "daily" ? "チャレンジ完了！" : "ステージ完了！"}</h2>
        <div style="font-size:15px; color:var(--text-muted); margin-bottom:14px;">
          正答数：<strong>${session.correctCount} / ${total} 問</strong>　｜　獲得：<strong>+${earnedXp} XP</strong>
        </div>
        <div style="background:#fff7ed; border:1.5px solid #fed7aa; color:#c2410c; border-radius:12px; padding:10px 14px; font-weight:800; font-size:14px; margin-bottom:14px;">
          ${acc.id === "guest" ? "🔒 ストリークはアカウント作成で使えるようになります" : `🔥 ストリーク：${acc.streak} 日連続達成！`}
        </div>
        ${boostUsed ? `<div style="background:#fef9c3; border:1.5px solid #fde047; color:#854d0e; border-radius:12px; padding:10px 14px; font-weight:800; font-size:14px; margin-bottom:14px;">⚡ XPブースト発動！獲得XPが ${baseXp} → ${earnedXp} XP（×1.5）になりました</div>` : ""}
        ${dailyRewardMsgs.length ? `<div style="background:#fdf4ff; border:1.5px solid #f0abfc; color:#86198f; border-radius:12px; padding:10px 14px; font-weight:800; font-size:14px; margin-bottom:14px; text-align:left;">🎁 デイリー報酬ゲット！<br>${dailyRewardMsgs.map(m => "・" + m).join("<br>")}</div>` : ""}
        ${unlockedMsg ? `<div style="background:var(--green-soft); color:var(--green-dark); border-radius:12px; padding:10px 14px; font-weight:800; font-size:14px; margin-bottom:18px;">${unlockedMsg}</div>` : ""}
        ${session.mode === "review" ? `<div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">復習モードのXPは通常の半分です。残りの復習はあと ${acc.wrongList.length} 問です。</div>` : ""}
        <button id="backMapBtn" class="btn-3d btn-green" style="width:100%;">🗺️ マップへ戻る</button>
      </div>
    `;
    document.getElementById("backMapBtn").addEventListener("click", () => { session = null; renderHome(); });
  }

      ],
      formula: raw`$v = f\lambda$`,
      example: { q: "振動数 2.0 Hz、波長 3.0 m の波の速さは？", a: "v = 2.0 × 3.0 = 6.0 m/s" }
    },
    {
      stage: 11, title: "光の干渉とレンズ",
      intro: "シャボン玉の虹色、水にさしたストローの曲がり見え、虫眼鏡の拡大。光はまっすぐ進むだけでなく、曲がったり重なったりする面白い性質を持っています。",
      points: [
        "光は水やガラスに入ると屈折して曲がる",
        "全反射は光ファイバーに応用されている",
        "シャボン玉の色は薄い膜での光の干渉",
        "凸レンズは焦点の内側で正立虚像を大きく見せる"
      ],
      formula: raw`$\frac{1}{a} + \frac{1}{b} = \frac{1}{f}$`,
      example: { q: "虫眼鏡で文字が大きく見えるのは、文字をレンズのどこに置くから？", a: "焦点の内側に置くと、正立した大きな虚像が見えるから" }
    },
    {
      stage: 12, title: "静電気と直流回路",
      intro: "スマホの充電、家の照明、冬場の静電気パチッ。電気は現代生活そのものです。電流・電圧・抵抗の3つの言葉を押さえれば、回路の計算はぐっと身近になります。",
      points: [
        "オームの法則 V = RI が回路計算の基本",
        "電力 P = IV で家電のパワーが分かる",
        "直列では抵抗が足し算、並列では電流の通り道が増える",
        "コンデンサーは Q = CV の電気をためられる"
      ],
      formula: raw`$V = RI$`,
      example: { q: "抵抗 5.0 Ω に 1.5 A の電流が流れているときの電圧は？", a: "V = 5.0 × 1.5 = 7.5 V" }
    },
    {
      stage: 13, title: "磁場と電磁誘導",
      intro: "磁石をコイルに近づけるだけで電気が生まれる。この発見が発電所を生み、私たちの生活を一変させました。電気と磁気は、実は深くつながった一組の現象なのです。",
      points: [
        "磁場の中で動く荷電粒子はローレンツ力を受ける",
        "コイルを貫く磁束が変わると電流が流れる（電磁誘導）",
        "発電機もモーターも電磁誘導とローレンツ力の応用",
        "家庭の交流100 V の最大値は約141 V"
      ],
      formula: raw`$f = qvB\sin\theta$`,
      example: { q: "実効値 100 V の交流電圧の最大値はおよそ何 V？", a: "100 × 1.414 ≒ 141 V" }
    },
    {
      stage: 14, title: "量子と原子核",
      intro: "光は波であり粒でもある。原子の中では、私たちの常識が通用しない不思議なルールが支配しています。現代のスマホや太陽電池は、この量子の世界の発見の上に成り立っています。",
      points: [
        "光電効果は光が粒（光子）である証拠",
        "光子のエネルギーは E = hν で色によって決まる",
        "放射性物質は半減期ごとに半分ずつ減っていく",
        "太陽のエネルギーの源は核融合反応"
      ],
      formula: raw`$E = h\nu$`,
      example: { q: "半減期が4年の物質 80 g は、8年後に何 g になる？", a: "半減期2回分なので 80 × (1/2)² = 20 g" }
    }
  ];

  // ===== 単語帳・教科書の画面 =====
  let wordField = "すべて";
  let flashDeck = [];
  let flashPos = 0;
  let flashFlipped = false;

  function filteredTerms() {
    return wordField === "すべて" ? TERMS.slice() : TERMS.filter(t => t.field === wordField);
  }
  function wordChipsHtml(mode) {
    return `
      <div class="chip-row">
        ${WORD_FIELDS.map(f => `<button class="chip ${f === wordField ? "active" : ""}" data-word-field="${f}">${f}</button>`).join("")}
      </div>
      <div class="chip-row">
        <button class="chip ${mode === "list" ? "active" : ""}" id="wordModeList">📖 一覧</button>
        <button class="chip ${mode === "flash" ? "active" : ""}" id="wordModeFlash">🃏 フラッシュカード</button>
      </div>`;
  }
  function bindWordChips(mode) {
    document.querySelectorAll("[data-word-field]").forEach(b => {
      b.addEventListener("click", () => {
        wordField = b.getAttribute("data-word-field");
        if (mode === "flash") renderFlashcards(true); else renderWordList();
      });
    });
    document.getElementById("wordModeList").addEventListener("click", () => renderWordList());
    document.getElementById("wordModeFlash").addEventListener("click", () => renderFlashcards(true));
  }

  function renderWordList() {
    updateHUD();
    const list = filteredTerms();
    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="wordsBackBtn" class="stat-btn">← もどる</button>
          <h2>📖 物理用語の単語帳</h2>
        </div>
        ${wordChipsHtml("list")}
        <div style="font-size:12.5px; color:var(--text-light); font-weight:700; margin-bottom:10px;">${list.length} 語（タップで意味が開きます）</div>
        ${list.map((t, i) => `
          <button class="word-item" data-word-idx="${i}">
            <span class="w-top">
              <span class="w-term">${t.term}</span>
              <span class="w-reading">${t.reading}</span>
              <span class="field-tag">${t.field}</span>
            </span>
            <span class="w-def">
              ${t.def}
              ${t.formula ? `<span class="w-formula" style="display:block;">${t.formula}</span>` : ""}
            </span>
          </button>
        `).join("")}
      </div>
    `;
    document.getElementById("wordsBackBtn").addEventListener("click", () => renderHome());
    bindWordChips("list");
    main.querySelectorAll(".word-item").forEach(item => {
      item.addEventListener("click", () => item.classList.toggle("open"));
    });
    renderMath(main);
  }

  function renderFlashcards(reset) {
    updateHUD();
    if (reset || flashDeck.length === 0) {
      flashDeck = filteredTerms();
      flashPos = 0;
      flashFlipped = false;
    }
    const main = document.getElementById("appMain");
    if (flashDeck.length === 0) {
      main.innerHTML = `
        <div class="sub-screen">
          <div class="sub-head">
            <button id="wordsBackBtn" class="stat-btn">← もどる</button>
            <h2>🃏 フラッシュカード</h2>
          </div>
          ${wordChipsHtml("flash")}
          <div style="color:var(--text-muted);">この分野の用語はまだありません。</div>
        </div>`;
      document.getElementById("wordsBackBtn").addEventListener("click", () => renderHome());
      bindWordChips("flash");
      return;
    }
    if (flashPos >= flashDeck.length) flashPos = 0;
    const t = flashDeck[flashPos];
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="wordsBackBtn" class="stat-btn">← もどる</button>
          <h2>🃏 フラッシュカード</h2>
        </div>
        ${wordChipsHtml("flash")}
        <div style="font-size:12.5px; color:var(--text-light); font-weight:700; margin-bottom:10px;">${flashPos + 1} / ${flashDeck.length} 枚（カードをタップで裏返ります）</div>
        <div class="flash-wrap">
          <div class="flash-card ${flashFlipped ? "flipped" : ""}" id="flashCard">
            <div class="flash-face front">
              <span class="field-tag" style="margin:0;">${t.field}</span>
              <div class="flash-term">${t.term}</div>
              <div class="flash-reading">${t.reading}</div>
              <div class="flash-hint">タップで意味を見る</div>
            </div>
            <div class="flash-face back">
              <div class="flash-def">${t.def}</div>
              ${t.formula ? `<div class="flash-formula">${t.formula}</div>` : ""}
            </div>
          </div>
        </div>
        <div class="flash-nav">
          <button id="flashShuffleBtn" class="btn-3d btn-ghost">🔀 シャッフル</button>
          <button id="flashNextBtn" class="btn-3d btn-blue">つぎへ →</button>
        </div>
      </div>
    `;
    document.getElementById("wordsBackBtn").addEventListener("click", () => renderHome());
    bindWordChips("flash");
    document.getElementById("flashCard").addEventListener("click", () => {
      flashFlipped = !flashFlipped;
      document.getElementById("flashCard").classList.toggle("flipped", flashFlipped);
      if (flashFlipped) {
        const acc = curAcc();
        acc.flashFlips++;
        saveData();
        checkBadges();
      }
    });
    document.getElementById("flashNextBtn").addEventListener("click", () => {
      flashPos = (flashPos + 1) % flashDeck.length;
      flashFlipped = false;
      renderFlashcards(false);
    });
    document.getElementById("flashShuffleBtn").addEventListener("click", () => {
      for (let i = flashDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashDeck[i], flashDeck[j]] = [flashDeck[j], flashDeck[i]];
      }
      flashPos = 0;
      flashFlipped = false;
      renderFlashcards(false);
    });
    renderMath(main);
  }

  function renderLessonList() {
    updateHUD();
    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="bookBackBtn" class="stat-btn">← もどる</button>
          <h2>📚 簡易教科書</h2>
        </div>
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px; line-height:1.6;">
          クイズのステージに対応した、はじめて物理に触れる人向けの短いレッスンです。読んでから問題に挑むと効果的です。
        </div>
        ${LESSONS.map((ls, i) => {
          const st = STAGES[ls.stage - 1];
          return `
            <button class="lesson-item" data-lesson-idx="${i}">
              <div class="stage-circle" style="background:${st.color};">${st.icon}</div>
              <div style="flex:1; min-width:0;">
                <div style="font-size:11.5px; font-weight:800; color:${st.color};">STAGE ${ls.stage} 対応</div>
                <div style="font-size:15.5px; font-weight:800;">${ls.title}</div>
                <div style="font-size:12px; color:var(--text-muted);">${st.sub}</div>
              </div>
              <div style="font-size:18px; color:var(--text-light);">▶</div>
            </button>`;
        }).join("")}
      </div>
    `;
    document.getElementById("bookBackBtn").addEventListener("click", () => renderHome());
    main.querySelectorAll(".lesson-item").forEach(btn => {
      btn.addEventListener("click", () => renderLesson(Number(btn.getAttribute("data-lesson-idx"))));
    });
    renderMath(main);
  }

  function renderLesson(idx) {
    updateHUD();
    const ls = LESSONS[idx];
    const st = STAGES[ls.stage - 1];
    const unlocked = (ls.stage - 1) <= curAcc().unlockedIndex;
    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="lessonBackBtn" class="stat-btn">← レッスン一覧</button>
        </div>
        <div class="quiz-screen">
          <div style="font-size:12px; font-weight:800; color:${st.color}; margin-bottom:4px;">STAGE ${ls.stage} 対応 ${st.icon}</div>
          <h2 style="margin:0 0 12px; font-size:21px;">${ls.title}</h2>
          <div class="lesson-body">
            <p style="margin:0;">${ls.intro}</p>
            <h3>⭐ 重要ポイント</h3>
            <ul>
              ${ls.points.map(p => `<li>${p}</li>`).join("")}
            </ul>
            <h3>🧮 中心公式</h3>
            <div class="formula-box">${ls.formula}</div>
            <h3>✏️ 例題</h3>
            <div class="example-box">
              <div><strong>問題：</strong>${ls.example.q}</div>
              <div style="margin-top:6px;"><strong>答え：</strong>${ls.example.a}</div>
            </div>
          </div>
          <button id="lessonQuizBtn" class="btn-3d ${unlocked ? "btn-green" : "btn-ghost"}" style="width:100%; margin-top:8px;" ${unlocked ? "" : "disabled"}>
            ${unlocked ? `▶ STAGE ${ls.stage} の問題を解く` : `🔒 STAGE ${ls.stage} はまだ解放されていません`}
          </button>
        </div>
      </div>
    `;
    document.getElementById("lessonBackBtn").addEventListener("click", () => renderLessonList());
    if (unlocked) {
      document.getElementById("lessonQuizBtn").addEventListener("click", () => startStageQuiz(ls.stage - 1));
    }
    renderMath(main);
  }

  // ゲストで始める（モーダルを閉じてゲストのままホームへ）
  document.getElementById("guestStartBtn").addEventListener("click", () => {
    appData.activeId = "guest";
    saveData();
    document.getElementById("accountModal").classList.remove("open");
    session = null;
    renderHome();
  });


  loadData();
  renderHome();
  if (!appData.onboarded) {
    appData.onboarded = true;
    saveData();
    openAccountModal();
  }
})();
</script>
</body>
</html>
