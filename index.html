  function loadData() {
    try {
      const s = localStorage.getItem(STORE_KEY);
      if (s) {
        const parsed = JSON.parse(s);
        if (parsed && parsed.accounts) appData = Object.assign({}, appData, parsed);
      }
      // 新フィールドのマイグレーション（既存の進捗はそのまま保持）
      Object.values(appData.accounts).forEach(a => {
        if (!Array.isArray(a.wrongList)) a.wrongList = [];
        if (!a.badges || typeof a.badges !== "object") a.badges = {};
        if (typeof a.totalCorrect !== "number") a.totalCorrect = 0;
        if (typeof a.maxStreak !== "number") a.maxStreak = a.streak || 0;
        if (typeof a.totalAnswered !== "number") a.totalAnswered = 0;
        if (!a.dailyLog || typeof a.dailyLog !== "object") a.dailyLog = {};
        if (typeof a.flashFlips !== "number") a.flashFlips = 0;
        if (!a.stars || typeof a.stars !== "object") a.stars = {};
        // ステージ解放はid基準で管理する（ステージの挿入・並び替えがあっても進捗がずれないように）
        if (!Array.isArray(a.unlockedIds)) {
          const OLD_ORDER = ["jr1", "jr2", "jr3", "basic", "st1", "st2", "st3", "st4", "st5", "st6", "st7", "st8", "st9", "st10"];
          const uset = new Set(["jr1"]);
          const upto = Math.max(0, Math.min(typeof a.unlockedIndex === "number" ? a.unlockedIndex : 0, OLD_ORDER.length - 1));
          for (let ui = 0; ui <= upto; ui++) uset.add(OLD_ORDER[ui]);
          Object.keys(a.stars).forEach(id => uset.add(id));
          a.unlockedIds = Array.from(uset);
        }
        if (!Array.isArray(a.weekDates)) a.weekDates = [];
        // XPショップ用フィールド（残高は既存の累計XPを引き継ぐ）
        if (typeof a.xpBalance !== "number") a.xpBalance = a.xp || 0;
        if (typeof a.hintTickets !== "number") a.hintTickets = 0;
        if (typeof a.streakFreezes !== "number") a.streakFreezes = 0;
        if (!Array.isArray(a.unlockedAvatars)) a.unlockedAvatars = [];
        if (!Array.isArray(a.themesOwned)) a.themesOwned = [];
        if (typeof a.themeColor !== "string") a.themeColor = "blue";
        // ダークモード／お知らせ既読用フィールド
        if (typeof a.darkMode !== "boolean") a.darkMode = false;
        if (!Array.isArray(a.readAnnouncements)) a.readAnnouncements = [];
        // デイリー報酬（ブースト/ガチャ/週間ボーナス）用フィールド

        // フレンド機能用フィールド（既存アカウントにも後付けで発行）

        if (!a.weeklyBonus || typeof a.weeklyBonus !== "object") a.weeklyBonus = { weekKey: null, progress: 0, completed: false };
        if (typeof a.weeklyBonus.weekKey !== "string") a.weeklyBonus.weekKey = null;

  function saveData() {

  function curAcc() {
    return appData.accounts[appData.activeId] || appData.accounts["guest"];

  // ステージが解放されているか（id基準の記録＋「前のステージをクリアしたら次が開く」フォールバック）
  // 難問チャレンジ（challenge: true）は進捗に関係なく初回から常時挑戦可能
  function isStageUnlocked(acc, idx) {
    const st = STAGES[idx];
    if (st && st.challenge) return true;
    if (idx <= 0) return true;
    if (st && Array.isArray(acc.unlockedIds) && acc.unlockedIds.includes(st.id)) return true;
    const prev = STAGES[idx - 1];
    return !!(prev && (acc.stars[prev.id] || 0) > 0);
  }
  function stageIndexById(id) { return STAGES.findIndex(s => s.id === id); }

  // "YYYY-MM-DD" 同士の日数差（b - a）を返す
  function dayDiff(a, b) {
    const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
    return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
  }

  function recordDailyActivity(xpGain) {

    if (!acc.dailyLog || typeof acc.dailyLog !== "object") acc.dailyLog = {};
    const logTd = todayStr();
    if (!acc.dailyLog[logTd]) acc.dailyLog[logTd] = { xp: 0, correct: 0, answered: 0 };
    acc.dailyLog[logTd].xp += xpGain;
    if (acc.id === "guest") { saveData(); return; } // ゲストはストリーク対象外（XPのみ加算）
    const td = todayStr();
    const yd = yesterdayStr();
    if (acc.lastActiveDate !== td) {
      if (acc.lastActiveDate === yd) {
        acc.streak += 1;
      } else if (acc.lastActiveDate && acc.streak > 0) {
        // 空いた日数ぶんをストリークフリーズでカバーできればストリーク維持
        const missed = dayDiff(acc.lastActiveDate, td) - 1;
        if (missed >= 1 && acc.streakFreezes >= missed) {
          acc.streakFreezes -= missed;
          acc.streak += 1;
          for (let k = 1; k <= missed; k++) {
            const ds = jstDateStr(-k);
            if (!acc.weekDates.includes(ds)) acc.weekDates.push(ds);
          }
          showToast(`🧊 ストリークフリーズを${missed}個使って、ストリークを守りました！`);
        } else {
          acc.streak = 1;
        }
      } else {
        acc.streak = 1;
      }
      acc.lastActiveDate = td;
    }
    if (acc.streak > (acc.maxStreak || 0)) acc.maxStreak = acc.streak;
    if (!acc.weekDates.includes(td)) acc.weekDates.push(td);

    return Math.max(0, Math.ceil((end - Date.now()) / 86400000));
  }

    const raceProgress = race ? Math.min(RACE_GOAL, Math.max(0, acc.xp - race.startXp)) : 0;

  // ===== デイリー報酬（XPブースト / 週間ボーナス） =====
  const BOOST_MULTIPLIER = 1.5; // XPブーストの倍率（次のクイズ1回分・端数は切り上げ）

  // ISO週キー（JST基準）。{ key: "2026-W47", num: 47 } を返す
  function jstWeekKey() {
    const p = todayStr().split("-").map(Number);
    const date = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    const dayNum = (date.getUTCDay() + 6) % 7; // 月曜=0
    date.setUTCDate(date.getUTCDate() - dayNum + 3); // その週の木曜に寄せる
    const isoYear = date.getUTCFullYear();
    const firstThu = new Date(Date.UTC(isoYear, 0, 4));
    const fDay = (firstThu.getUTCDay() + 6) % 7;
    firstThu.setUTCDate(firstThu.getUTCDate() - fDay + 3); // その年の最初の木曜
    const week = 1 + Math.round((date - firstThu) / 604800000);
    return { key: isoYear + "-W" + String(week).padStart(2, "0"), num: week };
  }

  // 週間ボーナスの報酬セット（週番号で3種類をローテーション）
  const WEEKLY_BONUS_SETS = [
    {
      name: "ヒント週間", complete: { type: "boost", amount: 2 },
      cells: [
        { type: "hint", amount: 1 }, { type: "xp", amount: 30 }, { type: "boost", amount: 1 },
        { type: "hint", amount: 1 }, { type: "xp", amount: 50 }, { type: "freeze", amount: 1 },
        { type: "xp", amount: 60 }
      ]
    },
    {
      name: "フリーズ週間", complete: { type: "freeze", amount: 2 },
      cells: [
        { type: "xp", amount: 30 }, { type: "freeze", amount: 1 }, { type: "xp", amount: 40 },
        { type: "hint", amount: 1 }, { type: "boost", amount: 1 }, { type: "freeze", amount: 1 },
        { type: "xp", amount: 80 }
      ]
    },
    {
      name: "ブースト週間", complete: { type: "boost", amount: 2 },
      cells: [
        { type: "hint", amount: 1 }, { type: "xp", amount: 40 }, { type: "xp", amount: 50 },
        { type: "boost", amount: 1 }, { type: "freeze", amount: 1 }, { type: "xp", amount: 60 },
        { type: "boost", amount: 1 }
      ]
    }
  ];
  function weeklySet() {
    const wk = jstWeekKey();
    return { set: WEEKLY_BONUS_SETS[wk.num % WEEKLY_BONUS_SETS.length], key: wk.key, num: wk.num };
  }
  function rewardLabel(r) {
    if (r.type === "hint") return `💡 ヒントチケット ×${r.amount}`;
    if (r.type === "freeze") return `🧊 ストリークフリーズ ×${r.amount}`;
    if (r.type === "boost") return `⚡ XPブースト ×${r.amount}`;
    if (r.type === "xp") return `⚡ ${r.amount} XP`;
    return "🎁 報酬";
  }
  function rewardIcon(r) {
    return { hint: "💡", freeze: "🧊", boost: "⚡", xp: "⚡" }[r.type] || "🎁";
  }
  function rewardShort(r) {
    return r.type === "xp" ? r.amount + "XP" : "×" + r.amount;
  }
  // 報酬をアカウントへ付与（XP報酬は累計XPと残高の両方に加算し、称号判定とそろえる）
  function applyReward(acc, r) {
    if (r.type === "hint") acc.hintTickets += r.amount;
    else if (r.type === "freeze") acc.streakFreezes += r.amount;
    else if (r.type === "boost") acc.xpBoost += r.amount;
    else if (r.type === "xp") { acc.xp += r.amount; acc.xpBalance += r.amount; }
  }
  // 週が変わっていたら週間ボーナス進捗をリセットする（リセットしたら true）
  function syncWeeklyBonus(acc) {
    const wk = weeklySet();
    if (!acc.weeklyBonus || acc.weeklyBonus.weekKey !== wk.key) {
      acc.weeklyBonus = { weekKey: wk.key, progress: 0, completed: false };
      return true;
    }
    return false;
  }

  // デイリー初回完了時の報酬付与。付与内容の説明文リストを返す（同日2回目以降は空配列＝付与なし）
  function grantDailyRewards() {
    const acc = curAcc();
    const td = todayStr();
    if (acc.lastDailyRewardDate === td) return [];
    acc.lastDailyRewardDate = td;
    const msgs = [];
    acc.xpBoost += 1;
    msgs.push("⚡ XPブースト ×1（次のクイズの獲得XPが1.5倍）");
    // 週間ボーナスボードを1マス進める（週替わりなら先にリセット）
    syncWeeklyBonus(acc);
    const wk = weeklySet();
    if (acc.weeklyBonus.progress < wk.set.cells.length) {
      const cell = wk.set.cells[acc.weeklyBonus.progress];
      acc.weeklyBonus.progress += 1;
      applyReward(acc, cell);
      msgs.push(`📅 週間ボーナス ${acc.weeklyBonus.progress}マス目：${rewardLabel(cell)}`);
      if (acc.weeklyBonus.progress >= wk.set.cells.length && !acc.weeklyBonus.completed) {
        acc.weeklyBonus.completed = true;
        applyReward(acc, wk.set.complete);
        msgs.push(`🎉 週間コンプリート報酬：${rewardLabel(wk.set.complete)}`);
      }
    }
    saveData();
    return msgs;
  }

  // Math Renderer
  function texToHtml(tex) {
    let t = tex.trim();
    const sym = {
      "\\\\theta": "θ", "\\\\lambda": "λ", "\\\\nu": "ν", "\\\\pi": "π",
      "\\\\Delta": "Δ", "\\\\Omega": "Ω", "\\\\times": "×", "\\\\cdot": "·",
      "\\\\approx": "≈", "\\\\sqrt": "√"
    };
    t = t.replace(/\\(?:text|mathrm)\{([^{}]*)\}/g, "$1");
    for (let p = 0; p < 2; p++) {
      t = t.replace(/\\frac\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g,
        '<span class="math-frac"><span class="num">$1</span><span class="den">$2</span></span>');
      t = t.replace(/\\sqrt\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g,
        '<span class="math-sqrt">√<span class="math-sqrt-body">$1</span></span>');
    }
    for (const [k, v] of Object.entries(sym)) t = t.replace(new RegExp(k + "(?![a-zA-Z])", "g"), v);
    t = t.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>").replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
    t = t.replace(/_([a-zA-Z0-9])/g, "<sub>$1</sub>").replace(/\^([a-zA-Z0-9])/g, "<sup>$1</sup>");
    t = t.replace(/\\,/g, "&thinsp;").replace(/[{}]/g, "");
    return t;
  }

  function renderMath(el) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    const nodes = []; let n;
    while ((n = walker.nextNode())) { if (n.nodeValue && n.nodeValue.includes("$")) nodes.push(n); }
    nodes.forEach(tn => {
      const parts = tn.nodeValue.split(/(\$[^$]+?\$)/g);
      if (parts.length <= 1) return;
      const frag = document.createDocumentFragment();
      parts.forEach(p => {
        if (p.startsWith("$") && p.endsWith("$")) {
          const sp = document.createElement("span"); sp.className = "math-inline"; sp.innerHTML = texToHtml(p.slice(1, -1)); frag.appendChild(sp);
        } else if (p) frag.appendChild(document.createTextNode(p));
      });
      tn.parentNode.replaceChild(frag, tn);
    });
  }

        <span style="font-size:12px; color:var(--text-light); font-weight:700;">全${STAGES.length}ステージ</span>
      </div>

      <section class="stage-path">
        ${STAGES.map((st, idx) => {
          const unlocked = isStageUnlocked(acc, idx);
          const stars = acc.stars[st.id] || 0;
          const cls = stars > 0 ? "cleared" : unlocked ? "unlocked" : "locked";
          const offset = (idx % 2 === 0 ? -14 : 14);
          const challengeHead = st.challenge && (idx === 0 || !STAGES[idx - 1].challenge)
            ? `<div class="challenge-head">🔥 難問チャレンジ<span>難易度高めの発展ステージ（全${STAGES.filter(s => s.challenge).length}ステージ）― 最初からいつでも挑戦できます</span></div>` : "";
          return `
            ${challengeHead}
            <div class="stage-node-wrap" style="transform:translateX(${offset}px);">
              <div class="stage-node ${cls}${st.challenge ? " challenge-node" : ""}" data-st-idx="${idx}">
                <div class="stage-circle" style="background:${unlocked ? st.color : "#94a3b8"};">
                  ${unlocked ? st.icon : "🔒"}
                </div>
                <div style="flex:1; min-width:0;">
                  <div style="font-size:11.5px; font-weight:800; color:${unlocked ? st.color : "#64748b"};">STAGE ${st.num}</div>
                  <div style="font-size:15.5px; font-weight:800;">${st.title}</div>
                  <div style="font-size:12px; color:var(--text-muted);">${st.sub}</div>
                  ${stars > 0 ? `<div class="stage-stars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>` : ""}
                </div>
                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
                  <div style="font-size:18px; color:var(--text-light);">${unlocked ? (stars > 0 ? "↻" : "▶") : ""}</div>
                  ${unlocked ? `<button class="intro-btn" data-intro-idx="${idx}">📘 解説</button>` : ""}
                </div>
              </div>
            </div>
          `;
        }).join("")}
      </section>
    `;

    document.getElementById("startDailyBtn").addEventListener("click", startDailyQuiz);
    const friendsBtn = document.getElementById("friendsBtn");
    if (friendsBtn) friendsBtn.addEventListener("click", () => renderFriends());
    const homeShopBtn = document.getElementById("homeShopBtn");
    if (homeShopBtn) homeShopBtn.addEventListener("click", () => renderShop());
    const reviewBtn = document.getElementById("reviewBtn");
    if (reviewBtn && acc.wrongList.length) reviewBtn.addEventListener("click", startReviewQuiz);
    main.querySelectorAll(".stage-node").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.getAttribute("data-st-idx"));
        if (isStageUnlocked(curAcc(), idx)) renderStageIntro(idx);
      });
    });
    main.querySelectorAll(".intro-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const idx = Number(btn.getAttribute("data-intro-idx"));
        if (isStageUnlocked(curAcc(), idx)) renderStageIntro(idx);
      });
    });
  }


  // ===== ステージ開始前解説（イントロ）画面 =====
  function renderStageIntro(stageIdx) {
    setChromeVisible(false); // イントロからクイズ終了まで没入モード（HUD/タブバーを隠す）
    window.scrollTo(0, 0);
    updateHUD();
    const st = STAGES[stageIdx];
    const intro = st.intro || { concept: st.sub, what: "", terms: [], points: [], formula: "" };
    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="introBackBtn" class="stat-btn">← もどる</button>
          <button id="introSkipBtn" class="stat-btn">スキップ →</button>
        </div>
        <div class="quiz-screen">
          <div style="font-size:12px; font-weight:800; color:${st.color}; margin-bottom:4px;">STAGE ${st.num} ${st.icon} スタート前の解説</div>
          <h2 style="margin:0 0 6px; font-size:21px;">${st.title}</h2>
          <div style="font-size:13.5px; font-weight:800; color:var(--blue-dark); margin-bottom:10px;">🆕 このステージの新しいワード：${intro.concept}</div>
          <div class="lesson-body">
            <p style="margin:0;">${intro.what}</p>
            <h3>📖 キーワード解説</h3>
            ${intro.terms.map(t => {
              const inGlossary = TERMS.some(x => x.term === t.word);
              return `
              <div class="term-card">
                <span class="t-word">${t.word}</span>
                <div class="t-what">${t.what}</div>
                ${inGlossary ? `<button class="glossary-link" data-glossary-word="${t.word}">📖 単語帳で見る →</button>` : ""}
              </div>`;
            }).join("")}
            <h3>⭐ 押さえるポイント</h3>
            <ul>
              ${intro.points.map(p => `<li>${p}</li>`).join("")}
            </ul>
            ${intro.formula ? `<h3>🧮 中心公式</h3><div class="formula-box">${intro.formula}</div>` : ""}
          </div>
          <div style="display:flex; gap:10px; margin-top:16px;">
            <button id="introSkipBtn2" class="btn-3d btn-ghost" style="flex:1;">スキップ →</button>
            <button id="introStartBtn" class="btn-3d btn-green" style="flex:2;">▶ スタート</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("introBackBtn").addEventListener("click", () => renderMain());
    const start = () => startStageQuiz(stageIdx);
    document.getElementById("introSkipBtn").addEventListener("click", start);
    document.getElementById("introSkipBtn2").addEventListener("click", start);
    document.getElementById("introStartBtn").addEventListener("click", start);
    main.querySelectorAll("[data-glossary-word]").forEach(b => {
      b.addEventListener("click", () => openGlossaryTerm(b.getAttribute("data-glossary-word")));
    });
    renderMath(main);
  }

  // 解説画面から単語帳の該当用語へジャンプ（用語を開いた状態で表示）
  function openGlossaryTerm(word) {
    const t = TERMS.find(x => x.term === word);
    if (!t) return;
    wordField = t.field;
    renderWordList();
    const list = filteredTerms();
    const i = list.findIndex(x => x.term === word);
    const items = document.querySelectorAll(".word-item");
    if (i >= 0 && items[i]) {
      items[i].classList.add("open");
      items[i].scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }

  function startStageQuiz(stageIdx) {
    const st = STAGES[stageIdx];
    const refs = st.questions.map((q, i) => ({ stageId: st.id, qIndex: i }));
    session = { mode: "stage", stageIdx, questions: st.questions, refs, qIdx: 0, combo: 0, correctCount: 0, answered: false, chosenIdx: -1 };
    renderQuiz();
  }

  function startDailyQuiz() {
    const acc = curAcc();
    const pool = [];
    // デイリーは通常ステージの解放済み範囲から出題（難問チャレンジは専用ステージとしてマップから挑戦）
    STAGES.forEach((st, i) => { if (!st.challenge && isStageUnlocked(acc, i)) st.questions.forEach(q => pool.push(q)); });
    const pick = pool[Math.floor(Math.random() * pool.length)];
    let pickStageIdx = 0, pickRef = { stageId: STAGES[0].id, qIndex: 0 };
    for (let i = 0; i < STAGES.length; i++) {
      const j = STAGES[i].questions.indexOf(pick);
      if (j >= 0) { pickStageIdx = i; pickRef = { stageId: STAGES[i].id, qIndex: j }; break; }
    }
    session = { mode: "daily", stageIdx: pickStageIdx, questions: [pick], refs: [pickRef], qIdx: 0, combo: 0, correctCount: 0, answered: false, chosenIdx: -1 };
    renderQuiz();
  }

  function startReviewQuiz() {
    const acc = curAcc();
    const questions = [], refs = [];
    acc.wrongList.slice(0, 10).forEach(key => {
      const parts = key.split(":");
      const st = STAGES.find(s => s.id === parts[0]);
      const qi = Number(parts[1]);
      if (st && st.questions[qi]) {
        questions.push(st.questions[qi]);
        refs.push({ stageId: st.id, qIndex: qi });
      }
    });
    if (questions.length === 0) { renderMain(); return; }
    session = { mode: "review", stageIdx: 0, questions, refs, qIdx: 0, combo: 0, correctCount: 0, answered: false, chosenIdx: -1 };
    renderQuiz();
  }

  function renderQuiz() {
    setChromeVisible(false); // クイズ中は没入モード
    window.scrollTo(0, 0); // 次の問題でもヒント・問題文が画面上部から見えるようにする
    const q = session.questions[session.qIdx];
    if (!Array.isArray(session.eliminated)) session.eliminated = [];
    const acc = curAcc();
    const total = session.questions.length;
    const pct = Math.round(((session.qIdx + (session.answered ? 1 : 0)) / total) * 100);
    const title = session.mode === "daily" ? "⚡ 今日の1問チャレンジ" : session.mode === "review" ? "🔁 復習モード（間違えた問題）" : `STAGE ${STAGES[session.stageIdx].num}：${STAGES[session.stageIdx].title}`;

    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="quiz-screen">
        <div class="quiz-progress-row">
          <button id="quitQuizBtn" class="stat-btn">✕ やめる</button>
          <div class="q-bar-track"><div class="q-bar-fill" style="width:${pct}%;"></div></div>
          <span style="font-size:12.5px; font-weight:800; color:var(--text-muted);">${session.qIdx + 1} / ${total}</span>
        </div>

        <div style="font-size:12px; font-weight:800; color:var(--blue); margin-bottom:6px;">${title}</div>
        ${session.combo >= 2 ? `<div class="combo-badge">🔥 ${session.combo} 連続正解 COMBO!</div>` : ""}

        <div class="q-text">${q.q}</div>

        ${!session.answered ? `
        <div class="hint-bar">
          ${session.hintUsed
            ? `<span style="font-size:12.5px; color:var(--text-muted); font-weight:700;">💡 ヒント使用済み（この問題ではもう使えません）</span>`
            : acc.hintTickets > 0
              ? `<button id="hintBtn" class="btn-3d btn-ghost" style="min-height:40px; padding:7px 14px; font-size:13.5px;">💡 ヒントを使う（残り${acc.hintTickets}枚）― 選択肢を2つ消す</button>`
              : `<span style="font-size:12.5px; color:var(--text-light); font-weight:700;">💡 ヒントチケットはXPショップで買えます（残り0枚）</span>`}
        </div>` : ""}

        <div class="choices-grid">
          ${q.opts.map((opt, i) => {
            let cls = "";
            const elim = session.eliminated.includes(i);
            if (elim) cls = "eliminated";
            if (session.answered) {
              if (i === q.ans) cls = "correct";
              else if (i === session.chosenIdx) cls = "wrong";
            }
            return `<button class="choice-btn ${cls}" data-oi="${i}" ${session.answered || elim ? "disabled" : ""}>
              <span style="color:var(--text-light);">${i + 1}.</span><span>${opt}</span>
            </button>`;
          }).join("")}
        </div>

        <div class="memo-box">
          <button id="memoToggleBtn" class="stat-btn" type="button">✏️ メモをひらく</button>
          <div id="memoWrap" style="display:none; margin-top:8px;">
            <canvas id="memoCanvas" class="memo-canvas" width="640" height="320"></canvas>
            <div class="memo-tools">
              <button class="memo-color active" data-memo-color="#0f172a" style="background:#0f172a;" aria-label="黒ペン"></button>
              <button class="memo-color" data-memo-color="#2563eb" style="background:#2563eb;" aria-label="青ペン"></button>
              <button class="memo-color" data-memo-color="#dc2626" style="background:#dc2626;" aria-label="赤ペン"></button>
              <button id="memoEraserBtn" class="stat-btn" type="button">🧽 消しゴム</button>
              <button id="memoClearBtn" class="stat-btn" type="button">🗑️ 全部消す</button>
              <span class="memo-note">指・ペンで計算やメモ書きができます（問題ごとにリセット）</span>
            </div>
          </div>
        </div>

        ${session.answered ? `
          <div class="feedback-banner ${session.chosenIdx === q.ans ? "ok" : "ng"}">
            <div style="font-weight:800; font-size:15px;">
              ${session.chosenIdx === q.ans ? "🎉 正解！ (+10 XP)" : "💡 惜しい！解説を確認しよう"}
            </div>
            <div style="font-size:14px; color:var(--text-main);">${q.exp}</div>
            ${session.chosenIdx === q.ans ? "" : `<button id="bookReviewBtn" class="btn-3d btn-ghost" style="margin-top:6px;">📚 教科書で復習する</button>`}
            <button id="nextQBtn" class="btn-3d ${session.chosenIdx === q.ans ? "btn-green" : "btn-blue"}" style="margin-top:6px;">
              ${session.qIdx + 1 < total ? "つぎの問題へ →" : "結果を見る 🏆"}
            </button>
          </div>
        ` : ""}
      </div>
    `;

    document.getElementById("quitQuizBtn").addEventListener("click", () => { session = null; renderMain(); });
    const hintBtn = document.getElementById("hintBtn");
    if (hintBtn) {
      hintBtn.addEventListener("click", () => {
        const a = curAcc();
        if (session.answered || session.hintUsed || a.hintTickets <= 0) return;
        const wrongIdx = q.opts.map((_, i) => i).filter(i => i !== q.ans);
        for (let i = wrongIdx.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = wrongIdx[i]; wrongIdx[i] = wrongIdx[j]; wrongIdx[j] = tmp;
        }
        session.eliminated = wrongIdx.slice(0, 2);
        session.hintUsed = true;
        a.hintTickets--;
        saveData();
        renderQuiz();
      });
    }
    // 手書きメモ（指・ペン対応。問題が変わると描画はリセットされる）
    const memoToggle = document.getElementById("memoToggleBtn");
    const memoWrap = document.getElementById("memoWrap");
    const memoCanvas = document.getElementById("memoCanvas");
    let memoCtx = null, memoDrawing = false, memoColor = "#0f172a", memoEraser = false, memoLast = null;
    function memoSetup() {
      if (!memoCanvas || memoCtx) return;
      const dpr = window.devicePixelRatio || 1;
      const rect = memoCanvas.getBoundingClientRect();
      const w = Math.max(280, Math.round(rect.width));
      memoCanvas.width = Math.round(w * dpr);
      memoCanvas.height = Math.round(160 * dpr);
      memoCtx = memoCanvas.getContext("2d");
      memoCtx.scale(dpr, dpr);
      memoCtx.lineCap = "round"; memoCtx.lineJoin = "round"; memoCtx.lineWidth = 3;
    }
    function memoPos(e) { const r = memoCanvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    if (memoToggle && memoCanvas) {
      if (session.memoOpen) { memoWrap.style.display = "block"; memoToggle.textContent = "✏️ メモをとじる"; requestAnimationFrame(memoSetup); }
      memoToggle.addEventListener("click", () => {
        session.memoOpen = !session.memoOpen;
        memoWrap.style.display = session.memoOpen ? "block" : "none";
        memoToggle.textContent = session.memoOpen ? "✏️ メモをとじる" : "✏️ メモをひらく";
        if (session.memoOpen) requestAnimationFrame(memoSetup);
      });
      memoCanvas.addEventListener("pointerdown", (e) => { memoSetup(); memoDrawing = true; memoLast = memoPos(e); try { memoCanvas.setPointerCapture(e.pointerId); } catch (err) {} e.preventDefault(); });
      memoCanvas.addEventListener("pointermove", (e) => {
        if (!memoDrawing || !memoCtx) return;
        e.preventDefault();
        const p = memoPos(e);
        memoCtx.globalCompositeOperation = memoEraser ? "destination-out" : "source-over";
        memoCtx.strokeStyle = memoColor;
        memoCtx.lineWidth = memoEraser ? 14 : 3;
        memoCtx.beginPath(); memoCtx.moveTo(memoLast.x, memoLast.y); memoCtx.lineTo(p.x, p.y); memoCtx.stroke();
        memoLast = p;
      });
      const memoEnd = () => { memoDrawing = false; memoLast = null; };
      memoCanvas.addEventListener("pointerup", memoEnd);
      memoCanvas.addEventListener("pointercancel", memoEnd);
      memoCanvas.addEventListener("pointerleave", memoEnd);
      document.querySelectorAll("[data-memo-color]").forEach(b => b.addEventListener("click", () => {
        memoEraser = false; memoColor = b.getAttribute("data-memo-color");
        document.querySelectorAll("[data-memo-color]").forEach(x => x.classList.toggle("active", x === b));
        const eb = document.getElementById("memoEraserBtn"); if (eb) eb.classList.remove("active");
      }));
      const memoEraserBtn = document.getElementById("memoEraserBtn");
      if (memoEraserBtn) memoEraserBtn.addEventListener("click", () => { memoEraser = !memoEraser; memoEraserBtn.classList.toggle("active", memoEraser); });
      const memoClearBtn = document.getElementById("memoClearBtn");
      if (memoClearBtn) memoClearBtn.addEventListener("click", () => { if (memoCtx) memoCtx.clearRect(0, 0, memoCanvas.width, memoCanvas.height); });
    }

    main.querySelectorAll(".choice-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (session.answered) return;
        const oi = Number(btn.getAttribute("data-oi"));
        session.answered = true;
        session.chosenIdx = oi;
        const ref = session.refs[session.qIdx];
        if (oi === q.ans) {
          session.correctCount++;
          session.combo++;
          playTone("ok");
          if (ref) trackAnswer(ref.stageId, ref.qIndex, true);
        } else {
          session.combo = 0;
          playTone("ng");
          if (ref) trackAnswer(ref.stageId, ref.qIndex, false);
        }
        renderQuiz();
      });
    });

    if (session.answered) {
      const bookBtn = document.getElementById("bookReviewBtn");
      if (bookBtn) {
        bookBtn.addEventListener("click", () => {
          const ref = session.refs[session.qIdx];
          const st = ref ? STAGES.find(s => s.id === ref.stageId) : null;
          const li = st ? LESSONS.findIndex(ls => ls.stageId === st.id) : -1;
          session = null;
          if (li >= 0) renderLesson(li);
          else renderLessonList();
        });
      }
      document.getElementById("nextQBtn").addEventListener("click", () => {
        if (session.qIdx + 1 < total) {
          session.qIdx++;
          session.answered = false;
          session.chosenIdx = -1;
          session.eliminated = [];
          session.hintUsed = false;
          renderQuiz();
        } else {
          finishQuiz();
        }
      });
    }

    renderMath(main);
  }

  function finishQuiz() {
    setChromeVisible(true); // 結果画面ではクロームを再表示
    const acc = curAcc();
    const total = session.questions.length;
    let earnedXp = session.correctCount * 10 + (session.correctCount === total ? 15 : 0);
    if (session.mode === "review") earnedXp = Math.floor(earnedXp / 2); // 復習モードはXP半分
    // XPブースト所持中は、このクイズ1回分だけ獲得XP×1.5（端数は切り上げ）。獲得XPが0のときは消費しない
    const baseXp = earnedXp;
    let boostUsed = false;
    if (earnedXp > 0 && acc.xpBoost > 0) {
      acc.xpBoost -= 1;
      earnedXp = Math.ceil(earnedXp * BOOST_MULTIPLIER);
      boostUsed = true;
    }
    recordDailyActivity(earnedXp);
    // デイリー初回完了の報酬（XPブースト＋週間ボーナス1マス）。今日もらったブーストは次回から効く
    const dailyRewardMsgs = session.mode === "daily" ? grantDailyRewards() : [];

    let unlockedMsg = "";
    if (session.mode === "stage") {
      const st = STAGES[session.stageIdx];
      const totalQ = session.questions.length;
      const stars = session.correctCount >= Math.ceil(totalQ * 0.9) ? 3 : session.correctCount >= Math.ceil(totalQ * 0.7) ? 2 : session.correctCount >= Math.ceil(totalQ * 0.4) ? 1 : 0;
      if (stars > 0) {
        acc.stars[st.id] = Math.max(acc.stars[st.id] || 0, stars);
        const nextIdx = session.stageIdx + 1;
        if (nextIdx < STAGES.length && !isStageUnlocked(acc, nextIdx)) {
          const nid = STAGES[nextIdx].id;
          if (!Array.isArray(acc.unlockedIds)) acc.unlockedIds = ["jr1"];
          if (!acc.unlockedIds.includes(nid)) acc.unlockedIds.push(nid);
          unlockedMsg = `🔓 STAGE ${STAGES[nextIdx].num}「${STAGES[nextIdx].title}」が解放されました！`;
        }
        saveData();
      }
    }
    playTone("clear");
    updateHUD();
    checkBadges();
    if (dailyRewardMsgs.length) showToast("🎁 デイリー報酬をもらいました！結果画面で確認できます");

    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="quiz-screen" style="text-align:center; padding:32px 20px;">
        <div style="font-size:48px; margin-bottom:8px;">${session.correctCount === total ? "🏆" : "👍"}</div>
        <h2 style="margin:0 0 8px; font-size:22px;">${session.mode === "review" ? "復習完了！" : session.mode === "daily" ? "チャレンジ完了！" : "ステージ完了！"}</h2>
        <div style="font-size:15px; color:var(--text-muted); margin-bottom:14px;">
          正答数：<strong>${session.correctCount} / ${total} 問</strong>　｜　獲得：<strong>+${earnedXp} XP</strong>
        </div>
        <div style="background:#fff7ed; border:1.5px solid #fed7aa; color:#c2410c; border-radius:12px; padding:10px 14px; font-weight:800; font-size:14px; margin-bottom:14px;">
          ${acc.id === "guest" ? "🔒 ストリークはアカウント作成で使えるようになります" : `🔥 ストリーク：${acc.streak} 日連続達成！`}
        </div>
        ${boostUsed ? `<div style="background:#fef9c3; border:1.5px solid #fde047; color:#854d0e; border-radius:12px; padding:10px 14px; font-weight:800; font-size:14px; margin-bottom:14px;">⚡ XPブースト発動！獲得XPが ${baseXp} → ${earnedXp} XP（×1.5）になりました</div>` : ""}
        ${dailyRewardMsgs.length ? `<div style="background:#fdf4ff; border:1.5px solid #f0abfc; color:#86198f; border-radius:12px; padding:10px 14px; font-weight:800; font-size:14px; margin-bottom:14px; text-align:left;">🎁 デイリー報酬ゲット！<br>${dailyRewardMsgs.map(m => "・" + m).join("<br>")}</div>` : ""}
        ${unlockedMsg ? `<div style="background:var(--green-soft); color:var(--green-dark); border-radius:12px; padding:10px 14px; font-weight:800; font-size:14px; margin-bottom:18px;">${unlockedMsg}</div>` : ""}
        ${session.mode === "review" ? `<div style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">復習モードのXPは通常の半分です。残りの復習はあと ${acc.wrongList.length} 問です。</div>` : ""}
        <button id="backMapBtn" class="btn-3d btn-green" style="width:100%;">🗺️ マップへ戻る</button>
      </div>
    `;

  // 開発者への改善リクエスト（FormSubmit経由で外部送信）
  function feedbackFormHtml() {
    return `
      <div class="feedback-box">
        <div style="font-weight:800; font-size:14px; margin-bottom:6px;">💬 改善してほしいところを送る</div>
        <div style="font-size:11.5px; color:var(--text-muted); line-height:1.6; margin-bottom:8px;">
          送信すると、FormSubmitという外部サービスを通じて開発者のメールアドレス宛に内容が送られます。個人情報は書かないでください。
        </div>
        <textarea id="feedbackText" rows="3" placeholder="例：○○の画面が見づらい、△△な機能がほしい など" style="width:100%; border:1.5px solid var(--border); border-radius:10px; padding:10px; font-size:13.5px; font-family:inherit; resize:vertical;"></textarea>
        <button id="feedbackSendBtn" class="btn-3d btn-blue" style="width:100%; margin-top:8px;">✉️ 送信する</button>
        <div id="feedbackStatus" style="font-size:12.5px; margin-top:8px; min-height:16px;"></div>
      </div>
    `;
  }
  function bindFeedbackForm(root) {
    if (!root) return;
    const btn = root.querySelector("#feedbackSendBtn");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      const ta = root.querySelector("#feedbackText");
      const st = root.querySelector("#feedbackStatus");

        "発電機もモーターも電磁誘導とローレンツ力の応用",
        "家庭の交流100 V の最大値は約141 V"
      ],
      formula: raw`$f = qvB\sin\theta$`,
      example: { q: "実効値 100 V の交流電圧の最大値はおよそ何 V？", a: "100 × 1.414 ≒ 141 V" }
    },
    {
      stageId: "st10", title: "量子と原子核",
      intro: "光は波であり粒でもある。原子の中では、私たちの常識が通用しない不思議なルールが支配しています。現代のスマホや太陽電池は、この量子の世界の発見の上に成り立っています。",
      points: [
        "光電効果は光が粒（光子）である証拠",
        "光子のエネルギーは E = hν で色によって決まる",
        "放射性物質は半減期ごとに半分ずつ減っていく",
        "太陽のエネルギーの源は核融合反応"
      ],
      formula: raw`$E = h\nu$`,
      example: { q: "半減期が4年の物質 80 g は、8年後に何 g になる？", a: "半減期2回分なので 80 × (1/2)² = 20 g" }
    }
  ];

  // ===== 単語帳・教科書の画面 =====
  let wordField = "すべて";
  let flashDeck = [];
  let flashPos = 0;
  let flashFlipped = false;

  function filteredTerms() {
    return wordField === "すべて" ? TERMS.slice() : TERMS.filter(t => t.field === wordField);
  }
  function wordChipsHtml(mode) {
    return `
      <div class="chip-row">
        ${WORD_FIELDS.map(f => `<button class="chip ${f === wordField ? "active" : ""}" data-word-field="${f}">${f}</button>`).join("")}
      </div>
      <div class="chip-row">
        <button class="chip ${mode === "list" ? "active" : ""}" id="wordModeList">📖 一覧</button>
        <button class="chip ${mode === "flash" ? "active" : ""}" id="wordModeFlash">🃏 フラッシュカード</button>
      </div>`;
  }
  function bindWordChips(mode) {
    document.querySelectorAll("[data-word-field]").forEach(b => {
      b.addEventListener("click", () => {
        wordField = b.getAttribute("data-word-field");
        if (mode === "flash") renderFlashcards(true); else renderWordList();
      });
    });
    document.getElementById("wordModeList").addEventListener("click", () => renderWordList());
    document.getElementById("wordModeFlash").addEventListener("click", () => renderFlashcards(true));
  }

  function renderWordList() {
    setChromeVisible(true);
    updateHUD();
    const list = filteredTerms();
    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="wordsBackBtn" class="stat-btn">← もどる</button>
          <h2>📖 物理用語の単語帳</h2>
        </div>
        ${wordChipsHtml("list")}
        <div style="font-size:12.5px; color:var(--text-light); font-weight:700; margin-bottom:10px;">${list.length} 語（タップで意味が開きます）</div>
        ${list.map((t, i) => `
          <button class="word-item" data-word-idx="${i}">
            <span class="w-top">
              <span class="w-term">${t.term}</span>
              <span class="w-reading">${t.reading}</span>
              <span class="field-tag">${t.field}</span>
            </span>
            <span class="w-def">
              ${t.def}
              ${t.formula ? `<span class="w-formula" style="display:block;">${t.formula}</span>` : ""}
            </span>
          </button>
        `).join("")}
      </div>
    `;
    document.getElementById("wordsBackBtn").addEventListener("click", () => renderMain());
    bindWordChips("list");
    main.querySelectorAll(".word-item").forEach(item => {
      item.addEventListener("click", () => item.classList.toggle("open"));
    });
    renderMath(main);
  }

  function renderFlashcards(reset) {
    setChromeVisible(true);
    updateHUD();
    if (reset || flashDeck.length === 0) {
      flashDeck = filteredTerms();
      flashPos = 0;
      flashFlipped = false;
    }
    const main = document.getElementById("appMain");
    if (flashDeck.length === 0) {
      main.innerHTML = `
        <div class="sub-screen">
          <div class="sub-head">
            <button id="wordsBackBtn" class="stat-btn">← もどる</button>
            <h2>🃏 フラッシュカード</h2>
          </div>
          ${wordChipsHtml("flash")}
          <div style="color:var(--text-muted);">この分野の用語はまだありません。</div>
        </div>`;
      document.getElementById("wordsBackBtn").addEventListener("click", () => renderMain());
      bindWordChips("flash");
      return;
    }
    if (flashPos >= flashDeck.length) flashPos = 0;
    const t = flashDeck[flashPos];
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="wordsBackBtn" class="stat-btn">← もどる</button>
          <h2>🃏 フラッシュカード</h2>
        </div>
        ${wordChipsHtml("flash")}
        <div style="font-size:12.5px; color:var(--text-light); font-weight:700; margin-bottom:10px;">${flashPos + 1} / ${flashDeck.length} 枚（カードをタップで裏返ります）</div>
        <div class="flash-wrap">
          <div class="flash-card ${flashFlipped ? "flipped" : ""}" id="flashCard">
            <div class="flash-face front">
              <span class="field-tag" style="margin:0;">${t.field}</span>
              <div class="flash-term">${t.term}</div>
              <div class="flash-reading">${t.reading}</div>
              <div class="flash-hint">タップで意味を見る</div>
            </div>
            <div class="flash-face back">
              <div class="flash-def">${t.def}</div>
              ${t.formula ? `<div class="flash-formula">${t.formula}</div>` : ""}
            </div>
          </div>
        </div>
        <div class="flash-nav">
          <button id="flashShuffleBtn" class="btn-3d btn-ghost">🔀 シャッフル</button>
          <button id="flashNextBtn" class="btn-3d btn-blue">つぎへ →</button>
        </div>
      </div>
    `;
    document.getElementById("wordsBackBtn").addEventListener("click", () => renderMain());
    bindWordChips("flash");
    document.getElementById("flashCard").addEventListener("click", () => {
      flashFlipped = !flashFlipped;
      document.getElementById("flashCard").classList.toggle("flipped", flashFlipped);
      // 裏面は常に先頭から表示する（前のカードでスクロールした位置が残らないようにする）
      const backFace = document.querySelector(".flash-face.back");
      if (backFace) backFace.scrollTop = 0;
      if (flashFlipped) {
        const acc = curAcc();
        acc.flashFlips++;
        saveData();
        checkBadges();
      }
    });
    document.getElementById("flashNextBtn").addEventListener("click", () => {
      flashPos = (flashPos + 1) % flashDeck.length;
      flashFlipped = false;
      renderFlashcards(false);
    });
    document.getElementById("flashShuffleBtn").addEventListener("click", () => {
      for (let i = flashDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flashDeck[i], flashDeck[j]] = [flashDeck[j], flashDeck[i]];
      }
      flashPos = 0;
      flashFlipped = false;
      renderFlashcards(false);
    });
    renderMath(main);
  }

  function renderLessonList() {
    setChromeVisible(true);
    updateHUD();
    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="bookBackBtn" class="stat-btn">← もどる</button>
          <h2>📚 簡易教科書</h2>
        </div>
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:14px; line-height:1.6;">
          クイズのステージに対応した、はじめて物理に触れる人向けの短いレッスンです。読んでから問題に挑むと効果的です。
        </div>
        ${LESSONS.map((ls, i) => {
          const st = STAGES.find(s => s.id === ls.stageId);
          return `
            <button class="lesson-item" data-lesson-idx="${i}">
              <div class="stage-circle" style="background:${st.color};">${st.icon}</div>
              <div style="flex:1; min-width:0;">
                <div style="font-size:11.5px; font-weight:800; color:${st.color};">STAGE ${st.num} 対応</div>
                <div style="font-size:15.5px; font-weight:800;">${ls.title}</div>
                <div style="font-size:12px; color:var(--text-muted);">${st.sub}</div>
              </div>
              <div style="font-size:18px; color:var(--text-light);">▶</div>
            </button>`;
        }).join("")}
      </div>
    `;
    document.getElementById("bookBackBtn").addEventListener("click", () => renderMain());
    main.querySelectorAll(".lesson-item").forEach(btn => {
      btn.addEventListener("click", () => renderLesson(Number(btn.getAttribute("data-lesson-idx"))));
    });
    renderMath(main);
  }

  function renderLesson(idx) {
    setChromeVisible(true);
    window.scrollTo(0, 0);
    updateHUD();
    const ls = LESSONS[idx];
    const st = STAGES.find(s => s.id === ls.stageId);
    const stIdx = stageIndexById(ls.stageId);
    const unlocked = isStageUnlocked(curAcc(), stIdx);
    const main = document.getElementById("appMain");
    main.innerHTML = `
      <div class="sub-screen">
        <div class="sub-head">
          <button id="lessonBackBtn" class="stat-btn">← レッスン一覧</button>
        </div>
        <div class="quiz-screen">
          <div style="font-size:12px; font-weight:800; color:${st.color}; margin-bottom:4px;">STAGE ${st.num} 対応 ${st.icon}</div>
          <h2 style="margin:0 0 12px; font-size:21px;">${ls.title}</h2>
          <div class="lesson-body">
            <p style="margin:0;">${ls.intro}</p>
            <h3>⭐ 重要ポイント</h3>
            <ul>
              ${ls.points.map(p => `<li>${p}</li>`).join("")}
            </ul>
            <h3>🧮 中心公式</h3>
            <div class="formula-box">${ls.formula}</div>
            <h3>✏️ 例題</h3>
            <div class="example-box">
              <div><strong>問題：</strong>${ls.example.q}</div>
              <div style="margin-top:6px;"><strong>答え：</strong>${ls.example.a}</div>
            </div>
          </div>
          <button id="lessonQuizBtn" class="btn-3d ${unlocked ? "btn-green" : "btn-ghost"}" style="width:100%; margin-top:8px;" ${unlocked ? "" : "disabled"}>
            ${unlocked ? `▶ STAGE ${st.num} の問題を解く` : `🔒 STAGE ${st.num} はまだ解放されていません`}
          </button>
        </div>
      </div>
    `;
    document.getElementById("lessonBackBtn").addEventListener("click", () => renderLessonList());
    if (unlocked) {
      document.getElementById("lessonQuizBtn").addEventListener("click", () => startStageQuiz(stIdx));
    }
    renderMath(main);
  }

  // ゲストで始める（モーダルを閉じてゲストのままタイトル画面へ）
  document.getElementById("guestStartBtn").addEventListener("click", () => {
    appData.activeId = "guest";
    saveData();
    document.getElementById("accountModal").classList.remove("open");
    session = null;
    if (appStarted) renderMain(); else renderTitleScreen();
  });


  loadData();
  renderTitleScreen();
  if (!appData.onboarded) {
    appData.onboarded = true;
    saveData();
    openAccountModal();
  }
})();
</script>
</body>
</html>
