    {
      id: "st3b", num: 7, title: "エネルギーの応用", sub: "ばね・振り子・保存則の計算", icon: "🔄", color: "#14b8a6",
      questions: [
        { q: raw`ばね定数 $200\,\mathrm{N/m}$ のばねを $0.050\,\mathrm{m}$ 縮めたとき、蓄えられる弾性エネルギーは何 $\mathrm{J}$ か。`, opts: ["0.25 J", "0.50 J", "5.0 J", "10 J"], ans: 0, exp: raw`$U = \frac{1}{2}kx^2 = \frac{1}{2} \times 200 \times 0.050^2 = 0.25\,\mathrm{J}$ です。` },
        { q: raw`振り子のおもりが最も速くなるのはどの位置か。`, opts: ["最も高い位置", "最下点", "途中のどこでも同じ", "手放した位置"], ans: 1, exp: raw`最下点では位置エネルギーが最小で、その分がすべて運動エネルギーに変わっているため、速さが最大になります。` },
        { q: raw`高さ $1.25\,\mathrm{m}$ の位置から小球を静かに落とした。地面に達する直前の速さはおよそ何 $\mathrm{m/s}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["3.5 m/s", "4.9 m/s", "7.0 m/s", "9.8 m/s"], ans: 1, exp: raw`力学的エネルギー保存より $v = \sqrt{2gh} = \sqrt{2 \times 9.8 \times 1.25} \approx 4.9\,\mathrm{m/s}$ です。` },
        { q: raw`物体の運動エネルギーを2倍にするには、速さを何倍にすればよいか。`, opts: ["2倍", "√2 倍（約1.4倍）", "4倍", "1/2倍"], ans: 1, exp: raw`運動エネルギーは速さの2乗に比例するので、エネルギーを2倍にするには速さを $\sqrt{2}$ 倍にします。` },
        { q: raw`質量が2倍、速さが半分になった物体の運動エネルギーは、もとの何倍か。`, opts: ["1倍（同じ）", "1/2倍", "2倍", "1/4倍"], ans: 1, exp: raw`$K = \frac{1}{2}mv^2$ より、質量2倍で2倍、速さ半分で $\frac{1}{4}$ 倍、合わせて $2 \times \frac{1}{4} = \frac{1}{2}$ 倍です。` },
        { q: raw`重力による位置エネルギーについて正しいものはどれか。`, opts: ["基準面はどこに取ってもよい", "基準面は必ず地面に取る", "高さが2倍になると位置エネルギーも4倍になる", "質量にはよらない"], ans: 0, exp: raw`位置エネルギーは基準面からの高さで決まる相対的な量なので、基準面は問題に合わせて自由に選べます。大切なのは高さの「差」です。` },
        { q: raw`摩擦のある面を物体が滑るとき、失われた力学的エネルギーは主に何に変わるか。`, opts: ["音だけ", "熱（内部エネルギー）", "光", "電気"], ans: 1, exp: raw`摩擦力のした仕事の分だけ力学的エネルギーが減り、その分は接触面の熱（内部エネルギー）などに変わります。エネルギー全体の総和は保存されます。` },
        { q: raw`ばねの弾性エネルギー $\frac{1}{2}kx^2$ について、ばねの伸びを2倍にするとエネルギーは何倍になるか。`, opts: ["2倍", "3倍", "4倍", "8倍"], ans: 2, exp: raw`伸びの2乗に比例するので、$2^2 = 4$ 倍になります。` },
        { q: raw`ジェットコースターがループ（円形のレール）の頂点を通過できるのは、主にどの力のおかげか。`, opts: ["摩擦力", "重力とレールからの垂直抗力", "磁力", "空気の抵抗"], ans: 1, exp: raw`頂点では重力と垂直抗力がどちらも円の中心向きにはたらき、向心力となってコースターを円運動させ続けます。` },
        { q: raw`なめらかな曲面を滑る物体について、力学的エネルギー保存の式として正しいものはどれか。ただし出発点を高さ $h$、速さ $0$、最下点の速さを $v$ とする。`, opts: ["mgh = mv", "mgh = (1/2)mv²", "mgh = (1/2)mv", "gh = v²"], ans: 1, exp: raw`位置エネルギー $mgh$ が最下点で運動エネルギー $\frac{1}{2}mv^2$ にすべて変わるので、$mgh = \frac{1}{2}mv^2$ です。` }
      ]
    },
    {
      id: "st4", num: 8, title: "運動量と円運動", sub: "衝突・モーメント・万有引力", icon: "🪐", color: "#16a34a",
      questions: [
        { q: raw`質量 $2.0\,\mathrm{kg}$ の物体が速さ $6.0\,\mathrm{m/s}$ で動いているときの運動量の大きさは何 $\mathrm{kg\cdot m/s}$ か。`, opts: ["3.0", "8.0", "12", "36"], ans: 2, exp: raw`運動量 $p = mv = 2.0 \times 6.0 = 12\,\mathrm{kg\cdot m/s}$ です。` },
        { q: raw`ドアノブが蝶番から遠い位置についているのは、何を大きくするためか。`, opts: ["力のモーメント", "摩擦力", "運動エネルギー", "遠心力"], ans: 0, exp: raw`うでの長さ $l$ を大きくすることで、小さい力でも大きな力のモーメント $M = Fl$ を得られます。` },
        { q: raw`惑星が太陽のまわりを回るのに必要な向心力を与えている力は何か。`, opts: ["静電気力", "万有引力", "弾性力", "磁力"], ans: 1, exp: raw`太陽と惑星の間の万有引力 $F = G\frac{Mm}{r^2}$ が向心力としてはたらきます。` }
      ]
    },
    {
      id: "st4b", num: 8, title: "単振動", sub: "ばね振り子・単振り子・周期", icon: "🌀", color: "#22c55e",
      questions: [
        { q: raw`ばね振り子の周期 $T = 2\pi\sqrt{\frac{m}{k}}$ について、おもりの質量を4倍にすると周期はどうなるか。`, opts: ["1/2倍", "変わらない", "2倍", "4倍"], ans: 2, exp: raw`周期は質量の平方根に比例するので、質量4倍で周期は $\sqrt{4} = 2$ 倍になります。` },
        { q: raw`単振り子（糸の長さ $l$ の振り子）の周期は、おもりの質量を変えるとどうなるか。`, opts: ["重いほど長くなる", "重いほど短くなる", "変わらない", "質量に比例する"], ans: 2, exp: raw`単振り子の周期 $T = 2\pi\sqrt{\frac{l}{g}}$ は糸の長さと重力加速度だけで決まり、おもりの質量や（小さい範囲での）振れ幅にはよりません。` },
        { q: raw`単振り子の糸の長さを4倍にすると、周期はどうなるか。`, opts: ["1/2倍", "2倍", "4倍", "変わらない"], ans: 1, exp: raw`周期は糸の長さの平方根に比例するので、長さ4倍で周期は2倍になります。` },
        { q: raw`ばね定数 $100\,\mathrm{N/m}$ のばねに質量 $1.0\,\mathrm{kg}$ のおもりをつけたばね振り子がある。単振動の角振動数 $\omega = \sqrt{\frac{k}{m}}$ は何 $\mathrm{rad/s}$ か。`, opts: ["1 rad/s", "10 rad/s", "100 rad/s", "0.1 rad/s"], ans: 1, exp: raw`$\omega = \sqrt{100 / 1.0} = 10\,\mathrm{rad/s}$ です。周期は $T = 2\pi / \omega \approx 0.63$ 秒になります。` },
        { q: raw`単振動している物体の速さが最大になるのはどの位置か。`, opts: ["振動の端（変位が最大の位置）", "振動の中心（つりあいの位置）", "端と中心のちょうど中間", "どの位置でも同じ"], ans: 1, exp: raw`振動の中心では復元力が0ですが、速さは最大になります。逆に端の位置では速さが0で、加速度（復元力）が最大になります。` },
        { q: raw`単振動している物体の加速度の大きさが最大になるのはどの位置か。`, opts: ["振動の中心", "振動の端", "中心と端の中間", "常に一定"], ans: 1, exp: raw`加速度は変位に比例し（$a = -\omega^2 x$）、変位が最大になる振動の端で最大になります。` },
        { q: raw`単振り子を月面（重力加速度が地球の約 $\frac{1}{6}$）に持っていくと、周期はどうなるか。`, opts: ["短くなる", "長くなる", "変わらない", "止まってしまう"], ans: 1, exp: raw`$T = 2\pi\sqrt{\frac{l}{g}}$ より、$g$ が小さいほど周期は長くなります。月の重力では約 $\sqrt{6} \approx 2.4$ 倍の周期になります。` },
        { q: raw`振動数が $0.50\,\mathrm{Hz}$ の単振動の周期は何秒か。`, opts: ["0.25秒", "0.50秒", "2.0秒", "4.0秒"], ans: 2, exp: raw`周期 $T = 1 / f = 1 / 0.50 = 2.0$ 秒です。` },
        { q: raw`楽器の弦や橋などが、外部からの振動と周期が一致して大きく振動する現象を何というか。`, opts: ["うなり", "共振（共鳴）", "回折", "ドップラー効果"], ans: 1, exp: raw`固有振動数と外力の振動数が一致すると振幅が大きくなる現象を共振（共鳴）といいます。ブランコをタイミングよく押すのと同じ原理です。` },
        { q: raw`単振動の変位が $x = A \sin \omega t$ と表されるとき、振幅を表すものはどれか。`, opts: ["ω", "t", "A", "ωt"], ans: 2, exp: raw`$A$ が振動の最大の変位、つまり振幅です。$\omega$ は角振動数で、周期とは $T = 2\pi / \omega$ の関係があります。` }
      ]
    },
    {
      id: "st4c", num: 9, title: "惑星と人工衛星", sub: "ケプラーの法則・宇宙速度", icon: "🛰️", color: "#16a34a",
      questions: [
        { q: raw`ケプラーの第1法則によると、惑星の軌道はどのような形か。`, opts: ["真円", "太陽を1つの焦点とする楕円", "放物線", "直線"], ans: 1, exp: raw`惑星は太陽を焦点の1つとする楕円軌道を描きます。地球の軌道は円に近い楕円です。` },
        { q: raw`ケプラーの第3法則として正しいものはどれか。`, opts: ["公転周期は軌道半径に比例する", "公転周期の2乗は軌道の長半径の3乗に比例する", "公転周期は惑星の質量に比例する", "公転周期は太陽からの距離によらない"], ans: 1, exp: raw`$T^2 \propto a^3$ という関係です。太陽から遠い惑星ほど、公転周期が長くなります。` },
        { q: raw`地表すれすれを円軌道で回る人工衛星に必要な速さ（第一宇宙速度）はおよそ何 $\mathrm{km/s}$ か。`, opts: ["2.9 km/s", "7.9 km/s", "11.2 km/s", "16.7 km/s"], ans: 1, exp: raw`第一宇宙速度はおよそ $7.9\,\mathrm{km/s}$ です。これより速く $11.2\,\mathrm{km/s}$（第二宇宙速度）に達すると、地球の重力を振り切って飛び去ります。` },
        { q: raw`静止衛星（赤道上空で地球の自転と同期して回る衛星）の公転周期はどれか。`, opts: ["90分", "12時間", "24時間", "30日"], ans: 2, exp: raw`地球の自転と同じ24時間で1周するため、地上からは常に同じ位置に静止して見えます。高度は約36000 kmです。` },
        { q: raw`人工衛星が円軌道を回り続けるために必要な向心力は、何によって与えられるか。`, opts: ["ロケットの推進力", "地球との万有引力", "大気の抵抗", "磁力"], ans: 1, exp: raw`衛星はエンジンを噴かなくても、地球の万有引力が向心力となって回り続けます。衛星は「落ち続けながら進んでいる」状態です。` },
        { q: raw`国際宇宙ステーションの中で宇宙飛行士が浮いて見えるのはなぜか。`, opts: ["重力がはたらいていないから", "ステーションごと自由落下し続けているから", "空気が薄いから", "遠心力と重力が常に消し合うから"], ans: 1, exp: raw`ステーションも飛行士も、地球のまわりを同じように落下し続けているため、見かけの重力がなくなります。重力自体は地表の約9割もはたらいています。` },
        { q: raw`ケプラーの第2法則（面積速度一定）から分かることはどれか。`, opts: ["惑星は太陽に近いほど速く進む", "惑星の速さは常に一定", "惑星は太陽から遠いほど速く進む", "軌道の形は円になる"], ans: 0, exp: raw`太陽と惑星を結ぶ線が同じ時間に描く面積が一定なので、太陽に近い（近日点）ほど速く、遠い（遠日点）ほど遅く進みます。` },
        { q: raw`円軌道を回る人工衛星について、軌道半径が大きい衛星ほど公転に必要な速さはどうなるか。`, opts: ["大きくなる", "小さくなる", "変わらない", "質量による"], ans: 1, exp: raw`万有引力 $G\frac{Mm}{r^2} = m\frac{v^2}{r}$ より $v = \sqrt{\frac{GM}{r}}$ となり、軌道半径が大きいほど必要な速さは小さくなります。` },
        { q: raw`惑星の公転周期の2乗が軌道半径の3乗に比例するとき、軌道半径が4倍の惑星の公転周期は何倍か。`, opts: ["4倍", "8倍", "16倍", "64倍"], ans: 1, exp: raw`$T \propto a^{3/2}$ なので、$a$ が4倍になると $T$ は $4^{3/2} = 8$ 倍になります。` },
        { q: raw`月が地球のまわりを約27日で公転しているのは、主に何の力によるか。`, opts: ["地球の磁力", "地球と月の間の万有引力", "太陽の光の圧力", "大気の流れ"], ans: 1, exp: raw`地球と月の間に引力がはたらき、それが月の円運動（公転）の向心力になっています。潮の満ち引きも月の引力と関係しています。` }
      ]
    },
    {
      id: "st5", num: 9, title: "熱と気体の法則", sub: "絶対温度・状態方程式・第1法則", icon: "🔥", color: "#ea580c",
      questions: [
        { q: raw`セルシウス温度 $27^\circ\mathrm{C}$ を絶対温度 $[\mathrm{K}]$ で表すとおよそいくらか。`, opts: ["246 K", "273 K", "300 K", "327 K"], ans: 2, exp: raw`$T = t + 273 = 27 + 273 = 300\,\mathrm{K}$ です。` },
        { q: raw`気体に $400\,\mathrm{J}$ の熱を加えたところ、外部に $150\,\mathrm{J}$ の仕事をした。内部エネルギーの増加は何 $\mathrm{J}$ か。`, opts: ["150 J", "250 J", "400 J", "550 J"], ans: 1, exp: raw`熱力学第1法則 $\Delta U = Q - W = 400 - 150 = 250\,\mathrm{J}$ です。` },
        { q: raw`空気入れでタイヤの空気を素早く圧縮すると先端が熱くなるのはなぜか。`, opts: ["外部から仕事をされたため", "熱を放出したため", "分子が消えたため", "気圧が下がったため"], ans: 0, exp: raw`断熱圧縮により外部から正の仕事をされ、内部エネルギー（温度）が上昇します。` }
      ]
    },
    {
      id: "st5b", num: 10, title: "気体の状態変化と熱機関", sub: "定圧・定積・断熱・熱効率", icon: "♨️", color: "#f97316",
      questions: [
        { q: raw`圧力を一定に保って（定圧変化）理想気体を温めると、体積は絶対温度とどのような関係で変化するか（シャルルの法則）。`, opts: ["比例する", "反比例する", "2乗に比例する", "変化しない"], ans: 0, exp: raw`定圧では $V / T =$ 一定、つまり体積は絶対温度に比例します。風船を温めると膨らむのはこのためです。` },
        { q: raw`体積を一定に保って（定積変化）理想気体を温めると、圧力はどうなるか。`, opts: ["下がる", "上がる（絶対温度に比例）", "変わらない", "0になる"], ans: 1, exp: raw`定積では $p / T =$ 一定なので、圧力は絶対温度に比例して上がります。密閉容器を熱すると破裂しやすくなるのはこのためです。` },
        { q: raw`絶対温度 $300\,\mathrm{K}$ の気体を、圧力一定のまま $600\,\mathrm{K}$ まで温めた。体積は何倍になるか。`, opts: ["1/2倍", "変わらない", "2倍", "4倍"], ans: 2, exp: raw`シャルルの法則より、体積は絶対温度に比例するので、温度が2倍になれば体積も2倍になります。` },
        { q: raw`温度を一定に保ったまま（等温変化）理想気体を膨張させた。内部エネルギーの変化はどうなるか。`, opts: ["増える", "減る", "変わらない", "圧力による"], ans: 2, exp: raw`理想気体の内部エネルギーは温度だけで決まるので、等温変化では内部エネルギーは変化しません。外部にした仕事の分だけ、熱を吸収しています。` },
        { q: raw`圧力 $1.0 \times 10^5\,\mathrm{Pa}$ のもとで、気体が $0.020\,\mathrm{m^3}$ だけ膨張した。気体が外部にした仕事は何 $\mathrm{J}$ か。`, opts: ["20 J", "200 J", "2000 J", "20000 J"], ans: 2, exp: raw`定圧変化の仕事は $W = p \Delta V = 1.0 \times 10^5 \times 0.020 = 2000\,\mathrm{J}$ です。$p$-$V$ グラフでは、グラフの下の面積が仕事を表します。` },
        { q: raw`熱機関の熱効率が必ず1（100%）未満になるのは、どの法則によるか。`, opts: ["熱力学第1法則", "熱力学第2法則", "ボイルの法則", "オームの法則"], ans: 1, exp: raw`熱は自然には低温から高温へ移らず、受け取った熱をすべて仕事に変えることはできません（熱力学第2法則）。一部の熱は必ず低温側へ捨てられます。` },
        { q: raw`冷蔵庫やエアコン（冷房）が、低温側から高温側へ熱を運べるのはなぜか。`, opts: ["熱が自然に逆向きに流れるから", "外部から仕事（電気エネルギー）を加えているから", "冷媒が熱を消すから", "第2法則が当てはまらないから"], ans: 1, exp: raw`コンプレッサーが仕事をすることで、熱を低温側から高温側へ「汲み上げる」ことができます。仕事なしには起こりません。` },
        { q: raw`氷 $10\,\mathrm{g}$ をすべて溶かすのに必要な熱量はおよそ何 $\mathrm{J}$ か。氷の融解熱を $334\,\mathrm{J/g}$ とする。`, opts: ["334 J", "1670 J", "3340 J", "33400 J"], ans: 2, exp: raw`融解熱 $\times$ 質量 $= 334 \times 10 = 3340\,\mathrm{J}$ です。溶けている間、温度は $0^\circ\mathrm{C}$ のまま変わりません（熱は状態変化に使われます）。` },
        { q: raw`物質量 $2.0\,\mathrm{mol}$、絶対温度 $300\,\mathrm{K}$、体積 $0.050\,\mathrm{m^3}$ の理想気体の圧力はおよそ何 $\mathrm{Pa}$ か。気体定数を $8.3\,\mathrm{J/(mol\cdot K)}$ とする。`, opts: ["$1.0 \times 10^4$ Pa", "$1.0 \times 10^5$ Pa", "$1.0 \times 10^6$ Pa", "$5.0 \times 10^5$ Pa"], ans: 1, exp: raw`状態方程式 $p = \frac{nRT}{V} = \frac{2.0 \times 8.3 \times 300}{0.050} \approx 1.0 \times 10^5\,\mathrm{Pa}$ です。大気圧とほぼ同じ圧力です。` },
        { q: raw`真空中に気体を一気に膨張させた（断熱自由膨張）。このとき気体が外部にする仕事はいくらか。`, opts: ["加えた熱量と等しい", "0", "内部エネルギーと等しい", "無限大"], ans: 1, exp: raw`真空中への膨張では押し返す相手がいないので仕事は $0$ です。断熱でもあるため、理想気体では内部エネルギーも温度も変わりません。` }
      ]
    },
    {
      id: "st6", num: 10, title: "波の性質と音", sub: "波長・振動数・ドップラー効果", icon: "🌊", color: "#0891b2",
      questions: [
        { q: raw`振動数 $5.0\,\mathrm{Hz}$、波長 $2.0\,\mathrm{m}$ の波が伝わる速さは何 $\mathrm{m/s}$ か。`, opts: ["0.4 m/s", "2.5 m/s", "7.0 m/s", "10 m/s"], ans: 3, exp: raw`波の基本式 $v = f\lambda = 5.0 \times 2.0 = 10\,\mathrm{m/s}$ です。` },
        { q: raw`振動数 $440\,\mathrm{Hz}$ と $443\,\mathrm{Hz}$ のおんさを同時に鳴らすと、1秒間に何回のうなりが聞こえるか。`, opts: ["1回", "3回", "6回", "441回"], ans: 1, exp: raw`うなりの振動数は $|443 - 440| = 3\,\mathrm{Hz}$（1秒間に3回）です。` },
        { q: raw`救急車が近づいてくるとき、サイレンの音が本来の音より高く聞こえる現象を何というか。`, opts: ["全反射", "ドップラー効果", "回折", "共鳴"], ans: 1, exp: raw`音源の移動によって波面が縮み、振動数が高く聞こえる現象をドップラー効果といいます。` }
      ]
    },
    {
      id: "st6b", num: 11, title: "弦と気柱の振動", sub: "定常波・共鳴・倍音", icon: "🎸", color: "#06b6d4",
      questions: [
        { q: raw`弦にできる定常波について、両端はどのようになっているか。`, opts: ["両端とも腹になる", "両端とも節になる", "一方が節で他方が腹", "端では振動しない部分はない"], ans: 1, exp: raw`弦は両端が固定されているため、両端は振動しない「節」になります。基本振動では中央に腹が1つできます。` },
        { q: raw`長さ $0.85\,\mathrm{m}$ の開管（両端が開いた管）の基本振動数は何 $\mathrm{Hz}$ か。音速を $340\,\mathrm{m/s}$ とする。`, opts: ["100 Hz", "200 Hz", "400 Hz", "800 Hz"], ans: 1, exp: raw`開管の基本振動では管の長さが波長の半分になるので $\lambda = 2 \times 0.85 = 1.7\,\mathrm{m}$、振動数は $f = 340 / 1.7 = 200\,\mathrm{Hz}$ です。` },
        { q: raw`閉管（片端が閉じた管）にできる定常波の倍音として、正しいものはどれか。`, opts: ["基本振動数の偶数倍だけ", "基本振動数の奇数倍だけ", "すべての整数倍", "倍音はできない"], ans: 1, exp: raw`閉管では閉端が節・開端が腹になるため、基本振動数の1倍、3倍、5倍…という奇数倍の振動だけができます。` },
        { q: raw`閉管の基本振動では、管の長さ $L$ と波長 $\lambda$ の関係はどうなるか。`, opts: ["L = λ", "L = λ/2", "L = λ/4", "L = 2λ"], ans: 2, exp: raw`節から腹までは波長の $\frac{1}{4}$ なので、閉管の基本振動では $L = \frac{\lambda}{4}$、つまり $\lambda = 4L$ になります。` },
        { q: raw`弦を伝わる波の速さを2倍にするには、弦を引く力（張力）を何倍にすればよいか。`, opts: ["2倍", "4倍", "1/2倍", "√2倍"], ans: 1, exp: raw`弦を伝わる波の速さは張力の平方根に比例する（$v = \sqrt{\frac{F}{\rho}}$）ので、速さを2倍にするには張力を4倍にします。` },
        { q: raw`ギターの弦について、細い弦ほど基本振動数が高い（音が高い）のはなぜか。`, opts: ["弦を伝わる波が速くなるから", "弦が短いから", "張力が強いから", "振幅が大きいから"], ans: 0, exp: raw`細い弦は単位長さあたりの質量（線密度）が小さいため、波の速さ $v = \sqrt{F/\rho}$ が大きくなり、同じ長さでも振動数が高くなります。` },
        { q: raw`開管の第2倍音の振動数は、基本振動数の何倍か。`, opts: ["2倍", "3倍", "4倍", "1/2倍"], ans: 0, exp: raw`開管ではすべての整数倍の倍音ができるので、第2倍音は基本振動数の2倍です。閉管では次の共鳴が3倍になる点が違います。` },
        { q: raw`ギターでフレットを押さえて弦の振動する部分を短くすると、音はどうなるか。`, opts: ["低くなる", "高くなる", "変わらない", "大きくなる"], ans: 1, exp: raw`振動する長さが短くなるほど振動数が高くなるので、音は高くなります。長さが半分になると振動数は2倍（1オクターブ上）です。` },
        { q: raw`おんさを鳴らして開管の口に近づけたとき、管の長さがちょうどよいと大きな音が鳴る。この現象を何というか。`, opts: ["うなり", "共鳴", "回折", "ドップラー効果"], ans: 1, exp: raw`気柱の固有振動数とおんさの振動数が一致すると、気柱が大きく振動する「共鳴」が起こります。` },
        { q: raw`定常波について正しいものはどれか。`, opts: ["波形がその場にとどまって振動する", "波形が速く進んでいく", "振幅はどこでも同じ", "節の位置も移動する"], ans: 0, exp: raw`定常波は、同じ波が逆向きに進んで重なったもので、節と腹の位置は動かず、波形がその場で振動します。` }
      ]
    },
    {
      id: "st7", num: 11, title: "光の干渉とレンズ", sub: "屈折・全反射・シャボン玉", icon: "🌈", color: "#7c3aed",
      questions: [
        { q: raw`光ファイバーの中で光が外に漏れず遠くまで伝わるのはどの現象を利用しているか。`, opts: ["全反射", "偏光", "ドップラー効果", "熱伝導"], ans: 0, exp: raw`臨界角以上の角度で入射した光が境界面で100%反射される「全反射」を利用しています。` },
        { q: raw`シャボン玉の表面が虹色に見える主な理由は何か。`, opts: ["薄膜の干渉", "万有引力", "電磁誘導", "静電気"], ans: 0, exp: raw`膜の表と裏で反射した光が干渉して特定の色が強めあう「薄膜の干渉」によるものです。` },
        { q: raw`虫眼鏡（凸レンズ）で文字を大きく見るとき、できる像はどれか。`, opts: ["倒立実像", "正立実像", "正立虚像", "倒立虚像"], ans: 2, exp: raw`焦点の内側に物体を置くと、大きく拡大された「正立虚像」が見えます。` }
      ]
    },
    {
      id: "st7b", num: 12, title: "レンズと鏡の応用", sub: "レンズの式・倍率・鏡", icon: "🔍", color: "#8b5cf6",
      questions: [
        { q: raw`凸レンズの公式として正しいものはどれか。ただし物体までの距離を $a$、像までの距離を $b$、焦点距離を $f$ とする。`, opts: ["1/a + 1/b = 1/f", "a + b = f", "ab = f", "1/a − 1/b = 1/f"], ans: 0, exp: raw`レンズの公式は $\frac{1}{a} + \frac{1}{b} = \frac{1}{f}$ です。倍率は $\frac{b}{a}$ で求められます。` },
        { q: raw`焦点距離 $20\,\mathrm{cm}$ の凸レンズから $30\,\mathrm{cm}$ 離して物体を置いた。像ができる位置はレンズから何 $\mathrm{cm}$ か。`, opts: ["30 cm", "45 cm", "60 cm", "120 cm"], ans: 2, exp: raw`$\frac{1}{30} + \frac{1}{b} = \frac{1}{20}$ より $\frac{1}{b} = \frac{1}{20} - \frac{1}{30} = \frac{1}{60}$ なので $b = 60\,\mathrm{cm}$ です。倍率は $60/30 = 2$ 倍の倒立実像です。` },
        { q: raw`物体を凸レンズの焦点距離のちょうど2倍の位置に置くと、どのような像ができるか。`, opts: ["物体と同じ大きさの倒立実像", "2倍の大きさの倒立実像", "半分の大きさの正立虚像", "像はできない"], ans: 0, exp: raw`$a = 2f$ のとき $b = 2f$ となり、倍率1倍の等倍の倒立実像ができます。` },
        { q: raw`自動車のサイドミラーや防犯ミラーに凸面鏡が使われる理由はどれか。`, opts: ["像が大きく見えるから", "広い範囲の像が映るから", "像が実像になるから", "光を集められるから"], ans: 1, exp: raw`凸面鏡は光を広げるため、平面鏡より広い範囲を映すことができます。像は小さく正立した虚像になります。` },
        { q: raw`凹面鏡が使われているものはどれか。`, opts: ["自動車のサイドミラー", "反射式望遠鏡やパラボラアンテナ", "近視用の眼鏡", "万華鏡"], ans: 1, exp: raw`凹面鏡は平行な光を焦点に集める性質があるため、反射式望遠鏡の主鏡やパラボラアンテナに使われます。` },
        { q: raw`カメラのレンズがフィルム（イメージセンサー）上に作る像はどれか。`, opts: ["正立した虚像", "倒立した実像", "正立した実像", "倒立した虚像"], ans: 1, exp: raw`カメラは凸レンズで、小さく上下が逆転した倒立実像をセンサー上に結びます。記録後に向きを直して表示しています。` },
        { q: raw`凹レンズでできる像はどれか。`, opts: ["倒立実像のみ", "正立虚像のみ", "倒立虚像のみ", "物体の位置による"], ans: 1, exp: raw`凹レンズは光を広げるため、物体がどこにあっても、物体より小さい正立虚像しかできません。近視の矯正に使われます。` },
        { q: raw`双眼鏡や望遠鏡に全反射プリズムが使われる理由として正しいものはどれか。`, opts: ["光を弱めるため", "光の進路を折り曲げて装置を小型化し、像の向きを直すため", "色を分けるため", "光を速くするため"], ans: 1, exp: raw`プリズムの中で全反射させることで光路を折り返し、長い光路を短い筒に収めて、正立像が得られるようにしています。` },
        { q: raw`虫眼鏡（凸レンズ）の倍率は、どのようなときに大きくなるか。`, opts: ["焦点距離が短いレンズを使うとき", "焦点距離が長いレンズを使うとき", "レンズを遠くに離すとき", "物体を焦点の外に置くとき"], ans: 0, exp: raw`虫眼鏡の倍率はおおむね焦点距離に反比例します。焦点距離の短い（膨らみの大きい）レンズほど大きく拡大できます。` },
        { q: raw`平面鏡に映る像について正しいものはどれか。`, opts: ["鏡からの距離は物体より遠い", "像の大きさは物体と同じで、鏡面に対して対称の位置にできる虚像", "実像である", "上下が逆転する"], ans: 1, exp: raw`平面鏡の像は、鏡面をはさんで物体と対称の位置にできる、物体と同じ大きさの虚像です。左右が逆に見えるのは、こちら向きに映るためです。` }
      ]
    },
    {
      id: "st7c", num: 13, title: "光の干渉演習", sub: "ヤングの実験・回折格子・薄膜", icon: "🌈", color: "#a855f7",
      questions: [
        { q: raw`ヤングの実験でスクリーンにできる明線の間隔 $\Delta x$ は、$\Delta x = \frac{\lambda L}{d}$ と表される。波長 $\lambda$ が大きいほど間隔はどうなるか。`, opts: ["広くなる", "狭くなる", "変わらない", "明線が消える"], ans: 0, exp: raw`間隔は波長に比例するので、赤い光（波長が長い）ほど間隔が広く、紫の光ほど狭くなります。` },
        { q: raw`1 mm あたり500本の線が引かれた回折格子がある。隣り合う線の間隔（格子定数）は何 $\mathrm{m}$ か。`, opts: ["$2 \times 10^{-6}$ m", "$5 \times 10^{-4}$ m", "$2 \times 10^{-3}$ m", "$5 \times 10^{-6}$ m"], ans: 0, exp: raw`格子定数は $d = \frac{1 \times 10^{-3}\,\mathrm{m}}{500} = 2 \times 10^{-6}\,\mathrm{m}$ です。回折格子は光の波長を精密に測るのに使われます。` },
        { q: raw`2つの光が強め合う干渉の条件として正しいものはどれか。`, opts: ["光路差が波長の整数倍", "光路差が波長の半分の奇数倍", "光路差が0のときだけ", "振幅が等しいときだけ"], ans: 0, exp: raw`山と山が重なると強め合うので、光路差が波長の整数倍のときに明るくなります。半波長の奇数倍ずれると弱め合って暗くなります。` },
        { q: raw`シャボン玉の色が、膜の厚さによって場所ごとに違って見えるのはなぜか。`, opts: ["膜の厚さで干渉が強める波長（色）が変わるから", "膜に色がついているから", "光が屈折するから", "温度が違うから"], ans: 0, exp: raw`表と裏の反射光の光路差は膜の厚さで決まるため、厚さごとに強め合う色が変わり、模様のように見えます。` },
        { q: raw`ニュートンリング（平凸レンズと平面ガラスを重ねたときの同心円の干渉縞）の中心はどう見えるか。`, opts: ["明るい", "暗い", "虹色", "見えない"], ans: 1, exp: raw`中心では光路差はほぼ0ですが、ガラス表面での反射で位相が半波長分ずれるため、弱め合って暗くなります。` },
        { q: raw`細い1本のすき間（単スリット）でも干渉・回折の縞模様ができるのはなぜか。`, opts: ["すき間の各点から出た波が重なり合うから", "光が粒子だから", "すき間が光を吸収するから", "目が錯覚するから"], ans: 0, exp: raw`すき間を通過した波は、各点を波源とする波の重ね合わせとなり、方向によって強め合い・弱め合いが起こって縞ができます。` },
        { q: raw`波長が長い波ほど回折しやすい。音と光で回折が目立つのはどちらか。`, opts: ["光", "音", "どちらも同じ", "どちらも回折しない"], ans: 1, exp: raw`音の波長は数十 cm 〜数 m と長く、障害物と同じくらいか大きいため、壁の向こうにも回り込みます。光は波長が短すぎて、日常のスケールでは回折が目立ちません。` },
        { q: raw`CDやDVDの記録面が虹色に見える主な理由はどれか。`, opts: ["表面の細かい溝による回折と干渉", "塗料の色", "光の屈折", "静電気"], ans: 0, exp: raw`規則正しく並んだ細かい溝が回折格子のはたらきをし、波長（色）ごとに反射の方向が変わるため虹色に見えます。` },
        { q: raw`干渉縞がはっきり観察できるために、光源に必要な性質はどれか。`, opts: ["明るいこと", "波の位相のそろい方（可干渉性）が高いこと", "色が白いこと", "熱いこと"], ans: 1, exp: raw`干渉には、位相の関係が時間的に安定した光（可干渉性の高い光）が必要です。レーザー光はその代表で、精密測定に使われます。` },
        { q: raw`くさび形の薄い空気層に光を当てると等間隔の干渉縞ができる。この縞の間隔から分かることはどれか。`, opts: ["光の速さ", "表面のわずかな凹凸や厚さの変化", "空気の温度", "光の強さ"], ans: 1, exp: raw`縞1本分が波長の半分程度の厚さの変化に対応するため、光学製品の表面の平らさを精密に検査するのに使われます。` }
      ]
    },
    {
      id: "st8", num: 12, title: "静電気と直流回路", sub: "オームの法則・電力・コンデンサー", icon: "🔋", color: "#4f46e5",
      questions: [
        { q: raw`$10\,\Omega$ の抵抗に $2.0\,\mathrm{A}$ の電流が流れているとき、抵抗の両端の電圧は何 $\mathrm{V}$ か。`, opts: ["0.2 V", "5.0 V", "12 V", "20 V"], ans: 3, exp: raw`オームの法則 $V = RI = 10 \times 2.0 = 20\,\mathrm{V}$ です。` },
        { q: raw`電圧 $100\,\mathrm{V}$ で電流 $3.0\,\mathrm{A}$ が流れる家電の消費電力は何 $\mathrm{W}$ か。`, opts: ["33 W", "103 W", "300 W", "900 W"], ans: 2, exp: raw`電力 $P = IV = 3.0 \times 100 = 300\,\mathrm{W}$ です。` },
        { q: raw`電気容量 $C$ のコンデンサーを電圧 $V$ で充電したときに蓄えられる電気量 $Q$ はどれか。`, opts: ["C / V", "V / C", "CV", "CV²"], ans: 2, exp: raw`コンデンサーの基本式 $Q = CV$ です。` }
      ]
    },
    {
      id: "st8b", num: 14, title: "電場と電位", sub: "電位・等電位面・電場の計算", icon: "⚡", color: "#6366f1",
      questions: [
        { q: raw`電位とは何を表す量か。`, opts: ["単位電荷あたりの位置エネルギー", "単位時間あたりの電流", "単位面積あたりの力", "電荷の総量"], ans: 0, exp: raw`電位は、$+1\,\mathrm{C}$ の電荷がその場所でもつ位置エネルギーで、単位は $\mathrm{V}$（ボルト）です。重力での「高さ」に似た量です。` },
        { q: raw`一様な電場 $E = 100\,\mathrm{V/m}$ の中で、電場の向きに $0.50\,\mathrm{m}$ 離れた2点間の電位差は何 $\mathrm{V}$ か。`, opts: ["50 V", "100 V", "200 V", "0.5 V"], ans: 0, exp: raw`電位差は $V = Ed = 100 \times 0.50 = 50\,\mathrm{V}$ です。` },
        { q: raw`等電位面と電気力線の関係として正しいものはどれか。`, opts: ["平行になる", "直交する", "45°で交わる", "関係はない"], ans: 1, exp: raw`電気力線は電位の高い方から低い方へ、等電位面に直角に交わります。等電位面上を電荷が移動しても仕事はされません。` },
        { q: raw`電位差 $100\,\mathrm{V}$ で電子1個を加速したとき、電子が得る運動エネルギーは何 $\mathrm{eV}$ か。`, opts: ["1 eV", "100 eV", "100 J", "0.01 eV"], ans: 1, exp: raw`電子が電位差 $V$ で加速されると $eV$（電子ボルト）のエネルギーを得ます。$100\,\mathrm{V}$ なら $100\,\mathrm{eV}$ です。ブラウン管や電子顕微鏡で使われる単位です。` },
        { q: raw`点電荷から距離 $r$ の点の電位 $V = k\frac{Q}{r}$ について、距離が2倍になると電位はどうなるか。`, opts: ["2倍", "1/2倍", "1/4倍", "変わらない"], ans: 1, exp: raw`電位は距離に反比例します。電場の強さが距離の2乗に反比例するのと混同しないようにしましょう。` },
        { q: raw`電場の向きは、電位との関係でどう決まるか。`, opts: ["電位が高くなる向き", "電位が低くなる向き", "電位が一定の向き", "向きは決まらない"], ans: 1, exp: raw`電場は電位の高い方から低い方を向きます。正電荷は電場の向きに、負電荷（電子）は逆向きに力を受けます。` },
        { q: raw`静電場の中で導体が静止しているとき、導体内部の電場と電位はどうなっているか。`, opts: ["電場は0、電位は場所によって違う", "電場は0、電位は全体で一定", "電場も電位も0", "電場は最大になる"], ans: 1, exp: raw`導体内部では自由電子が移動して電場を打ち消すため、内部の電場は0で、電位は導体全体で等しくなります。` },
        { q: raw`雷が発生するのは、主に何が大きくなるためか。`, opts: ["雲と地面の間の電位差", "雲の温度", "空気の密度", "風の速さ"], ans: 0, exp: raw`雲と地面の間の電位差が非常に大きくなると、空気の絶縁が破れて一気に放電します。これが落雷です。避雷針は放電を安全に地面へ逃がします。` },
        { q: raw`電位の単位 $\mathrm{V}$ を、他の単位で表すとどれか。`, opts: ["J/C", "C/J", "N/C", "J/s"], ans: 0, exp: raw`電位は単位電荷あたりのエネルギーなので $\mathrm{V} = \mathrm{J/C}$ です。ちなみに電場の単位は $\mathrm{N/C} = \mathrm{V/m}$ と表せます。` },
        { q: raw`2つの点電荷があるとき、電位はどのように計算するか。`, opts: ["それぞれの電位を単純に足し合わせる", "ベクトルとして合成する", "大きい方だけを取る", "平均を取る"], ans: 0, exp: raw`電位はスカラー量（符号つきの数）なので、各電荷による電位を単純に足し合わせるだけで合成できます。電場（ベクトル）の合成より簡単です。` }
      ]
    },
    {
      id: "st8c", num: 15, title: "コンデンサーの応用", sub: "合成容量・誘電体・エネルギー", icon: "🔋", color: "#4f46e5",
      questions: [
        { q: raw`電気容量 $10\,\mathrm{\mu F}$ のコンデンサーを $100\,\mathrm{V}$ で充電した。蓄えられるエネルギーは何 $\mathrm{J}$ か。`, opts: ["0.050 J", "0.50 J", "5.0 J", "50 J"], ans: 0, exp: raw`$U = \frac{1}{2}CV^2 = \frac{1}{2} \times 10 \times 10^{-6} \times 100^2 = 0.050\,\mathrm{J}$ です。` },
        { q: raw`コンデンサーの極板の間に誘電体（絶縁体）を入れると、電気容量はどうなるか。`, opts: ["小さくなる", "大きくなる", "変わらない", "0になる"], ans: 1, exp: raw`誘電体を入れると、その分極によって実質的な電場が弱まり、同じ電圧でより多くの電荷を蓄えられるため、容量は大きくなります。` },
        { q: raw`平行板コンデンサーの極板間隔を半分にすると、電気容量はどうなるか。`, opts: ["1/2倍", "変わらない", "2倍", "4倍"], ans: 2, exp: raw`容量は $C = \varepsilon \frac{S}{d}$ と極板間隔に反比例するので、間隔が半分で容量は2倍です。極板面積を2倍にしても容量は2倍になります。` },
        { q: raw`電池につないだまま極板間隔を広げると、蓄えられる電荷はどうなるか。`, opts: ["増える", "減る", "変わらない", "0になる"], ans: 1, exp: raw`電池につながっているので電圧 $V$ は一定です。間隔を広げると容量 $C$ が減るので、$Q = CV$ より電荷は減ります。` },
        { q: raw`充電後に電池を外してから極板間隔を広げると、極板間の電圧はどうなるか。`, opts: ["上がる", "下がる", "変わらない", "0になる"], ans: 0, exp: raw`電池を外すと電荷 $Q$ が一定のままになります。間隔を広げると $C$ が減るので、$V = Q / C$ より電圧は上がります。` },
        { q: raw`十分に充電されたコンデンサーに直流電流は流れるか。`, opts: ["流れ続ける", "充電が終わると流れなくなる", "逆向きに流れる", "交流だけ流れる"], ans: 1, exp: raw`コンデンサーは絶縁体をはさんだ構造なので、充電が完了すると電流は止まります。直流回路では「断線」と同じ扱いになります（交流は通します）。` },
        { q: raw`同じ電気容量 $C$ のコンデンサー2つを直列につないだときの合成容量はどれか。`, opts: ["2C", "C", "C/2", "C²"], ans: 2, exp: raw`直列では $\frac{1}{C_{合成}} = \frac{1}{C} + \frac{1}{C} = \frac{2}{C}$ より $C/2$ です。抵抗の並列と同じ計算形になります。` },
        { q: raw`コンデンサーに表示される「耐電圧」とは何か。`, opts: ["発生できる最大の電圧", "安全にかけられる最大の電圧", "充電にかかる時間", "蓄えられる最大の電荷"], ans: 1, exp: raw`耐電圧を超える電圧をかけると、絶縁体が破壊されてコンデンサーが壊れてしまいます。回路の電圧に合った部品を選ぶ必要があります。` },
        { q: raw`スマートフォンのタッチパネルが指の位置を検出できるのは、主に何の変化を読み取っているか。`, opts: ["抵抗の変化", "静電容量の変化", "磁場の変化", "温度の変化"], ans: 1, exp: raw`指が触れると、その部分の静電容量がわずかに変化します。その変化を検出してタッチ位置を特定するのが静電容量方式です。` },
        { q: raw`カメラのフラッシュが一瞬だけ強く光るのは、主に何を利用しているか。`, opts: ["電池の大きな電圧", "コンデンサーに蓄えた電荷を一気に放電する", "コイルの誘導", "半導体の発光"], ans: 1, exp: raw`コンデンサーに時間をかけて電荷を蓄え、撮影の瞬間に一気に放電することで、短時間に大きな電流を流して強く発光させます。` }
      ]
    },
    {
      id: "st9", num: 13, title: "磁場と電磁誘導", sub: "ローレンツ力・レンツの法則・交流", icon: "🧲", color: "#db2777",
      questions: [
        { q: raw`コイルに磁石を近づけると電流が流れる現象を何というか。`, opts: ["電磁誘導", "光電効果", "熱膨張", "全反射"], ans: 0, exp: raw`磁束の変化によって誘導起電力が生じる現象を電磁誘導といいます。` },
        { q: raw`磁場中で動く荷電粒子が受ける力を何というか。`, opts: ["摩擦力", "浮力", "ローレンツ力", "核力"], ans: 2, exp: raw`大きさ $f = qvB\sin\theta$ のローレンツ力を受けます。` },
        { q: raw`日本の家庭用コンセントの交流電圧（実効値 $100\,\mathrm{V}$）の最大値はおよそ何 $\mathrm{V}$ か。`, opts: ["71 V", "100 V", "141 V", "200 V"], ans: 2, exp: raw`$V_0 = \sqrt{2}V_e \approx 1.414 \times 100 \approx 141\,\mathrm{V}$ です。` }
      ]
    },
    {
      id: "st9b", num: 16, title: "交流回路", sub: "リアクタンス・共振・インピーダンス", icon: "🔌", color: "#ec4899",
      questions: [
        { q: raw`交流回路で、コイルが電流の流れを妨げるはたらきの大きさ（誘導リアクタンス）は、周波数が高いほどどうなるか。`, opts: ["大きくなる", "小さくなる", "変わらない", "0になる"], ans: 0, exp: raw`誘導リアクタンスは $X_L = \omega L = 2\pi f L$ で、周波数に比例します。直流（$f = 0$）では理想コイルの抵抗は0です。` },
        { q: raw`交流回路で、コンデンサーが電流を妨げるはたらきの大きさ（容量リアクタンス）は、周波数が高いほどどうなるか。`, opts: ["大きくなる", "小さくなる", "変わらない", "無限大になる"], ans: 1, exp: raw`容量リアクタンスは $X_C = \frac{1}{\omega C}$ で、周波数に反比例します。直流は通さず、周波数が高いほど通しやすくなります。` },
        { q: raw`コイルとコンデンサーを直列につないだ回路で、電流が最大になる（共振する）条件はどれか。`, opts: ["XL = XC", "XL が最大", "XC が最大", "抵抗が0"], ans: 0, exp: raw`$X_L = X_C$ のとき2つのはたらきが打ち消し合い、回路の抵抗分だけが残るため電流が最大になります。このときの周波数が共振周波数です。` },
        { q: raw`共振周波数の公式として正しいものはどれか。`, opts: ["f = 1 / (2π√(LC))", "f = 2π√(LC)", "f = √(LC)", "f = LC / 2π"], ans: 0, exp: raw`$\omega L = \frac{1}{\omega C}$ を解くと $\omega = \frac{1}{\sqrt{LC}}$ となり、$f = \frac{\omega}{2\pi} = \frac{1}{2\pi\sqrt{LC}}$ です。` },
        { q: raw`ラジオの選局（チューニング）で利用されている現象はどれか。`, opts: ["ドップラー効果", "電気的共振", "全反射", "光電効果"], ans: 1, exp: raw`コンデンサーの容量を変えて共振周波数を変え、聞きたい放送局の周波数に合わせると、その電波の電流だけが大きく流れます。` },
        { q: raw`抵抗だけの交流回路で、実効値 $100\,\mathrm{V}$ の電圧と実効値 $2.0\,\mathrm{A}$ の電流が流れている。消費電力は何 $\mathrm{W}$ か。`, opts: ["50 W", "100 W", "200 W", "400 W"], ans: 2, exp: raw`抵抗だけの回路では電圧と電流の位相がそろうので、平均電力は $P = V_e I_e = 100 \times 2.0 = 200\,\mathrm{W}$ です。` },
        { q: raw`理想的なコイルだけの交流回路の平均消費電力はいくらか。`, opts: ["最大になる", "0", "電圧に比例する", "周波数に比例する"], ans: 1, exp: raw`コイルはエネルギーを磁場として蓄えたり戻したりするだけで、熱として消費しないため、理想コイルの平均消費電力は0です。コンデンサーも同様です。` },
        { q: raw`交流回路全体の「抵抗」にあたる量（インピーダンス）の単位はどれか。`, opts: ["V", "A", "Ω", "W"], ans: 2, exp: raw`インピーダンスも抵抗やリアクタンスと同じく $\Omega$（オーム）で表します。直列回路では $Z = \sqrt{R^2 + (X_L - X_C)^2}$ です。` },
        { q: raw`交流の周波数を2倍にすると、コイルのリアクタンスとコンデンサーのリアクタンスはそれぞれどうなるか。`, opts: ["どちらも2倍", "コイルは2倍、コンデンサーは1/2倍", "コイルは1/2倍、コンデンサーは2倍", "どちらも変わらない"], ans: 1, exp: raw`$X_L = 2\pi f L$ は周波数に比例し、$X_C = \frac{1}{2\pi f C}$ は周波数に反比例します。` },
        { q: raw`変圧器が直流では使えない理由はどれか。`, opts: ["直流は電圧が高すぎるから", "磁束が変化しないため電磁誘導が起こらないから", "直流はコイルを溶かすから", "直流には周波数があるから"], ans: 1, exp: raw`変圧器は一次コイルの作る磁束が変化することで二次コイルに電圧が生じます。直流では磁束が一定で変化しないため、誘導電圧が生じません。` }
      ]
    },
    {
      id: "st9c", num: 17, title: "半導体とダイオード", sub: "p型・n型・LED・整流", icon: "🔲", color: "#db2777",
      questions: [
        { q: raw`ダイオードの基本的な性質はどれか。`, opts: ["電流を一方向にだけ流す", "電圧を増幅する", "電気を蓄える", "磁場を作る"], ans: 0, exp: raw`ダイオードは順方向には電流を流しますが、逆方向にはほとんど流しません。この性質が整流などに使われます。` },
        { q: raw`LED（発光ダイオード）が光る仕組みとして正しいものはどれか。`, opts: ["電流による発熱で光る", "電子と正孔が結びつくときにエネルギーを光として放出する", "蛍光物質が光る", "放電で光る"], ans: 1, exp: raw`順方向電流を流すと、電子と正孔（プラスの電荷の抜け穴）が再結合し、そのエネルギー差が光として放出されます。材料によって色が決まります。` },
        { q: raw`n型半導体で電流を運ぶ主な担い手（キャリア）はどれか。`, opts: ["陽子", "電子", "正孔", "イオン"], ans: 1, exp: raw`n型半導体は電子が余分にある半導体で、電子がキャリアです。p型半導体では正孔（ホール）がキャリアになります。` },
        { q: raw`太陽電池（ソーラーパネル）が発電する仕組みはどれか。`, opts: ["熱でタービンを回す", "光のエネルギーで電子と正孔を生み出し、電流として取り出す", "化学反応で電気を作る", "磁石を回して誘導する"], ans: 1, exp: raw`光子が半導体に吸収されると電子と正孔のペアが生まれ、pn接合の電場で分けられることで電流が流れます。光電効果の仲間です。` },
        { q: raw`交流を直流に変換するはたらきを何というか。`, opts: ["増幅", "整流", "変調", "共振"], ans: 1, exp: raw`ダイオードの一方向性を利用して、交流の片方向だけを取り出す（または向きをそろえる）操作を整流といいます。ACアダプターの中で行われています。` },
        { q: raw`トランジスタのはたらきとして正しいものはどれか。`, opts: ["電気を蓄える", "小さい電流（電圧）で大きい電流を制御する（増幅・スイッチ）", "交流を直流に変える", "光を電気に変える"], ans: 1, exp: raw`トランジスタは、ベース（ゲート）への小さな信号で大きな電流の流れを制御でき、増幅器やデジタル回路のスイッチとして使われます。コンピュータの基本部品です。` },
        { q: raw`半導体の主材料として最も広く使われている元素はどれか。`, opts: ["鉄", "シリコン（ケイ素）", "銅", "炭素"], ans: 1, exp: raw`シリコンは砂や岩石に多く含まれる元素で、純度を高めた結晶に微量の不純物を加えることで p型・n型を作り分けます。` },
        { q: raw`温度が上がると抵抗が小さくなる素子（サーミスタ）は、どのような機器に使われるか。`, opts: ["温度センサー", "スピーカー", "モーター", "アンテナ"], ans: 0, exp: raw`サーミスタは温度変化で抵抗が大きく変わるため、エアコンや冷蔵庫、体温計などの温度センサーとして使われます。` },
        { q: raw`IC（集積回路）とは何か。`, opts: ["大きなコンデンサー", "小さな半導体のチップ上に多数のトランジスタなどを集積した部品", "高性能な電池", "光ファイバーの一種"], ans: 1, exp: raw`ICは、1枚の小さなシリコンチップの上に、トランジスタや抵抗などをまとめて作り込んだ部品です。現代の電子機器の頭脳です。` },
        { q: raw`ダイオードに逆方向の電圧をかけるとどうなるか。`, opts: ["大電流が流れる", "電流はほとんど流れない", "発光する", "壊れて爆発する"], ans: 1, exp: raw`逆方向では接合部に電流を妨げる層が広がり、電流はほとんど流れません（耐電圧を超えると破壊されるので注意が必要です）。` }
      ]
    },
    {
      id: "st10", num: 14, title: "量子と原子核", sub: "光電効果・半減期・E=mc²", icon: "⚛️", color: "#be123c",
      questions: [
        { q: raw`金属に光を当てると電子が飛び出す現象を何というか。`, opts: ["光電効果", "電磁誘導", "ドップラー効果", "共鳴"], ans: 0, exp: raw`光が光子（エネルギー $h\nu$）として電子を弾き出す「光電効果」です。` },
        { q: raw`半減期 5 年の放射性物質が、10 年後に残っている割合は元の何倍か。`, opts: ["1/2 倍", "1/4 倍", "1/8 倍", "0 倍"], ans: 1, exp: raw`10年は半減期2回分なので $\left(\frac{1}{2}\right)^2 = \frac{1}{4}$ 倍になります。` },
        { q: raw`太陽が莫大なエネルギーを出し続けている核反応はどれか。`, opts: ["核融合", "化学燃焼", "電気分解", "断熱膨張"], ans: 0, exp: raw`軽い水素原子核同士が結びつく「核融合」により質量欠損分のエネルギーが解放されます。` }
      ]
    },
    {
      id: "st10b", num: 18, title: "原子の構造と放射線", sub: "ボーア模型・スペクトル・放射線", icon: "☢️", color: "#e11d48",
      questions: [
        { q: raw`ボーアの原子模型の特徴として正しいものはどれか。`, opts: ["電子はとびとびの決まった軌道（エネルギー準位）だけを取る", "電子は原子全体に雲のように一様に広がるだけ", "電子は原子核の中にある", "電子の軌道は連続的に変わる"], ans: 0, exp: raw`ボーアは、電子は特定のエネルギー準位の軌道だけを取るという仮説を立て、水素のスペクトルを見事に説明しました。` },
        { q: raw`水素原子の出す光が「線スペクトル」（決まった波長だけの光）になるのはなぜか。`, opts: ["電子のエネルギー準位がとびとびだから", "水素が軽いから", "光の速さが一定だから", "原子が小さいから"], ans: 0, exp: raw`電子が準位間を移るとき、その差のエネルギーを持つ光子だけが放出されるため、波長が決まった線状のスペクトルになります。` },
        { q: raw`原子が最も安定な、電子が最低のエネルギー準位にある状態を何というか。`, opts: ["励起状態", "基底状態", "イオン状態", "プラズマ状態"], ans: 1, exp: raw`最低準位にある状態が基底状態です。エネルギーを得て上の準位に移った状態が励起状態で、不安定なため光を放出して戻ろうとします。` },
        { q: raw`電子が上の準位から下の準位へ移るとき、原子はどうするか。`, opts: ["光を吸収する", "準位の差に等しいエネルギーの光子を放出する", "熱を吸収する", "電子を放出する"], ans: 1, exp: raw`エネルギー差 $\Delta E = h\nu$ の光子が1個放出されます。蛍光灯やLEDの発光もこの仕組みを利用しています。` },
        { q: raw`α線・β線・γ線の中で、透過力（物質を通り抜ける力）が最も大きいものはどれか。`, opts: ["α線", "β線", "γ線", "すべて同じ"], ans: 2, exp: raw`α線は紙1枚、β線はアルミ板で止まりますが、γ線は電荷をもたない電磁波で透過力が大きく、鉛や厚いコンクリートで遮ります。` },
        { q: raw`β線の正体はどれか。`, opts: ["ヘリウム原子核", "高速の電子", "電磁波", "中性子"], ans: 1, exp: raw`β線は原子核から飛び出す高速の電子です。α線はヘリウム原子核、γ線は高エネルギーの電磁波です。` },
        { q: raw`放射性物質が放射線を出す能力（放射能）の強さを表す単位はどれか。`, opts: ["Sv（シーベルト）", "Bq（ベクレル）", "Gy（グレイ）", "Pa（パスカル）"], ans: 1, exp: raw`Bq は1秒間に崩壊する原子核の数を表します。Sv は人体への影響の度合いを表す単位、Gy は吸収線量の単位です。` },
        { q: raw`半減期が2年の放射性物質 $800\,\mathrm{g}$ がある。6年後に残っている量は何 $\mathrm{g}$ か。`, opts: ["200 g", "100 g", "400 g", "50 g"], ans: 1, exp: raw`6年は半減期3回分なので、$800 \times (\frac{1}{2})^3 = 800 / 8 = 100\,\mathrm{g}$ です。` },
        { q: raw`原子核が結合するときに質量の一部が失われ（質量欠損）、エネルギーに変わる。この関係を表す式はどれか。`, opts: ["E = hν", "E = mc²", "E = (1/2)mv²", "E = mgh"], ans: 1, exp: raw`アインシュタインの $E = mc^2$ です。わずかな質量でも、光速の2乗が掛かるため莫大なエネルギーになります。核融合・核分裂のエネルギー源です。` },
        { q: raw`医療で使われるX線の正体はどれか。`, opts: ["電子の流れ", "波長の短い電磁波", "ヘリウム原子核", "超音波"], ans: 1, exp: raw`X線は紫外線より波長の短い電磁波です。物質によって吸収され方が違うため、レントゲン撮影で骨などを写すことができます。` }
      ]
    },
    {
      id: "ch1", num: 31, title: "力学チャレンジ①", sub: "難問・等加速度と放物運動", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`初速度 $30\,\mathrm{m/s}$ で走る車が $-5.0\,\mathrm{m/s^2}$ の加速度で減速した。止まるまでに進む距離は何 $\mathrm{m}$ か。`, opts: ["60 m", "90 m", "150 m", "300 m"], ans: 1, exp: raw`$v^2 - v_0^2 = 2ax$ より $0 - 30^2 = 2 \times (-5.0) x$ なので $x = 90\,\mathrm{m}$ です。` },
        { q: raw`初速度 $20\,\mathrm{m/s}$、角度 $60^\circ$ で斜方投射した。最高点の高さはおよそ何 $\mathrm{m}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["10 m", "15 m", "20 m", "31 m"], ans: 1, exp: raw`鉛直成分は $20 \sin 60^\circ \approx 17.3\,\mathrm{m/s}$。$h = \frac{v_y^2}{2g} = \frac{17.3^2}{2 \times 9.8} \approx 15\,\mathrm{m}$ です。` },
        { q: raw`高さ $45\,\mathrm{m}$ の建物から小球を自由落下させた。地面に達する直前の速さはおよそ何 $\mathrm{m/s}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["21 m/s", "30 m/s", "44 m/s", "88 m/s"], ans: 1, exp: raw`$v = \sqrt{2gh} = \sqrt{2 \times 9.8 \times 45} = \sqrt{882} \approx 30\,\mathrm{m/s}$ です。` },
        { q: raw`速さ $20\,\mathrm{m/s}$ の車Aが、同じ向きに速さ $15\,\mathrm{m/s}$ で走る車Bの $100\,\mathrm{m}$ 後方にいる。AがBに追いつくのは何秒後か。`, opts: ["5秒後", "10秒後", "20秒後", "追いつかない"], ans: 2, exp: raw`相対速度は $20 - 15 = 5\,\mathrm{m/s}$ なので、$100 / 5 = 20$ 秒後です。` },
        { q: raw`上向きに $2.0\,\mathrm{m/s^2}$ で加速するエレベーターの中で、質量 $50\,\mathrm{kg}$ の人が体重計に乗った。体重計の示す力はおよそ何 $\mathrm{N}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["390 N", "490 N", "590 N", "690 N"], ans: 2, exp: raw`見かけの重力は $m(g + a) = 50 \times (9.8 + 2.0) = 590\,\mathrm{N}$ です。下向きに加速すると逆に軽くなります。` },
        { q: raw`$v$-$t$ グラフ（速度と時間のグラフ）で、グラフと時間軸に囲まれた面積が表すものはどれか。`, opts: ["加速度", "移動距離（変位）", "力", "仕事"], ans: 1, exp: raw`速さ × 時間 ＝ 距離なので、$v$-$t$ グラフの面積が移動距離を表します。傾きは加速度です。` },
        { q: raw`小球を初速度 $10\,\mathrm{m/s}$ で真下に投げ下ろした。3.0秒後の速さは何 $\mathrm{m/s}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["29 m/s", "39 m/s", "49 m/s", "20 m/s"], ans: 1, exp: raw`$v = v_0 + gt = 10 + 9.8 \times 3.0 = 39.4 \approx 39\,\mathrm{m/s}$ です。` },
        { q: raw`高さ $45\,\mathrm{m}$ の崖から、初速度 $10\,\mathrm{m/s}$ で水平に投げた小球の水平到達距離は何 $\mathrm{m}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["15 m", "30 m", "45 m", "90 m"], ans: 1, exp: raw`落下時間は $45 = \frac{1}{2} \times 9.8 t^2$ より $t \approx 3.0$ 秒。水平距離は $10 \times 3.0 = 30\,\mathrm{m}$ です。` },
        { q: raw`等加速度運動の公式 $x = v_0 t + \frac{1}{2}at^2$ が使えない運動はどれか。`, opts: ["自由落下", "斜面を滑る運動（なめらか）", "空気抵抗を受けて落下する運動", "一定の力で引かれる運動"], ans: 2, exp: raw`空気抵抗は速さによって変わるため加速度が一定にならず、等加速度運動の公式は使えません。やがて加速度が0に近づき、一定の速さ（終端速度）で落ちるようになります。` },
        { q: raw`真上に投げ上げた小球が、投げた位置に戻ってくるまでの時間は、最高点に達するまでの時間の何倍か。`, opts: ["1倍", "2倍", "3倍", "4倍"], ans: 1, exp: raw`空気抵抗がなければ上昇と下降は対称なので、往路と復路の時間は等しく、合計は最高点までの時間の2倍です。` }
      ]
    },
    {
      id: "ch2", num: 32, title: "力学チャレンジ②", sub: "難問・運動方程式と摩擦", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`なめらかな水平面上で、質量 $2.0\,\mathrm{kg}$ の物体Aと $3.0\,\mathrm{kg}$ の物体Bを糸でつなぎ、Aを $10\,\mathrm{N}$ の力で引いた。糸の張力は何 $\mathrm{N}$ か。`, opts: ["4.0 N", "6.0 N", "10 N", "2.0 N"], ans: 1, exp: raw`全体の加速度は $a = 10 / (2.0 + 3.0) = 2.0\,\mathrm{m/s^2}$。Bを引く力は張力だけなので $T = 3.0 \times 2.0 = 6.0\,\mathrm{N}$ です。` },
        { q: raw`傾角 $30^\circ$ のあらい斜面に物体を置いた。静止摩擦係数が $0.60$ のとき、物体はどうなるか。$\tan 30^\circ \approx 0.58$ とする。`, opts: ["滑り出す", "静止したまま", "斜面を上る", "浮き上がる"], ans: 1, exp: raw`滑り出す条件は $\tan\theta > \mu$ です。$0.58 < 0.60$ なので、最大静止摩擦力が重力の斜面成分を上回り、静止したままになります。` },
        { q: raw`動摩擦係数 $0.50$ の水平面上を、初速度 $10\,\mathrm{m/s}$ で物体が滑り出した。止まるまでに滑る距離はおよそ何 $\mathrm{m}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["5 m", "10 m", "20 m", "50 m"], ans: 1, exp: raw`減速度は $a = \mu' g = 0.50 \times 9.8 = 4.9\,\mathrm{m/s^2}$。距離は $x = \frac{v^2}{2a} = \frac{100}{9.8} \approx 10\,\mathrm{m}$ です。` },
        { q: raw`垂直抗力 $50\,\mathrm{N}$、静止摩擦係数 $0.40$ の面で、物体を $15\,\mathrm{N}$ の力で引いた。物体の状態と摩擦力はどれか。`, opts: ["動き出し、摩擦力は15 N", "静止したままで、摩擦力は15 N", "静止したままで、摩擦力は20 N", "動き出し、摩擦力は20 N"], ans: 1, exp: raw`最大静止摩擦力は $0.40 \times 50 = 20\,\mathrm{N}$ で、引く力 $15\,\mathrm{N}$ より大きいので動きません。このとき静止摩擦力は引く力とつりあって $15\,\mathrm{N}$ です（最大値とは限りません）。` },
        { q: raw`下向きに $2.0\,\mathrm{m/s^2}$ で加速するエレベーターの中で、質量 $50\,\mathrm{kg}$ の人が受ける垂直抗力はおよそ何 $\mathrm{N}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["390 N", "490 N", "590 N", "100 N"], ans: 0, exp: raw`運動方程式 $m(g - a) = 50 \times (9.8 - 2.0) = 390\,\mathrm{N}$ です。自由落下中（$a = g$）では垂直抗力が0になり、無重力状態になります。` },
        { q: raw`ばね定数 $k$ のばね2本を直列につないだときの全体のばね定数はどれか。`, opts: ["2k", "k", "k/2", "k/4"], ans: 2, exp: raw`直列では同じ力で伸びが2倍になるため、全体のばね定数は半分の $k/2$ です。並列では $2k$ になります。` },
        { q: raw`雨滴が空から落ちてくるとき、やがて一定の速さで落ちるようになるのはなぜか。`, opts: ["重力が消えるから", "空気抵抗が大きくなって重力とつりあうから", "質量が減るから", "浮力が重力より大きくなるから"], ans: 1, exp: raw`空気抵抗は速さとともに大きくなるため、重力とつりあった時点で加速度が0になり、一定の速さ（終端速度）で落ち続けます。` },
        { q: raw`傾角 $30^\circ$ のあらい斜面を物体が一定の速さで滑り落ちている。動摩擦係数はおよそいくらか。`, opts: ["0.29", "0.50", "0.58", "1.0"], ans: 2, exp: raw`等速なので斜面方向の力はつりあい、$mg \sin\theta = \mu' mg \cos\theta$ より $\mu' = \tan 30^\circ \approx 0.58$ です。` },
        { q: raw`円錐振り子（糸で吊るしたおもりが水平面内で円運動する装置）で、おもりの回転が速くなるほど糸の傾きはどうなるか。`, opts: ["小さくなる", "大きくなる", "変わらない", "垂直になる"], ans: 1, exp: raw`必要な向心力が大きくなる分、張力の水平成分を増やす必要があり、糸はより水平に近づいて傾きが大きくなります。` },
        { q: raw`物体に3つの力がつりあってはたらいている。1つの力を取り除くと、物体はどうなるか。`, opts: ["静止し続ける", "残りの2力の合力の向きに加速する", "取り除いた力と同じ向きに加速する", "回転し始める"], ans: 1, exp: raw`もとの合力が0だったので、1力を除いた残りの合力は、除いた力と大きさが等しく反対向き、つまり残り2力の合力そのものです。その向きに加速します。` }
      ]
    },
    {
      id: "ch3", num: 33, title: "力学チャレンジ③", sub: "難問・エネルギーと運動量", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`反発係数 $e = 0.50$ のボールが床に落ちて跳ね返った。跳ね返った後の最高点の高さは、落とした高さの何倍か。`, opts: ["0.50倍", "0.25倍", "0.71倍", "1.0倍"], ans: 1, exp: raw`跳ね返りの速さは落下時の $e$ 倍、高さは速さの2乗に比例するので $e^2 = 0.25$ 倍です。` },
        { q: raw`同じ質量の2つの小球が正面衝突した。一方が速さ $v$ で進み、他方が静止していた完全弾性衝突の後はどうなるか。`, opts: ["両方とも v/2 で進む", "進んでいた方が止まり、静止していた方が v で進む", "両方とも止まる", "両方とも v で進む"], ans: 1, exp: raw`質量が等しい完全弾性衝突では、速度がそのまま交換されます。ビリヤードの止まった球に当てるショットが典型例です。` },
        { q: raw`ばね定数 $100\,\mathrm{N/m}$ のばねを $0.20\,\mathrm{m}$ 縮め、質量 $0.50\,\mathrm{kg}$ の小球を押し出した。ばねから離れる瞬間の小球の速さはおよそ何 $\mathrm{m/s}$ か。`, opts: ["1.4 m/s", "2.0 m/s", "2.8 m/s", "4.0 m/s"], ans: 2, exp: raw`弾性エネルギー $\frac{1}{2} \times 100 \times 0.20^2 = 2.0\,\mathrm{J}$ が運動エネルギーになるので、$v = \sqrt{\frac{2 \times 2.0}{0.50}} = \sqrt{8} \approx 2.8\,\mathrm{m/s}$ です。` },
        { q: raw`半径 $r$ のループ（円形レール）の頂点を、レールから離れずに通過するための最下点での最小の速さの条件に関わる量はどれか。`, opts: ["頂点で重力だけで向心力をまかなえること", "頂点で速さが0でないこと", "質量が大きいこと", "摩擦がないこと"], ans: 0, exp: raw`頂点で垂直抗力が0になる限界では、重力 $mg$ がそのまま向心力 $m\frac{v^2}{r}$ になるため、頂点の速さの下限は $\sqrt{gr}$ です。` },
        { q: raw`質量 $0.15\,\mathrm{kg}$ のボールが速さ $20\,\mathrm{m/s}$ で壁に当たり、$15\,\mathrm{m/s}$ で跳ね返った。ボールが受けた力積の大きさは何 $\mathrm{N\cdot s}$ か。`, opts: ["0.75 N·s", "3.0 N·s", "5.3 N·s", "7.5 N·s"], ans: 2, exp: raw`向きを考えると運動量の変化は $0.15 \times (15 - (-20)) = 0.15 \times 35 = 5.25 \approx 5.3\,\mathrm{N\cdot s}$ です。跳ね返る場合は変化が大きくなります。` },
        { q: raw`摩擦力のような非保存力が仕事をしたとき、力学的エネルギーの変化はどう表されるか。`, opts: ["力学的エネルギーの変化 ＝ 非保存力のした仕事", "力学的エネルギーは常に保存される", "力学的エネルギーの変化 ＝ 保存力のした仕事", "変化は質量だけで決まる"], ans: 0, exp: raw`保存力（重力・弾性力）だけなら力学的エネルギーは保存されますが、摩擦などの非保存力が仕事をすると、その分だけ力学的エネルギーが増減します。` },
        { q: raw`ロケットが宇宙空間で加速できる理由として正しいものはどれか。`, opts: ["空気を押しているから", "ガスを後方に噴射した反作用（運動量保存）で前進するから", "重力が弱いから", "磁場を利用しているから"], ans: 1, exp: raw`ガスを後方へ押し出すと、その反作用でロケットは前方への力を受けます。全体の運動量が保存されることの表れで、空気は必要ありません。` },
        { q: raw`2次元（平面内）の衝突で運動量保存則を考えるとき、正しいものはどれか。`, opts: ["運動量の大きさだけが保存される", "x成分・y成分それぞれについて運動量が保存される", "運動エネルギーが必ず保存される", "衝突後は必ず一体になる"], ans: 1, exp: raw`運動量はベクトル量なので、成分ごとに保存されます。斜めの衝突の問題は、x・y両方向の式を立てて解きます。` },
        { q: raw`振り子式の弾道測定器（木片に弾丸を撃ち込み、振れ幅から速さを求める装置）で使う保存則の組み合わせはどれか。`, opts: ["衝突では力学的エネルギー保存、振れでは運動量保存", "衝突では運動量保存、振れ上がりでは力学的エネルギー保存", "両方とも運動エネルギー保存", "両方とも力積のみ"], ans: 1, exp: raw`撃ち込む瞬間は完全非弾性衝突なので運動エネルギーは保存されませんが、運動量は保存されます。その後の振れ上がりでは力学的エネルギー保存が使えます。` },
        { q: raw`斜面を使って重い荷物を持ち上げる「仕事の原理」として正しいものはどれか。`, opts: ["斜面を使うと必要な仕事が減る", "力は小さくなるが距離が長くなり、仕事は（理想的には）変わらない", "斜面では重力が弱くなる", "仕事も力も両方小さくなる"], ans: 1, exp: raw`道具を使っても、摩擦がなければ必要な仕事は変わりません（仕事の原理）。斜面やてこは「力の節約」と「距離の延長」の交換です。` }
      ]
    },
    {
      id: "ch4", num: 34, title: "力学チャレンジ④", sub: "難問・円運動と単振動", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`振幅 $0.10\,\mathrm{m}$、角振動数 $20\,\mathrm{rad/s}$ の単振動がある。速さの最大値は何 $\mathrm{m/s}$ か。`, opts: ["0.50 m/s", "2.0 m/s", "20 m/s", "200 m/s"], ans: 1, exp: raw`単振動の速さの最大値は $A\omega = 0.10 \times 20 = 2.0\,\mathrm{m/s}$ です。加速度の最大値は $A\omega^2 = 40\,\mathrm{m/s^2}$ になります。` },
        { q: raw`ばね振り子のおもりの質量を2倍にし、ばね定数も2倍にした。周期はどうなるか。`, opts: ["2倍", "1/2倍", "変わらない", "4倍"], ans: 2, exp: raw`$T = 2\pi\sqrt{m/k}$ で、$m$ と $k$ が両方2倍になると比 $m/k$ は変わらないため、周期は変わりません。` },
        { q: raw`軌道半径がもとの4倍になった惑星の公転周期は、もとの何倍か（ケプラーの第3法則）。`, opts: ["4倍", "8倍", "16倍", "64倍"], ans: 1, exp: raw`$T \propto a^{3/2}$ なので $4^{3/2} = 8$ 倍です。` },
        { q: raw`電車がカーブを曲がるとき、乗客が外側に倒れそうに感じる「遠心力」の正体はどれか。`, opts: ["実際に外向きにはたらく力", "電車と一緒に運動する立場で現れる見かけの力（慣性力）", "空気の抵抗", "重力の成分"], ans: 1, exp: raw`遠心力は、回転している観測者から見たときに現れる慣性力です。外から見れば、乗客は慣性でまっすぐ進もうとし、電車だけが内向きに曲がっています。` },
        { q: raw`単振動で、変位が振幅の半分（$x = A/2$）のとき、加速度の大きさは最大値の何倍か。`, opts: ["1/4倍", "1/2倍", "√3/2倍", "1倍"], ans: 1, exp: raw`加速度は $a = -\omega^2 x$ と変位に比例するので、変位が半分なら加速度も半分です。` },
        { q: raw`U字管に液体を入れ、片側を押して離すと液面が上下に振動する。この振動が単振動になる理由に近い考え方はどれか。`, opts: ["復元力が変位に比例するから", "摩擦がないから", "液体が圧縮されるから", "重力が変化するから"], ans: 0, exp: raw`液面の差に比例した復元力（重力による圧力差）がはたらくため、単振動になります。単振動の条件は「変位に比例する復元力」です。` },
        { q: raw`地球の自転のため、赤道上では地表の重力加速度がわずかに小さくなる。その主な理由はどれか。`, opts: ["赤道は太陽に近いから", "自転の円運動に必要な向心力の分、重力が見かけ上減るから", "赤道は標高が高いから", "月の引力が強いから"], ans: 1, exp: raw`地表の物体は地球と一緒に円運動しており、万有引力の一部が向心力に使われる分、体重計で測る重力（見かけの重力）が小さくなります。` },
        { q: raw`バンク角（傾斜）をつけたカーブでは、摩擦がなくても曲がれる速さが存在する。それを決めるのはどれか。`, opts: ["車の質量", "バンク角とカーブの半径と重力加速度", "タイヤの太さ", "車の色"], ans: 1, exp: raw`垂直抗力の水平成分が向心力になる条件から、速さは $v = \sqrt{gr\tan\theta}$ と決まり、質量にはよりません。` },
        { q: raw`人工衛星の軌道エネルギーが負の値になることは、何を意味するか。`, opts: ["衛星が地球に束縛されて周回していること", "衛星の速さが負であること", "エネルギーが失われたこと", "計算が間違っていること"], ans: 0, exp: raw`位置エネルギーの基準を無限遠に取ると、地球の重力に束縛された衛星の全エネルギーは負になります。正になると地球を離れてしまいます。` },
        { q: raw`振り子の等時性（周期が振れ幅によらない性質）が成り立つのはどのような場合か。`, opts: ["振れ幅が大きいとき", "振れ幅が小さいとき", "おもりが重いとき", "糸が短いとき"], ans: 1, exp: raw`復元力が変位に比例する近似（$\sin\theta \approx \theta$）が成り立つのは振れ幅が小さいときだけです。大きく振れると周期はわずかに長くなります。` }
      ]
    },
    {
      id: "ch5", num: 35, title: "熱チャレンジ", sub: "難問・気体と熱力学", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`$80^\circ\mathrm{C}$ の水 $100\,\mathrm{g}$ と $20^\circ\mathrm{C}$ の水 $200\,\mathrm{g}$ を混ぜた。全体の温度は何 $^\circ\mathrm{C}$ になるか（熱の出入りは無視）。`, opts: ["30 ℃", "40 ℃", "50 ℃", "60 ℃"], ans: 1, exp: raw`熱量の保存より、温度は質量で重み付けした平均になります。$(100 \times 80 + 200 \times 20) / 300 = 40^\circ\mathrm{C}$ です。` },
        { q: raw`高温熱源 $600\,\mathrm{K}$、低温熱源 $300\,\mathrm{K}$ の間で働く理想的な熱機関（カルノー機関）の熱効率はいくらか。`, opts: ["25 %", "50 %", "75 %", "100 %"], ans: 1, exp: raw`カルノー効率は $1 - \frac{T_L}{T_H} = 1 - \frac{300}{600} = 0.50$、つまり $50\,\%$ です。実際の熱機関はこれより低くなります。` },
        { q: raw`理想気体の内部エネルギーは、何だけで決まるか。`, opts: ["圧力と体積", "絶対温度", "体積だけ", "圧力だけ"], ans: 1, exp: raw`理想気体では分子間力がないため、内部エネルギーは温度（分子の平均運動エネルギー）だけで決まります。` },
        { q: raw`断熱変化で気体を圧縮したとき、温度が上がる理由はどれか。`, opts: ["外部から熱が入るから", "外部から仕事をされ、その分が内部エネルギーになるから", "分子の数が増えるから", "圧力が下がるから"], ans: 1, exp: raw`断熱なので熱の出入りは0ですが、仕事をされた分だけ内部エネルギーが増え、温度が上がります（熱力学第1法則）。` },
        { q: raw`$p$-$V$ グラフで、状態変化を表す曲線の下の面積が表すものはどれか。`, opts: ["内部エネルギー", "気体がした仕事（またはされた仕事）", "温度変化", "物質量"], ans: 1, exp: raw`仕事は $W = \int p\,dV$ と表され、グラフ上では曲線と体積軸に囲まれた面積に等しくなります。サイクルでは囲まれた面積が正味の仕事です。` },
        { q: raw`熱力学第2法則の表し方として正しいものはどれか。`, opts: ["熱は自然には高温の物体から低温の物体へ移る", "エネルギーは保存される", "熱は仕事に100%変えられる", "気体の圧力は体積に反比例する"], ans: 0, exp: raw`第2法則は変化の「向き」を決める法則です。第1法則（エネルギー保存）だけでは、熱が低温から高温へ自然に移ることも禁止できません。` },
        { q: raw`温度の違う2つの物体を接触させたとき、やがて同じ温度になる現象を何というか。`, opts: ["断熱変化", "熱平衡", "共鳴", "相転移"], ans: 1, exp: raw`熱の移動が止まって温度が等しくなった状態が熱平衡です。温度計で温度が測れるのは、温度計と物体が熱平衡になるためです。` },
        { q: raw`同じ熱量を加えたとき、水より砂の方が温度が上がりやすいのはなぜか。`, opts: ["砂の方が軽いから", "砂の比熱が水より小さいから", "砂は熱を反射するから", "水は蒸発するから"], ans: 1, exp: raw`比熱は「温まりにくさ」の指標です。水の比熱（約 $4.2\,\mathrm{J/(g\cdot K)}$）は物質の中でも特に大きく、海風・陸風の原因にもなっています。` },
        { q: raw`気体を等温膨張させたとき、気体が外部にした仕事はどこから来るか。`, opts: ["内部エネルギーから", "外部から吸収した熱から", "圧力から生まれる", "仕事はしていない"], ans: 1, exp: raw`等温では内部エネルギーが変わらないため、第1法則より、した仕事の分だけ熱を吸収しています（$W = Q$）。` },
        { q: raw`熱機関が1サイクルで高温熱源から $800\,\mathrm{J}$ を受け取り、低温熱源へ $560\,\mathrm{J}$ を捨てた。した仕事と熱効率はどれか。`, opts: ["仕事 240 J ・ 効率 30 %", "仕事 560 J ・ 効率 70 %", "仕事 800 J ・ 効率 100 %", "仕事 240 J ・ 効率 70 %"], ans: 0, exp: raw`仕事は $W = 800 - 560 = 240\,\mathrm{J}$、効率は $240 / 800 = 0.30$、つまり $30\,\%$ です。` }
      ]
    },
    {
      id: "ch6", num: 36, title: "波チャレンジ", sub: "難問・波と音", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`音源が速さ $10\,\mathrm{m/s}$ で観測者に向かって近づきながら、振動数 $500\,\mathrm{Hz}$ の音を出している。観測者に聞こえる振動数はおよそ何 $\mathrm{Hz}$ か。音速を $340\,\mathrm{m/s}$ とする。`, opts: ["485 Hz", "500 Hz", "515 Hz", "550 Hz"], ans: 2, exp: raw`ドップラー効果の式 $f' = f \frac{V}{V - v_s} = 500 \times \frac{340}{330} \approx 515\,\mathrm{Hz}$ です。` },
        { q: raw`長さ $0.85\,\mathrm{m}$ の閉管の基本振動数はおよそ何 $\mathrm{Hz}$ か。音速を $340\,\mathrm{m/s}$ とする。`, opts: ["100 Hz", "200 Hz", "300 Hz", "400 Hz"], ans: 0, exp: raw`閉管の基本振動では $\lambda = 4L = 3.4\,\mathrm{m}$ なので、$f = 340 / 3.4 = 100\,\mathrm{Hz}$ です。開管の場合（200 Hz）の半分になります。` },
        { q: raw`固定端反射と自由端反射で、反射波の位相（山と谷）はどうなるか。`, opts: ["固定端では反転し、自由端では反転しない", "どちらも反転する", "どちらも反転しない", "固定端では反転せず、自由端では反転する"], ans: 0, exp: raw`固定端では反射波の位相が逆転（山→谷）しますが、自由端ではそのまま反射します。この違いが定常波のでき方に影響します。` },
        { q: raw`音の大きさ（音の強さ）は、音波の何の2乗に比例するか。`, opts: ["振動数", "振幅", "波長", "速さ"], ans: 1, exp: raw`波のエネルギーは振幅の2乗に比例します。振幅が2倍になると音の強さは4倍になります（デシベルでは約6 dB増）。` },
        { q: raw`音波は縦波である。縦波の特徴として正しいものはどれか。`, opts: ["媒質が波の進行方向と垂直に振動する", "媒質が波の進行方向と同じ向きに振動し、密な部分と疎な部分が伝わる", "真空中でも伝わる", "偏光する"], ans: 1, exp: raw`音は空気の密度の変化（疎密）が伝わる縦波（疎密波）です。横波である光とは性質が異なり、真空中では伝わりません。` },
        { q: raw`2つの波が重なって弱め合うのは、どのような条件のときか。`, opts: ["位相がそろっているとき", "位相が半周期（波長の半分）ずれているとき", "振幅が違うとき", "振動数が違うとき"], ans: 1, exp: raw`山と谷が重なると打ち消し合います。経路差が半波長の奇数倍のときに弱め合いの干渉が起こります。` },
        { q: raw`水面の波が防波堤の切れ目を通過した後、堤の影の部分にも広がっていく現象はどれか。`, opts: ["反射", "屈折", "回折", "干渉"], ans: 2, exp: raw`回折です。切れ目の幅と波長が近いほど大きく回り込みます。波長の長い波ほど回折が顕著です。` },
        { q: raw`弦を伝わる横波の速さが $v = \sqrt{\frac{F}{\rho}}$（$F$：張力、$\rho$：線密度）で表されるとき、張力を4倍にし、線密度も4倍にすると速さはどうなるか。`, opts: ["4倍", "2倍", "変わらない", "1/2倍"], ans: 2, exp: raw`$v$ は $\sqrt{F/\rho}$ なので、両方4倍では比が変わらず、速さは変わりません。` },
        { q: raw`救急車が観測者を通り過ぎた瞬間、サイレンの音の高さはどう変化するか。`, opts: ["だんだん高くなる", "高い音から低い音へ急に下がる", "ずっと一定", "だんだん低くなるだけ"], ans: 1, exp: raw`近づく間は高い音、遠ざかる間は低い音が聞こえ、通過の瞬間に音の高さが切り替わります（ドップラー効果）。` },
        { q: raw`波の速さ・振動数・波長の関係 $v = f\lambda$ について、媒質が変わって速さが2倍になったとき、振動数と波長はどうなるか。`, opts: ["振動数も2倍になる", "振動数は変わらず波長が2倍になる", "波長は変わらず振動数が2倍になる", "どちらも半分になる"], ans: 1, exp: raw`振動数は波源で決まるため媒質が変わっても不変です。速さの変化は波長の変化として現れます。` }
      ]
    },
    {
      id: "ch7", num: 37, title: "光チャレンジ", sub: "難問・干渉とレンズ", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`ヤングの実験で、波長 $600\,\mathrm{nm}$ の光、スリット間隔 $0.50\,\mathrm{mm}$、スクリーンまでの距離 $1.0\,\mathrm{m}$ のとき、明線の間隔は何 $\mathrm{mm}$ か。`, opts: ["0.60 mm", "1.2 mm", "2.4 mm", "12 mm"], ans: 1, exp: raw`$\Delta x = \frac{\lambda L}{d} = \frac{600 \times 10^{-9} \times 1.0}{0.50 \times 10^{-3}} = 1.2 \times 10^{-3}\,\mathrm{m} = 1.2\,\mathrm{mm}$ です。` },
        { q: raw`水（屈折率 $1.33$）から空気へ光が出るとき、全反射が起こり始める臨界角はおよそ何度か。$\sin 49^\circ \approx 0.75$ とする。`, opts: ["30°", "41°", "49°", "60°"], ans: 2, exp: raw`臨界角は $\sin c = \frac{1}{1.33} \approx 0.75$ より約 $49^\circ$ です。これ以上の入射角では光は水中に全反射します。` },
        { q: raw`回折格子に白色光を当てると、色ごとに分かれて見えるのはなぜか。`, opts: ["波長によって明線のできる角度が違うから", "光の速さが色で違うから", "格子が色を吸収するから", "目が色を分けるから"], ans: 0, exp: raw`明線の条件 $d \sin\theta = m\lambda$ より、波長の長い赤ほど大きな角度に現れます。プリズムの分光とは別の仕組みでスペクトルが得られます。` },
        { q: raw`凸レンズで、物体を焦点の少し外側に置くと像はどうなるか。`, opts: ["レンズから遠くに、大きな倒立実像ができる", "レンズの近くに、小さな実像ができる", "正立虚像ができる", "像はできない"], ans: 0, exp: raw`物体が焦点に近いほど像は遠くに大きくできます。物体が焦点の内側に入ると、実像ではなく正立虚像（虫眼鏡の像）に切り替わります。` },
        { q: raw`プリズムを通した白色光が虹色に分かれる（分散）のはなぜか。`, opts: ["屈折率が波長によって違うから", "光がプリズムで吸収されるから", "プリズムが光を反射するから", "波長が途中で変わるから"], ans: 0, exp: raw`ガラスの屈折率は波長の短い紫ほど大きいため、色ごとに屈折の角度が変わって分かれます。虹ができるのも同じ原理です。` },
        { q: raw`偏光板を2枚重ね、1枚を回転させると透過光が暗くなったり明るくなったりする。これは光が何であることの証拠か。`, opts: ["縦波", "横波", "粒子だけ", "音波"], ans: 1, exp: raw`偏光は、振動方向が進行方向に垂直な横波にだけ起こる現象です。液晶ディスプレイや偏光サングラスに応用されています。` },
        { q: raw`真空中の光速がすべての観測者にとって一定であることは、どの理論の出発点になったか。`, opts: ["量子力学", "相対性理論", "熱力学", "電磁気学の完成"], ans: 1, exp: raw`アインシュタインは光速不変を原理として特殊相対性理論を築きました。速く動く観測者では時間の進み方が変わる、という結論につながります。` },
        { q: raw`薄膜の干渉で、膜の表面で反射する光と裏面で反射する光の位相の扱いで注意すべき点はどれか。`, opts: ["表面の反射では位相が反転する場合がある", "位相は常に変わらない", "裏面の反射だけで干渉する", "光路差は膜の厚さと無関係"], ans: 0, exp: raw`屈折率の小さい媒質から大きい媒質へ向かう面での反射では、位相が半波長分ずれます。シャボン玉の干渉条件を考えるときに必要です。` },
        { q: raw`レーザーポインターの光が、普通の電球の光より干渉実験に向いている理由はどれか。`, opts: ["明るいから", "単色性と可干渉性が高いから", "速いから", "熱いから"], ans: 1, exp: raw`レーザー光は波長がそろい、位相のそろった状態が長く続くため、干渉縞がはっきり観察できます。` },
        { q: raw`焦点距離 $10\,\mathrm{cm}$ の凸レンズで、物体を $15\,\mathrm{cm}$ の位置に置いた。像の位置と倍率はどれか。`, opts: ["30 cm ・ 2倍", "20 cm ・ 1.5倍", "30 cm ・ 0.5倍", "7.5 cm ・ 2倍"], ans: 0, exp: raw`$\frac{1}{15} + \frac{1}{b} = \frac{1}{10}$ より $\frac{1}{b} = \frac{1}{30}$、$b = 30\,\mathrm{cm}$。倍率は $\frac{30}{15} = 2$ 倍の倒立実像です。` }
      ]
    },
    {
      id: "ch8", num: 38, title: "電気チャレンジ①", sub: "難問・回路計算", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`$6\,\Omega$ と $3\,\Omega$ の抵抗を並列にしたものに、$4\,\Omega$ の抵抗を直列につないだ。全体の合成抵抗は何 $\Omega$ か。`, opts: ["5 Ω", "6 Ω", "9 Ω", "13 Ω"], ans: 1, exp: raw`並列部分は $\frac{6 \times 3}{6 + 3} = 2\,\Omega$。直列の $4\,\Omega$ と合わせて $2 + 4 = 6\,\Omega$ です。` },
        { q: raw`起電力 $3.0\,\mathrm{V}$、内部抵抗 $1.0\,\Omega$ の電池に、$5.0\,\Omega$ の抵抗をつないだ。回路の電流と電池の端子電圧はどれか。`, opts: ["電流 0.50 A ・ 端子電圧 2.5 V", "電流 0.60 A ・ 端子電圧 3.0 V", "電流 0.50 A ・ 端子電圧 3.0 V", "電流 3.0 A ・ 端子電圧 2.5 V"], ans: 0, exp: raw`電流は $I = \frac{3.0}{5.0 + 1.0} = 0.50\,\mathrm{A}$。端子電圧は内部抵抗での降下を引いて $3.0 - 0.50 \times 1.0 = 2.5\,\mathrm{V}$ です。` },
        { q: raw`$5\,\Omega$ の抵抗に $2.0\,\mathrm{A}$ の電流を60秒間流した。発生するジュール熱は何 $\mathrm{J}$ か。`, opts: ["600 J", "1200 J", "2400 J", "100 J"], ans: 1, exp: raw`$Q = I^2 R t = 2.0^2 \times 5 \times 60 = 1200\,\mathrm{J}$ です。` },
        { q: raw`上の回路（合成抵抗 $6\,\Omega$）に $12\,\mathrm{V}$ の電源をつないだ。全体を流れる電流は何 $\mathrm{A}$ か。`, opts: ["1.0 A", "2.0 A", "3.0 A", "6.0 A"], ans: 1, exp: raw`$I = V / R = 12 / 6 = 2.0\,\mathrm{A}$ です。この電流が直列部分を流れ、並列部分で抵抗の逆比に分かれます。` },
        { q: raw`キルヒホッフの第1法則（電流則）の内容はどれか。`, opts: ["回路の分岐点に流れ込む電流の和と、流れ出す電流の和は等しい", "閉回路の電圧の和は0になる", "電流は抵抗に反比例する", "電流は常に一定である"], ans: 0, exp: raw`分岐点で電荷がたまったり消えたりしないこと（電荷保存）を表す法則です。第2法則は、閉回路を一周したときの電圧の上げ下げの和が0になるという法則です。` },
        { q: raw`家庭の $100\,\mathrm{V}$ 回路で、合計 $1500\,\mathrm{W}$ の家電を同時に使うと流れる電流は何 $\mathrm{A}$ か。`, opts: ["1.5 A", "15 A", "150 A", "0.15 A"], ans: 1, exp: raw`$I = P / V = 1500 / 100 = 15\,\mathrm{A}$ です。一般的なブレーカーの容量（20 A など）に近づくと、同時使用で落ちることがあります。` },
        { q: raw`電圧計を回路に並列につなぐとき、電圧計自身の抵抗が大きい方がよいのはなぜか。`, opts: ["電圧計に電流が流れ込むと、測りたい部分の電圧が変わってしまうから", "小さいと壊れるから", "表示が見やすいから", "電流計と間違えないため"], ans: 0, exp: raw`電圧計の抵抗が小さいと、そこへ電流が逃げて回路の状態が変わってしまいます。理想的な電圧計の抵抗は無限大、電流計の抵抗は0です。` },
        { q: raw`ホイートストンブリッジが平衡する（検流計に電流が流れない）条件は何を利用したものか。`, opts: ["抵抗の比が等しくなること", "電圧が0になること", "電流が最大になること", "電力が等しくなること"], ans: 0, exp: raw`4つの抵抗の比が釣り合うと中央の検流計に電流が流れません。未知の抵抗を精密に測る方法として使われます。` },
        { q: raw`電流計に分流器（並列の小さい抵抗）をつなぐ目的はどれか。`, opts: ["測れる電圧の範囲を広げる", "測れる電流の範囲を広げる", "電流計の抵抗を大きくする", "精度を上げる"], ans: 1, exp: raw`電流の一部を分流器に逃がすことで、電流計本体の上限を超える大きな電流も測れるようになります。電圧計の範囲を広げるのは直列の倍率器です。` },
        { q: raw`抵抗とコンデンサーの直流回路で、スイッチを入れた直後と十分時間がたった後で、コンデンサーの状態はどうなるか。`, opts: ["直後は電流が流れ、十分後は充電が終わって電流は止まる", "常に電流が流れる", "直後は止まっていて、後で流れ出す", "常に止まっている"], ans: 0, exp: raw`充電が進むにつれてコンデンサーの電圧が電源に近づき、電流はだんだん小さくなって、最終的に止まります（過渡現象）。` }
      ]
    },
    {
      id: "ch9", num: 39, title: "電気チャレンジ②", sub: "難問・電場とコンデンサー", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`点電荷が作る電場の強さは距離の2乗に反比例する。距離を半分にすると電場の強さは何倍になるか。`, opts: ["2倍", "4倍", "1/2倍", "変わらない"], ans: 1, exp: raw`$E = k\frac{Q}{r^2}$ より、$r$ が半分になると $E$ は $\frac{1}{(1/2)^2} = 4$ 倍です。電位（$r$ に反比例）との違いに注意しましょう。` },
        { q: raw`電気容量 $2.0\,\mathrm{\mu F}$ と $3.0\,\mathrm{\mu F}$ のコンデンサーを直列につないだ。合成容量は何 $\mathrm{\mu F}$ か。`, opts: ["1.2 μF", "2.5 μF", "5.0 μF", "6.0 μF"], ans: 0, exp: raw`$\frac{1}{C} = \frac{1}{2.0} + \frac{1}{3.0} = \frac{5}{6}$ より $C = 1.2\,\mathrm{\mu F}$ です。直列ではもとの容量より小さくなります。` },
        { q: raw`電気容量 $5.0\,\mathrm{\mu F}$ のコンデンサーを $200\,\mathrm{V}$ で充電した。蓄えられるエネルギーは何 $\mathrm{J}$ か。`, opts: ["0.010 J", "0.10 J", "1.0 J", "10 J"], ans: 1, exp: raw`$U = \frac{1}{2}CV^2 = \frac{1}{2} \times 5.0 \times 10^{-6} \times 200^2 = 0.10\,\mathrm{J}$ です。` },
        { q: raw`一様な電場の中に置かれた電子は、放物運動のような軌道を描くことがある。それはなぜか。`, opts: ["電場から受ける力が一定だから", "重力が消えるから", "磁場がはたらくから", "空気抵抗のため"], ans: 0, exp: raw`一様電場では電子が受ける力 $F = eE$ が一定なので、電場に垂直な初速度があると、重力中の放物運動と同じ形の軌道になります。ブラウン管の偏向がこの原理です。` },
        { q: raw`ミリカンの油滴実験で分かったことはどれか。`, opts: ["電子の質量", "電気素量（電荷の最小単位）の存在", "陽子の中性子の数", "光の速さ"], ans: 1, exp: raw`油滴の帯電量が常にある値の整数倍になることから、電荷には最小単位 $e$ があることが分かりました。` },
        { q: raw`中空の金属球の内部に電荷を持ち込むと、外側の電場はどうなるか（静電遮蔽）。`, opts: ["内部の電荷の影響は外に出ない", "外側に強い電場ができる", "金属が帯電して消える", "重力が遮断される"], ans: 0, exp: raw`導体の内部は電場が0で、電荷は表面に分布します。そのため金属で囲まれた空間は外部の電場から守られます（ファラデーケージ）。車が落雷しても中が比較的安全なのはこのためです。` },
        { q: raw`電位が等しい面（等電位面）の上を電荷が移動するとき、電場がする仕事はいくらか。`, opts: ["最大になる", "0", "電荷に比例して負になる", "距離に比例する"], ans: 1, exp: raw`仕事は電位差 × 電荷で決まるため、電位差0の移動では仕事は0です。等電位面は電気力線と直交します。` },
        { q: raw`2つの等しい正の点電荷を結ぶ線分の中点では、電場と電位はどうなっているか。`, opts: ["電場も電位も0", "電場は0、電位は0でない", "電場は最大、電位は0", "どちらも最大"], ans: 1, exp: raw`中点では2つの電場が逆向きで打ち消し合い電場は0ですが、電位はスカラーなので足し合わされて0にはなりません。` },
        { q: raw`充電したコンデンサーの極板間隔を、電池を外したまま2倍に広げた。蓄えられるエネルギーはどうなるか。`, opts: ["半分になる", "変わらない", "2倍になる", "4倍になる"], ans: 2, exp: raw`電池を外すと $Q$ は一定です。間隔2倍で $C$ は半分になり、$U = \frac{Q^2}{2C}$ よりエネルギーは2倍になります。増えた分は、極板を引き離すのにした仕事です。` },
        { q: raw`電場の強さを表す単位として正しい組み合わせはどれか。`, opts: ["N/C または V/m", "J/C のみ", "A/m のみ", "W/V のみ"], ans: 0, exp: raw`電場は「単位電荷あたりの力」なので $\mathrm{N/C}$、また「単位長さあたりの電位差」なので $\mathrm{V/m}$ とも表せます。両者は同じ単位です。` }
      ]
    },
    {
      id: "ch10", num: 40, title: "磁気チャレンジ", sub: "難問・電磁誘導とローレンツ力", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`平行に置かれた2本の導線に、同じ向きの電流を流すと、導線どうしはどうなるか。`, opts: ["引き合う", "退け合う", "何も起こらない", "回転する"], ans: 0, exp: raw`一方の電流が作る磁場の中でもう一方が力を受けるため、同じ向きの電流どうしは引き合い、逆向きでは退け合います。アンペアの定義にも使われた現象です。` },
        { q: raw`磁場中を運動する荷電粒子の円運動の半径 $r = \frac{mv}{qB}$ について、速さが2倍になると半径はどうなるか。`, opts: ["1/2倍", "変わらない", "2倍", "4倍"], ans: 2, exp: raw`半径は速さに比例します。磁場を強くすると半径は小さくなり、周期は速さによらず一定になります。` },
        { q: raw`サイクロトロン（円形加速器）で荷電粒子を加速できるのは、回転の周期が何によらないためか。`, opts: ["粒子の質量", "粒子の速さ（半径が変わっても周期は一定）", "磁場の強さ", "電圧の大きさ"], ans: 1, exp: raw`円運動の周期 $T = \frac{2\pi m}{qB}$ は速さや半径によりません。そのため一定の周波数の交流電圧で、粒子が回るたびに加速し続けられます。` },
        { q: raw`自己インダクタンス $0.50\,\mathrm{H}$ のコイルの電流を、$0.10$ 秒間で $2.0\,\mathrm{A}$ から $0$ に変化させた。生じる誘導起電力の大きさは何 $\mathrm{V}$ か。`, opts: ["1.0 V", "5.0 V", "10 V", "20 V"], ans: 2, exp: raw`$|e| = L \frac{\Delta I}{\Delta t} = 0.50 \times \frac{2.0}{0.10} = 10\,\mathrm{V}$ です。電流の変化を妨げる向きに生じます。` },
        { q: raw`変圧器の鉄心に「うず電流」が流れると何が問題になるか。`, opts: ["電圧が上がりすぎる", "ジュール熱としてエネルギーが失われる", "磁石が弱くなる", "音がうるさくなるだけ"], ans: 1, exp: raw`鉄心内部に誘導電流が渦状に流れ、熱としてエネルギーが逃げてしまいます。対策として、薄い鉄板を重ねた積層鉄心が使われます。` },
        { q: raw`ホール効果（磁場中の導体に電流を流すと、垂直方向に電圧が生じる現象）の応用はどれか。`, opts: ["磁場センサーや電流センサー", "温度計", "スピーカー", "電池"], ans: 0, exp: raw`生じる電圧が磁場の強さに比例するため、磁場の測定や、回路を切らずに電流を測るクランプメーターなどに応用されています。` },
        { q: raw`コイルを貫く磁束が一定の割合で増えている。誘導電流が作る磁場の向きはどうなるか。`, opts: ["元の磁束を強める向き", "元の磁束の増加を妨げる向き", "磁束と垂直な向き", "向きは決まらない"], ans: 1, exp: raw`レンツの法則です。変化を妨げる向きでなければ、エネルギーが無から生まれることになってしまうため、この向きが必然です。` },
        { q: raw`交流発電機で生じる起電力が最大になるのは、コイル面がどのようなときか。`, opts: ["磁場と平行なとき（磁束の変化率が最大）", "磁場と垂直なとき", "回転が止まったとき", "常に一定"], ans: 0, exp: raw`起電力は磁束の時間変化に比例します。コイル面が磁場と平行な瞬間は磁束自体は0ですが、その変化率が最大になるため起電力も最大です。` },
        { q: raw`モーターが高速で回転するほど、電源から流れる電流が小さくなるのはなぜか。`, opts: ["抵抗が増えるから", "回転するコイルに逆向きの起電力（逆起電力）が生じるから", "磁石が弱くなるから", "摩擦が減るから"], ans: 1, exp: raw`回転するコイルは発電機としても働き、電源と逆向きの電圧を生じます。そのため実質の電圧が下がり、電流が抑えられます。回転を止めると大電流が流れて危険です。` },
        { q: raw`電磁波を波長の長い順に並べたものとして正しいものはどれか。`, opts: ["電波 ＞ 赤外線 ＞ 可視光 ＞ 紫外線 ＞ X線", "X線 ＞ 紫外線 ＞ 可視光 ＞ 赤外線 ＞ 電波", "可視光 ＞ 電波 ＞ X線 ＞ 赤外線 ＞ 紫外線", "赤外線 ＞ 電波 ＞ 紫外線 ＞ 可視光 ＞ X線"], ans: 0, exp: raw`波長は電波が最も長く、赤外線、可視光、紫外線、X線、γ線の順に短くなります。振動数と光子エネルギーは逆の順序です。` }
      ]
    },
    {
      id: "ch11", num: 41, title: "交流チャレンジ", sub: "難問・RLC回路と共振", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`抵抗 $30\,\Omega$、誘導リアクタンス $40\,\Omega$、容量リアクタンス $0\,\Omega$ の直列回路のインピーダンスは何 $\Omega$ か。`, opts: ["30 Ω", "50 Ω", "70 Ω", "1200 Ω"], ans: 1, exp: raw`$Z = \sqrt{R^2 + (X_L - X_C)^2} = \sqrt{30^2 + 40^2} = 50\,\Omega$ です（3:4:5の直角三角形）。` },
        { q: raw`RLC直列回路が共振しているとき、回路の電流と電源電圧の位相の関係はどうなるか。`, opts: ["電流が電圧より遅れる", "電流が電圧より進む", "位相がそろう（同位相）", "常に90°ずれる"], ans: 2, exp: raw`共振では $X_L$ と $X_C$ が打ち消し合い、回路は抵抗だけの場合と同じ振る舞いをするため、電流と電圧は同位相になります。力率は1です。` },
        { q: raw`交流回路の力率とは何を表すか。`, opts: ["電圧と電流の位相のずれの余弦（cosφ）で、実際に仕事に使われる割合", "電圧の最大値と実効値の比", "周波数の安定度", "抵抗の温度係数"], ans: 0, exp: raw`力率が小さい（位相のずれが大きい）回路では、電流が流れていても実際に消費される電力が小さくなります。電力会社が力率改善を求める理由です。` },
        { q: raw`$L = 0.010\,\mathrm{H}$、$C = 100\,\mathrm{\mu F}$ の直列回路の共振周波数はおよそ何 $\mathrm{Hz}$ か。`, opts: ["16 Hz", "160 Hz", "1600 Hz", "16 kHz"], ans: 1, exp: raw`$\sqrt{LC} = \sqrt{0.010 \times 100 \times 10^{-6}} = 1.0 \times 10^{-3}$ なので、$f = \frac{1}{2\pi \times 10^{-3}} \approx 160\,\mathrm{Hz}$ です。` },
        { q: raw`変圧器で、一次コイルの巻数が二次コイルの2倍のとき、二次側の電流は一次側の電流のおよそ何倍になるか（理想変圧器）。`, opts: ["2倍", "1/2倍", "4倍", "変わらない"], ans: 0, exp: raw`電力が保存されるため、電圧が半分になる分、電流は2倍になります。電圧は巻数に比例し、電流は巻数に反比例します。` },
        { q: raw`送電の際、電圧を高くして送る方がエネルギーの損失が少ないのはなぜか。`, opts: ["電線の抵抗が減るから", "同じ電力でも電流が小さくなり、I²R の損失が減るから", "電気が速く流れるから", "変圧が不要になるから"], ans: 1, exp: raw`送電線の発熱損失は電流の2乗に比例します。高電圧化で電流を小さくすると損失は大幅に減ります。家庭に届く前に変圧器で下げられます。` },
        { q: raw`交流をダイオードで整流しただけでは電圧が脈打つ（脈流）。これをなめらかにするために並列に入れる部品はどれか。`, opts: ["コイル", "コンデンサー", "抵抗", "変圧器"], ans: 1, exp: raw`コンデンサーが電圧の高いときに充電し、低いときに放電して補うため、波形がなめらかになります（平滑回路）。` },
        { q: raw`最大値が $200\,\mathrm{V}$ の交流電圧の実効値はおよそ何 $\mathrm{V}$ か。`, opts: ["100 V", "141 V", "200 V", "283 V"], ans: 1, exp: raw`実効値は最大値の $\frac{1}{\sqrt{2}}$ 倍で、$200 / 1.414 \approx 141\,\mathrm{V}$ です。` },
        { q: raw`コイルだけをつないだ交流回路で、電流の位相は電圧に対してどうなるか。`, opts: ["90°進む", "90°遅れる", "そろう", "180°ずれる"], ans: 1, exp: raw`コイルは電流の変化を妨げるため、電流は電圧より $\frac{1}{4}$ 周期（90°）遅れます。コンデンサーでは逆に電流が90°進みます。` },
        { q: raw`共振回路で、抵抗が小さいほど共振のピークはどうなるか。`, opts: ["なだらかになる", "鋭くなる（特定の周波数だけを強く通す）", "消える", "低周波へ移る"], ans: 1, exp: raw`抵抗が小さいほど共振周波数での電流が大きくなり、ピークが鋭くなります。ラジオの選局の鋭さ（選択度）はこれで決まります。` }
      ]
    },
    {
      id: "ch12", num: 42, title: "原子チャレンジ", sub: "難問・光子と原子核", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`光電効果で、金属の限界振動数より小さい振動数の光をいくら強く当てても電子が飛び出さないのはなぜか。`, opts: ["光が反射されるから", "光子1個のエネルギーが不足しているから", "金属が熱を持つから", "電子が足りないから"], ans: 1, exp: raw`電子を弾き出すのは光子1個との衝突で決まるため、1個あたりのエネルギー $h\nu$ が仕事関数に満たなければ、光子を増やしても（強くしても）電子は出ません。光の粒子性の決定的な証拠です。` },
        { q: raw`光子の運動量は $p = \frac{h}{\lambda}$ と表される。波長が半分になると運動量はどうなるか。`, opts: ["半分になる", "変わらない", "2倍になる", "4倍になる"], ans: 2, exp: raw`運動量は波長に反比例します。波長の短い（エネルギーの大きい）光子ほど運動量も大きくなります。コンプトン効果で確かめられました。` },
        { q: raw`ド・ブロイ波長は、運動量が大きい粒子ほどどうなるか。`, opts: ["長くなる", "短くなる", "変わらない", "質量だけで決まる"], ans: 1, exp: raw`$\lambda = \frac{h}{p}$ より、運動量が大きいほど波長は短くなります。日常の物体では波長が極端に短いため、波の性質は現れません。` },
        { q: raw`水素原子で、電子が $n = 3$ の準位から $n = 2$ の準位へ移るとき放出される光は、可視光の何色に近いか。エネルギー差は約 $1.9\,\mathrm{eV}$ とする。`, opts: ["赤", "緑", "青", "紫外線で見えない"], ans: 0, exp: raw`$1.9\,\mathrm{eV}$ は波長約 $656\,\mathrm{nm}$ の赤い光に相当し、水素のバルマー系列の代表的な輝線（Hα線）です。星雲が赤く光る原因にもなっています。` },
        { q: raw`半減期3日の放射性物質が $800\,\mathrm{g}$ ある。12日後に残っている量は何 $\mathrm{g}$ か。`, opts: ["200 g", "100 g", "50 g", "25 g"], ans: 2, exp: raw`12日は半減期4回分なので、$800 \times (\frac{1}{2})^4 = 800 / 16 = 50\,\mathrm{g}$ です。` },
        { q: raw`質量 $1\,\mathrm{g}$ がすべてエネルギーに変わると、およそ何 $\mathrm{J}$ になるか。光速を $3.0 \times 10^8\,\mathrm{m/s}$ とする。`, opts: ["$9 \times 10^{10}$ J", "$9 \times 10^{13}$ J", "$3 \times 10^{11}$ J", "$9 \times 10^{16}$ J"], ans: 1, exp: raw`$E = mc^2 = 1.0 \times 10^{-3} \times (3.0 \times 10^8)^2 = 9 \times 10^{13}\,\mathrm{J}$ です。わずか1 gでも莫大なエネルギーです。` },
        { q: raw`核反応の前後で保存される量の組み合わせとして正しいものはどれか。`, opts: ["質量数と原子番号（電荷）", "原子の個数と分子量", "中性子の数だけ", "体積と密度"], ans: 0, exp: raw`核反応式では、両辺で質量数の合計と原子番号（陽子の数＝電荷）の合計がそれぞれ等しくなります。これを使って未知の生成核を特定できます。` },
        { q: raw`X線が発生する仕組みとして正しいものはどれか。`, opts: ["核分裂で生まれる", "高速の電子が金属に衝突して急減速するときに電磁波として放出される", "原子が燃えるときに出る", "磁場の変化で生まれる"], ans: 1, exp: raw`制動放射と呼ばれる仕組みです。電子の運動エネルギーの一部がX線光子になります。X線管はこの原理でX線を作ります。` },
        { q: raw`コンプトン効果（X線が電子に散乱されると波長が長くなる現象）が示すことはどれか。`, opts: ["光が波だけであること", "光子が運動量をもつ粒子として振る舞うこと", "電子が波であること", "X線が音波であること"], ans: 1, exp: raw`散乱の前後でエネルギーと運動量の保存を考えると、光子を運動量をもつ粒子として扱うことで説明できます。光の粒子性の強い証拠です。` },
        { q: raw`放射線の遮蔽の組み合わせとして正しいものはどれか。`, opts: ["α線は紙、β線はアルミニウム板、γ線は鉛や厚いコンクリート", "すべて水で止まる", "すべて鉛でないと止まらない", "γ線は紙で止まる"], ans: 0, exp: raw`透過力の違いに応じた遮蔽が必要です。α線は電離作用が強い反面、紙1枚で止まります。γ線は透過力が大きい分、密度の高い物質を厚く使います。` }
      ]
    },
    {
      id: "ch13", num: 43, title: "総合チャレンジ①", sub: "難問・力学と熱の総合", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`質量 $0.50\,\mathrm{kg}$ の小球を、長さ $1.0\,\mathrm{m}$ の糸で吊るして振り子にした。最下点での速さが $3.0\,\mathrm{m/s}$ のとき、糸の張力はおよそ何 $\mathrm{N}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["4.9 N", "9.4 N", "14 N", "45 N"], ans: 1, exp: raw`最下点では張力と重力の差が向心力になるので、$T = mg + m\frac{v^2}{r} = 0.50 \times 9.8 + 0.50 \times \frac{9.0}{1.0} = 4.9 + 4.5 = 9.4\,\mathrm{N}$ です。` },
        { q: raw`初速度 $25\,\mathrm{m/s}$、角度 $45^\circ$ で投げたボールの水平到達距離はおよそ何 $\mathrm{m}$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["32 m", "64 m", "96 m", "128 m"], ans: 1, exp: raw`到達距離は $\frac{v_0^2 \sin 2\theta}{g} = \frac{25^2 \times 1}{9.8} \approx 64\,\mathrm{m}$ です。$45^\circ$ では $\sin 2\theta = 1$ になります。` },
        { q: raw`比熱 $0.90\,\mathrm{J/(g\cdot K)}$ の金属 $200\,\mathrm{g}$ に $3600\,\mathrm{J}$ の熱を加えた。温度上昇は何 $\mathrm{K}$ か。`, opts: ["10 K", "20 K", "40 K", "180 K"], ans: 1, exp: raw`$\Delta T = \frac{Q}{mc} = \frac{3600}{200 \times 0.90} = 20\,\mathrm{K}$ です。` },
        { q: raw`なめらかな水平面上で、質量 $1.0\,\mathrm{kg}$・速さ $6.0\,\mathrm{m/s}$ の小球Aが、静止した質量 $2.0\,\mathrm{kg}$ の小球Bに完全非弾性衝突した。衝突後の速さと、失われた運動エネルギーの割合はどれか。`, opts: ["2.0 m/s ・ 約67 %", "3.0 m/s ・ 50 %", "2.0 m/s ・ 33 %", "4.0 m/s ・ 約67 %"], ans: 0, exp: raw`運動量保存より $v = \frac{1.0 \times 6.0}{3.0} = 2.0\,\mathrm{m/s}$。運動エネルギーは $18\,\mathrm{J}$ から $6\,\mathrm{J}$ へ減るので、失われた割合は約 $67\,\%$ です。残りは熱や変形に変わります。` },
        { q: raw`断熱容器の中で、気体をゆっくり圧縮した（断熱圧縮）。圧力・体積・温度の変化として正しいものはどれか。`, opts: ["体積が減り、温度と圧力が上がる", "体積が減り、温度が下がる", "圧力だけが上がる", "温度は変わらない"], ans: 0, exp: raw`外部から仕事をされるため内部エネルギーが増えて温度が上がります。体積が減るので圧力はボイルの法則以上に大きく上がります。` },
        { q: raw`ばね定数 $50\,\mathrm{N/m}$ のばねに質量 $2.0\,\mathrm{kg}$ のおもりを吊るしたら、つりあいの位置でばねは自然長から何 $\mathrm{m}$ 伸びたか。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["0.20 m", "0.39 m", "0.49 m", "0.98 m"], ans: 1, exp: raw`つりあいより $kx = mg$ なので $x = \frac{2.0 \times 9.8}{50} = 0.39\,\mathrm{m}$ です。` },
        { q: raw`自動車が $72\,\mathrm{km/h}$ で走行中にブレーキをかけ、$40\,\mathrm{m}$ で停止した。加速度の大きさはおよそ何 $\mathrm{m/s^2}$ か。タイヤと路面の動摩擦係数に換算すると約いくらか。`, opts: ["5.0 m/s² ・ 約0.51", "10 m/s² ・ 約1.0", "2.5 m/s² ・ 約0.26", "20 m/s² ・ 約2.0"], ans: 0, exp: raw`$72\,\mathrm{km/h} = 20\,\mathrm{m/s}$。$0 - 20^2 = 2a \times 40$ より $a = -5.0\,\mathrm{m/s^2}$。摩擦による減速なので $\mu' = a / g \approx 0.51$ です。` },
        { q: raw`熱効率 $25\,\%$ の熱機関が $400\,\mathrm{J}$ の仕事をした。高温熱源から受け取った熱量は何 $\mathrm{J}$ か。`, opts: ["100 J", "1000 J", "1600 J", "2000 J"], ans: 2, exp: raw`効率 $= W / Q$ より $Q = 400 / 0.25 = 1600\,\mathrm{J}$ です。残りの $1200\,\mathrm{J}$ は低温熱源へ捨てられます。` },
        { q: raw`地球の半径の2倍の高度を回る人工衛星の公転周期は、地表すれすれを回る衛星の周期のおよそ何倍か。中心からの距離は地表すれすれの3倍とする。`, opts: ["3倍", "5.2倍", "9倍", "27倍"], ans: 1, exp: raw`ケプラーの第3法則より $T \propto r^{3/2}$ なので、$3^{3/2} = \sqrt{27} \approx 5.2$ 倍です。` },
        { q: raw`単振動する物体の全エネルギー（力学的エネルギー）は、振幅 $A$ と角振動数 $\omega$ を使ってどう表されるか。質量を $m$ とする。`, opts: ["(1/2)mω²A²", "mωA", "(1/2)mA²", "mgA"], ans: 0, exp: raw`端の位置での弾性（復元力）の位置エネルギーがそのまま全エネルギーになり、$E = \frac{1}{2}m\omega^2 A^2$ です。振幅の2乗に比例します。` }
      ]
    },
    {
      id: "ch14", num: 44, title: "総合チャレンジ②", sub: "難問・波と電磁気の総合", icon: "👹", color: "#991b1b", challenge: true,
      questions: [
        { q: raw`振動数 $1000\,\mathrm{Hz}$ の音を出す音源が、速さ $20\,\mathrm{m/s}$ で観測者から遠ざかっている。観測者に聞こえる振動数はおよそ何 $\mathrm{Hz}$ か。音速を $340\,\mathrm{m/s}$ とする。`, opts: ["944 Hz", "1000 Hz", "1059 Hz", "1200 Hz"], ans: 0, exp: raw`$f' = f \frac{V}{V + v_s} = 1000 \times \frac{340}{360} \approx 944\,\mathrm{Hz}$ です。遠ざかる場合は低くなります。` },
        { q: raw`$8\,\Omega$ の抵抗、$6\,\Omega$ の誘導リアクタンス、$6\,\Omega$ の容量リアクタンスを直列につないだ回路に、実効値 $100\,\mathrm{V}$ の交流を加えた。流れる電流の実効値は何 $\mathrm{A}$ か。`, opts: ["6.25 A", "10 A", "12.5 A", "5 A"], ans: 2, exp: raw`$X_L = X_C$ で打ち消し合い、$Z = R = 8\,\Omega$。電流は $100 / 8 = 12.5\,\mathrm{A}$ です（共振状態）。` },
        { q: raw`磁束密度 $0.20\,\mathrm{T}$ の磁場に、速さ $5.0 \times 10^5\,\mathrm{m/s}$ の電子が垂直に入射した。電子が受けるローレンツ力の大きさはおよそ何 $\mathrm{N}$ か。電気素量を $1.6 \times 10^{-19}\,\mathrm{C}$ とする。`, opts: ["$1.6 \times 10^{-14}$ N", "$1.6 \times 10^{-19}$ N", "$3.2 \times 10^{-14}$ N", "$8.0 \times 10^{-15}$ N"], ans: 0, exp: raw`$f = qvB = 1.6 \times 10^{-19} \times 5.0 \times 10^5 \times 0.20 = 1.6 \times 10^{-14}\,\mathrm{N}$ です。力は速度と磁場の両方に垂直な向きにはたらきます。` },
        { q: raw`波長 $500\,\mathrm{nm}$ の光を回折格子（格子定数 $2.0\,\mathrm{\mu m}$）に当てた。1次の明線ができる角度 $\theta$ について、$\sin\theta$ の値はいくらか。`, opts: ["0.25", "0.50", "0.75", "1.0"], ans: 0, exp: raw`$d \sin\theta = m\lambda$ より $\sin\theta = \frac{500 \times 10^{-9}}{2.0 \times 10^{-6}} = 0.25$ です。` },
        { q: raw`コンデンサー（$20\,\mathrm{\mu F}$）と抵抗（$10\,\Omega$）と電池（$10\,\mathrm{V}$）の回路で、充電が完了したときにコンデンサーに蓄えられる電荷は何 $\mathrm{C}$ か。`, opts: ["$2.0 \times 10^{-4}$ C", "$2.0 \times 10^{-3}$ C", "200 C", "$5.0 \times 10^{-5}$ C"], ans: 0, exp: raw`充電完了後はコンデンサーの電圧が電池と等しくなるので、$Q = CV = 20 \times 10^{-6} \times 10 = 2.0 \times 10^{-4}\,\mathrm{C}$ です。` },
        { q: raw`弦の長さ $0.60\,\mathrm{m}$、弦を伝わる波の速さ $120\,\mathrm{m/s}$ のとき、基本振動数と第3倍音の振動数はどれか。`, opts: ["基本 100 Hz ・ 第3倍音 300 Hz", "基本 200 Hz ・ 第3倍音 600 Hz", "基本 100 Hz ・ 第3倍音 200 Hz", "基本 50 Hz ・ 第3倍音 150 Hz"], ans: 0, exp: raw`基本振動では $\lambda = 2L = 1.2\,\mathrm{m}$ なので $f = 120 / 1.2 = 100\,\mathrm{Hz}$。弦では全ての整数倍の倍音が出るので、第3倍音は $300\,\mathrm{Hz}$ です。` },
        { q: raw`一次コイルに実効値 $100\,\mathrm{V}$、巻数 $200$、二次コイルの巻数 $50$ の変圧器がある。二次コイルに $4\,\Omega$ の抵抗をつないだとき流れる電流は何 $\mathrm{A}$ か。`, opts: ["6.25 A", "25 A", "1.56 A", "100 A"], ans: 0, exp: raw`二次電圧は巻数比で $100 \times \frac{50}{200} = 25\,\mathrm{V}$。電流は $25 / 4 = 6.25\,\mathrm{A}$ です。` },
        { q: raw`光ファイバーで信号を送るとき、電気信号より光を使う利点として正しいものはどれか。`, opts: ["損失が少なく、大量の情報を高速に送れる", "曲げても折れない", "電気より速く進む", "熱を出さない"], ans: 0, exp: raw`光は全反射でほぼ損失なく伝わり、周波数が高いため大量の情報を載せられます。伝わる速さ自体は真空中の光速が上限です。` },
        { q: raw`2つのスリットからの光がスクリーン上で作る干渉縞について、スリットの間隔を広げると縞の間隔はどうなるか。`, opts: ["広くなる", "狭くなる", "変わらない", "縞が消える"], ans: 1, exp: raw`$\Delta x = \frac{\lambda L}{d}$ より、間隔はスリット間隔 $d$ に反比例します。$d$ を広げると縞は細かくなります。` },
        { q: raw`電磁波のうち、リモコンの信号や熱源の検知に使われるものはどれか。`, opts: ["紫外線", "赤外線", "X線", "マイクロ波だけ"], ans: 1, exp: raw`赤外線は可視光より波長が長く、熱作用があります。リモコン、サーモグラフィー、暖房器具などに広く使われます。` }
      ]
    },
    {
      id: "ch15", num: 45, title: "最終チャレンジ", sub: "難問・全範囲グランドフィナーレ", icon: "👹", color: "#7f1d1d", challenge: true,
      questions: [
        { q: raw`質量 $2.0\,\mathrm{kg}$ の物体が、ばね定数 $200\,\mathrm{N/m}$ のばねにつながれてなめらかな水平面で単振動している。周期はおよそ何秒か。`, opts: ["0.31秒", "0.63秒", "1.3秒", "2.0秒"], ans: 1, exp: raw`$T = 2\pi\sqrt{\frac{m}{k}} = 2\pi\sqrt{\frac{2.0}{200}} = 2\pi \times 0.10 \approx 0.63$ 秒です。` },
        { q: raw`温度 $27^\circ\mathrm{C}$、圧力 $1.0 \times 10^5\,\mathrm{Pa}$ の理想気体 $1.0\,\mathrm{mol}$ の体積はおよそ何 $\mathrm{L}$ か。気体定数を $8.3\,\mathrm{J/(mol\cdot K)}$ とする。`, opts: ["12 L", "25 L", "22 L", "30 L"], ans: 1, exp: raw`$V = \frac{nRT}{p} = \frac{1.0 \times 8.3 \times 300}{1.0 \times 10^5} = 0.0249\,\mathrm{m^3} \approx 25\,\mathrm{L}$ です。$0^\circ\mathrm{C}$ では約 $22.4\,\mathrm{L}$ になります。` },
        { q: raw`振動数 $5.0 \times 10^{14}\,\mathrm{Hz}$ の光の光子1個のエネルギーはおよそ何 $\mathrm{J}$ か。プランク定数を $6.6 \times 10^{-34}\,\mathrm{J\cdot s}$ とする。`, opts: ["$3.3 \times 10^{-19}$ J", "$3.3 \times 10^{-20}$ J", "$1.3 \times 10^{-19}$ J", "$6.6 \times 10^{-19}$ J"], ans: 0, exp: raw`$E = h\nu = 6.6 \times 10^{-34} \times 5.0 \times 10^{14} = 3.3 \times 10^{-19}\,\mathrm{J}$ です（約 $2\,\mathrm{eV}$、緑色の光に相当）。` },
        { q: raw`なめらかな斜面（傾角 $30^\circ$）の上端から、質量の違う2つの物体を同時に静かに滑らせた。下端に達する時間はどうなるか。`, opts: ["重い方が速い", "軽い方が速い", "同じになる", "形による"], ans: 2, exp: raw`加速度 $a = g \sin\theta$ は質量によらないため、到達時間も速さも同じになります。ガリレオの斜面の実験と同じ考え方です。` },
        { q: raw`$100\,\mathrm{V}$ の電圧で $5.0\,\mathrm{A}$ の電流が流れるモーターが、$10\,\mathrm{kg}$ の荷物を $10$ 秒で $20\,\mathrm{m}$ 持ち上げた。モーターの効率はおよそ何 $\%$ か。重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["20 %", "39 %", "49 %", "98 %"], ans: 1, exp: raw`電気エネルギーは $100 \times 5.0 \times 10 = 5000\,\mathrm{J}$。位置エネルギーの増加は $10 \times 9.8 \times 20 = 1960\,\mathrm{J}$。効率は $1960 / 5000 \approx 39\,\%$ です。` },
        { q: raw`音速 $340\,\mathrm{m/s}$ の空気中で、開管と閉管が同じ基本振動数を出すとき、閉管の長さは開管の長さの何倍か。`, opts: ["2倍", "半分", "同じ", "4倍"], ans: 1, exp: raw`開管は $f = \frac{v}{2L}$、閉管は $f = \frac{v}{4L}$ なので、同じ振動数では閉管の長さは開管の半分です。` },
        { q: raw`宇宙空間で静止していたロケットが、ガスを噴射して速さを得た。ロケットとガスの運動量の合計はどうなっているか。`, opts: ["増えた", "減った", "0のまま保存されている", "ガスの分だけ増えた"], ans: 2, exp: raw`外力がなければ全体の運動量は保存されます。はじめ0だったので、ロケットの運動量とガスの運動量は大きさが等しく逆向きで、合計0のままです。` },
        { q: raw`半減期が30年の放射性物質について、120年後に残る割合は元の何倍か。`, opts: ["1/4倍", "1/8倍", "1/16倍", "1/32倍"], ans: 2, exp: raw`120年は半減期4回分なので $(\frac{1}{2})^4 = \frac{1}{16}$ 倍です。` },
        { q: raw`コイルとコンデンサーの共振回路が、ラジオやテレビの受信に使われる理由はどれか。`, opts: ["特定の周波数の信号だけを強く取り出せるから", "電波を増幅し続けるから", "雑音を熱に変えるから", "アンテナが不要になるから"], ans: 0, exp: raw`共振周波数を変えることで、数多くの電波の中から目的の周波数だけを選んで取り出せます。これが選局の原理です。` },
        { q: raw`物理量の次元（単位の組み立て）の観点で、エネルギーの単位 $\mathrm{J}$ を基本単位で正しく表したものはどれか。`, opts: ["kg·m²/s²", "kg·m/s²", "kg·m²/s", "kg/s²"], ans: 0, exp: raw`$J = N \cdot m = (kg \cdot m/s^2) \cdot m = kg \cdot m^2/s^2$ です。式の正しさを単位で確かめる「次元解析」は、難問を解くときの強力な検算方法です。` }
      ]
    }

const EXTRA_QUESTIONS = {
  st1: [
    { q: raw`家から駅まで $1200\,\mathrm{m}$ の道のりを10分間で歩いた。平均の速さは何 $\mathrm{m/s}$ か。`, opts: ["1.2 m/s", "12 m/s", "2.0 m/s", "20 m/s"], ans: 2, exp: raw`10分間は600秒なので、速さ $= 1200 / 600 = 2.0\,\mathrm{m/s}$ です。` },
    { q: raw`物体の速さが2秒間に $4.0\,\mathrm{m/s}$ から $10\,\mathrm{m/s}$ に増えた。この物体の加速度は何 $\mathrm{m/s^2}$ か。`, opts: ["3.0 m/s²", "1.5 m/s²", "5.0 m/s²", "7.0 m/s²"], ans: 0, exp: raw`加速度 $a = \frac{10 - 4.0}{2} = 3.0\,\mathrm{m/s^2}$ です。` },
    { q: raw`静止した状態から自由落下する物体が、3秒間に落下する距離はおよそ何 $\mathrm{m}$ か。ただし重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["15 m", "29 m", "88 m", "44 m"], ans: 3, exp: raw`落下距離 $y = \frac{1}{2}gt^2 = \frac{1}{2} \times 9.8 \times 3^2 = 44.1$ なので、およそ $44\,\mathrm{m}$ です。` },
    { q: raw`物体を静かに落とし始めてから2秒後の速さはおよそ何 $\mathrm{m/s}$ か。ただし重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["9.8 m/s", "20 m/s", "29 m/s", "39 m/s"], ans: 1, exp: raw`自由落下の速さは $v = gt = 9.8 \times 2 = 19.6$ なので、およそ $20\,\mathrm{m/s}$ です。` },
    { q: raw`速さと時間の関係を表す $v$-$t$ グラフで、グラフと時間軸に囲まれた面積が表す物理量はどれか。`, opts: ["加速度", "力", "変位（移動距離）", "仕事"], ans: 2, exp: raw`面積は速さ $\times$ 時間に対応し、変位（移動距離）を表します。` },
    { q: raw`小球を地面から真上に $19.6\,\mathrm{m/s}$ の速さで投げ上げた。小球が最高点に達するのは何秒後か。ただし重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["2秒", "1秒", "3秒", "4秒"], ans: 0, exp: raw`最高点では速さが0になるので、$0 = 19.6 - 9.8t$ より $t = 2$ 秒です。` },
    { q: raw`自動車の速さ $72\,\mathrm{km/h}$ は何 $\mathrm{m/s}$ か。`, opts: ["10 m/s", "36 m/s", "72 m/s", "20 m/s"], ans: 3, exp: raw`$72\,\mathrm{km/h} = \frac{72000\,\mathrm{m}}{3600} = 20\,\mathrm{m/s}$ です（3600は1時間の秒数）。` }

  st2: [
    { q: raw`質量 $5.0\,\mathrm{kg}$ の物体にはたらく重力の大きさは何 $\mathrm{N}$ か。ただし重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["9.8 N", "25 N", "98 N", "49 N"], ans: 3, exp: raw`重力の大きさは $mg = 5.0 \times 9.8 = 49\,\mathrm{N}$ です。` },
    { q: raw`ロケットがガスを後方へ噴射することで前方へ進むのは、どの法則によるものか。`, opts: ["慣性の法則", "作用・反作用の法則", "フックの法則", "エネルギー保存の法則"], ans: 1, exp: raw`ガスを押す力の反作用として、ロケットはガスから逆向きの力を受けるため進みます。` },
    { q: raw`質量 $2.0\,\mathrm{kg}$ の物体が加速度 $3.0\,\mathrm{m/s^2}$ で運動している。この物体にはたらく合力は何 $\mathrm{N}$ か。`, opts: ["6.0 N", "1.5 N", "5.0 N", "12 N"], ans: 0, exp: raw`運動方程式 $F = ma = 2.0 \times 3.0 = 6.0\,\mathrm{N}$ です。` },
    { q: raw`水平な粗い面の上で質量 $2.0\,\mathrm{kg}$ の物体が滑っている。動摩擦係数が $0.25$ のとき、動摩擦力の大きさは何 $\mathrm{N}$ か。ただし重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["2.5 N", "9.8 N", "4.9 N", "20 N"], ans: 2, exp: raw`動摩擦力 $f = \mu' mg = 0.25 \times 2.0 \times 9.8 = 4.9\,\mathrm{N}$ です。` },
    { q: raw`質量 $3.0\,\mathrm{kg}$ の物体を糸でつるして静止させた。糸の張力の大きさは何 $\mathrm{N}$ か。ただし重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["9.8 N", "29 N", "20 N", "39 N"], ans: 1, exp: raw`力のつりあいから張力は重力と等しく、$mg = 3.0 \times 9.8 = 29.4$ なのでおよそ $29\,\mathrm{N}$ です。` },
    { q: raw`ばね定数 $200\,\mathrm{N/m}$ のばねに $10\,\mathrm{N}$ の力を加えた。ばねの伸びは何 $\mathrm{cm}$ か。`, opts: ["2.0 cm", "10 cm", "20 cm", "5.0 cm"], ans: 3, exp: raw`フックの法則 $F = kx$ より $x = \frac{10}{200} = 0.050\,\mathrm{m} = 5.0\,\mathrm{cm}$ です。` },
    { q: raw`摩擦のない水平な面の上を滑る物体にはたらく合力は0である。この物体の運動はどうなるか。`, opts: ["だんだん遅くなって止まる", "速さが増し続ける", "同じ速さでまっすぐ進み続ける", "円を描いて進む"], ans: 2, exp: raw`合力が0のとき速度は変化しないので、物体は等速直線運動を続けます（慣性の法則）。` }

  st3: [
    { q: raw`質量 $2.0\,\mathrm{kg}$ の物体が、基準面から $5.0\,\mathrm{m}$ の高さにある。重力による位置エネルギーは何 $\mathrm{J}$ か。ただし重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["49 J", "98 J", "150 J", "200 J"], ans: 1, exp: raw`位置エネルギー $U = mgh = 2.0 \times 9.8 \times 5.0 = 98\,\mathrm{J}$ です。` },
    { q: raw`重いかばんを手に持って、水平な道をまっすぐ歩いた。この間、重力がかばんにした仕事はどうなるか。`, opts: ["正の仕事をした", "負の仕事をした", "仕事は0である", "かばんの質量に比例する"], ans: 2, exp: raw`重力の向きと移動の向きが垂直なので、重力のする仕事は0です。` },

    { q: raw`高さ $20\,\mathrm{m}$ の場所から物体を静かに落とした。地面に達する直前の速さはおよそ何 $\mathrm{m/s}$ か。ただし重力加速度を $9.8\,\mathrm{m/s^2}$ とする。`, opts: ["10 m/s", "14 m/s", "28 m/s", "20 m/s"], ans: 3, exp: raw`力学的エネルギー保存 $mgh = \frac{1}{2}mv^2$ より $v = \sqrt{2 \times 9.8 \times 20} = \sqrt{392} \approx 20\,\mathrm{m/s}$ です。` },
    { q: raw`質量 $1.0\,\mathrm{kg}$ の物体の速さが $2.0\,\mathrm{m/s}$ から $4.0\,\mathrm{m/s}$ に増えた。運動エネルギーの増加は何 $\mathrm{J}$ か。`, opts: ["2.0 J", "4.0 J", "6.0 J", "8.0 J"], ans: 2, exp: raw`増加分は $\frac{1}{2} \times 1.0 \times (4.0^2 - 2.0^2) = \frac{1}{2} \times 12 = 6.0\,\mathrm{J}$ です。` },
    { q: raw`$600\,\mathrm{J}$ の仕事を10秒間で行った。この仕事率は何 $\mathrm{W}$ か。`, opts: ["6.0 W", "60 W", "600 W", "6000 W"], ans: 1, exp: raw`仕事率 $P = \frac{W}{t} = \frac{600}{10} = 60\,\mathrm{W}$ です。` },

  st4: [

    { q: raw`2つの物体の間の距離を2倍にした。2物体間にはたらく万有引力の大きさはもとの何倍になるか。`, opts: ["2倍", "4倍", "1/2倍", "1/4倍"], ans: 3, exp: raw`万有引力は距離の2乗に反比例するので、距離が2倍になると $\frac{1}{2^2} = \frac{1}{4}$ 倍になります。` },
    { q: raw`等速円運動をする物体が、1分間に30回転した。この物体の周期は何秒か。`, opts: ["2秒", "0.5秒", "30秒", "90秒"], ans: 0, exp: raw`周期は1回転にかかる時間なので、$60 \div 30 = 2$ 秒です。` },
    { q: raw`半径 $2.0\,\mathrm{m}$ の円周上を速さ $4.0\,\mathrm{m/s}$ で等速円運動する物体の向心加速度の大きさは何 $\mathrm{m/s^2}$ か。`, opts: ["2.0 m/s²", "4.0 m/s²", "8.0 m/s²", "16 m/s²"], ans: 2, exp: raw`向心加速度 $a = \frac{v^2}{r} = \frac{4.0^2}{2.0} = 8.0\,\mathrm{m/s^2}$ です。` },
    { q: raw`物体が力積を受けると、物体の何が変化するか。`, opts: ["運動エネルギー", "運動量", "質量", "温度"], ans: 1, exp: raw`力積は運動量の変化と等しくなります（運動量の変化 $=$ 力 $\times$ 時間）。` },
    { q: raw`ドアの蝶番から $0.50\,\mathrm{m}$ 離れた位置に、ドアに垂直に $20\,\mathrm{N}$ の力を加えた。力のモーメントの大きさは何 $\mathrm{N\cdot m}$ か。`, opts: ["40 N·m", "5.0 N·m", "20 N·m", "10 N·m"], ans: 3, exp: raw`力のモーメント $M = Fl = 20 \times 0.50 = 10\,\mathrm{N\cdot m}$ です。` }

  st5: [

    { q: raw`ある物体に $500\,\mathrm{J}$ の熱を加えたら、温度が $5.0\,\mathrm{K}$ 上がった。この物体の熱容量は何 $\mathrm{J/K}$ か。`, opts: ["100 J/K", "50 J/K", "500 J/K", "2500 J/K"], ans: 0, exp: raw`熱容量 $C = \frac{Q}{\Delta T} = \frac{500}{5.0} = 100\,\mathrm{J/K}$ です。` },
    { q: raw`一定量の気体の温度を一定に保ちながら、圧力をもとの2倍にした。気体の体積はもとの何倍になるか。`, opts: ["2倍", "1/2倍", "変わらない", "1/4倍"], ans: 1, exp: raw`ボイルの法則 $pV = $ 一定より、圧力が2倍になると体積は $\frac{1}{2}$ 倍になります。` },
    { q: raw`一定量の気体の圧力を一定に保ちながら、絶対温度をもとの2倍にした。気体の体積はもとの何倍になるか。`, opts: ["1/2倍", "変わらない", "4倍", "2倍"], ans: 3, exp: raw`シャルルの法則 $\frac{V}{T} = $ 一定より、体積は絶対温度に比例するので2倍になります。` },

    { q: raw`気体が外部から $300\,\mathrm{J}$ の仕事をされ、同時に $100\,\mathrm{J}$ の熱を外部に放出した。気体の内部エネルギーの変化はどれか。`, opts: ["100 J 減少", "400 J 増加", "200 J 増加", "変化しない"], ans: 2, exp: raw`熱力学第1法則より、内部エネルギーの変化は（加えられた熱）$-$（外部にした仕事）$= -100 - (-300) = 200\,\mathrm{J}$ の増加です。` },

  st6: [

    { q: raw`大きな山に向かって声を出したところ、2秒後にこだまが返ってきた。音の速さを $340\,\mathrm{m/s}$ として、山までの距離は何 $\mathrm{m}$ か。`, opts: ["170 m", "680 m", "340 m", "1020 m"], ans: 2, exp: raw`音は往復で2秒かかるので片道は1秒、距離は $340 \times 1 = 340\,\mathrm{m}$ です。` },
    { q: raw`ひもを伝わる波が、壁に固定された端（固定端）で反射するとどうなるか。`, opts: ["そのままの形で返ってくる", "山と谷が逆になって返ってくる", "消えてなくなる", "速さが2倍になって返ってくる"], ans: 1, exp: raw`固定端反射では位相が反転し、山は谷に、谷は山になって返ってきます。` },
    { q: raw`振動数 $400\,\mathrm{Hz}$ の警笛を鳴らす車両が、速さ $68\,\mathrm{m/s}$ で静止した観測者に近づいている。観測者が聞く音の振動数は何 $\mathrm{Hz}$ か。ただし音の速さを $340\,\mathrm{m/s}$ とする。`, opts: ["320 Hz", "400 Hz", "480 Hz", "500 Hz"], ans: 3, exp: raw`ドップラー効果より $f' = \frac{340}{340 - 68} \times 400 = 500\,\mathrm{Hz}$ です。` },
    { q: raw`音の大きさ（強さ）は、音波の何によって決まるか。`, opts: ["振動数", "波長", "振幅", "伝わる速さ"], ans: 2, exp: raw`音の大きさは振幅で決まります。振動数は音の高さを決めます。` }

    { q: raw`焦点距離 $20\,\mathrm{cm}$ の凸レンズから $30\,\mathrm{cm}$ 離れた位置に物体を置いた。像ができるのはレンズから何 $\mathrm{cm}$ の位置か。`, opts: ["12 cm", "30 cm", "45 cm", "60 cm"], ans: 3, exp: raw`レンズの式 $\frac{1}{30} + \frac{1}{b} = \frac{1}{20}$ より $\frac{1}{b} = \frac{1}{60}$、つまり $b = 60\,\mathrm{cm}$（倒立実像）です。` },
    { q: raw`光が細いすき間を通るとき、すき間の後ろ側に回り込むように広がる現象を何というか。`, opts: ["反射", "屈折", "回折", "全反射"], ans: 2, exp: raw`波が障害物の裏側へ回り込んで広がる現象を回折といいます。` },

    { q: raw`真空中の光の速さを $3.0 \times 10^8\,\mathrm{m/s}$、水中での光の速さを $2.25 \times 10^8\,\mathrm{m/s}$ とする。水の屈折率はおよそいくらか。`, opts: ["0.75", "1.0", "1.3", "2.3"], ans: 2, exp: raw`屈折率 $n = \frac{3.0 \times 10^8}{2.25 \times 10^8} \approx 1.3$ です。` },

  st8: [
    { q: raw`$3\,\Omega$ の抵抗と $6\,\Omega$ の抵抗を直列に接続した。合成抵抗は何 $\Omega$ か。`, opts: ["2 Ω", "3 Ω", "9 Ω", "18 Ω"], ans: 2, exp: raw`直列接続の合成抵抗は和になるので $3 + 6 = 9\,\Omega$ です。` },

    { q: raw`$6\,\mathrm{V}$ の電源に $2\,\Omega$ の抵抗と $4\,\Omega$ の抵抗を直列に接続した。$4\,\Omega$ の抵抗の両端の電圧は何 $\mathrm{V}$ か。`, opts: ["2 V", "3 V", "4 V", "6 V"], ans: 2, exp: raw`回路の電流は $\frac{6}{2 + 4} = 1.0\,\mathrm{A}$ なので、電圧は $1.0 \times 4 = 4\,\mathrm{V}$ です。` },

    { q: raw`100回巻きのコイルを貫く磁束が、2秒間に $0.60\,\mathrm{Wb}$ 変化した。コイルに生じる誘導起電力の大きさは何 $\mathrm{V}$ か。`, opts: ["3.0 V", "12 V", "30 V", "120 V"], ans: 2, exp: raw`誘導起電力 $V = N \frac{\Delta \Phi}{\Delta t} = 100 \times \frac{0.60}{2} = 30\,\mathrm{V}$ です。` },

  // Sound Effects via Web Audio API (Safari & mobile safe)
  let audioCtx = null;
  function playTone(type) {
    if (!appData.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (type === "ok") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.08);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.start(now); osc.stop(now + 0.28);
      } else if (type === "ng") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(175, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === "clear") {
        osc.type = "sine";
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.09));
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
      }
    } catch (e) {}
  }

    const instant = new Date(Date.now() + (offsetDays || 0) * 86400000);
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" }).format(instant);
